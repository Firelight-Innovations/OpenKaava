# cargo-deny: what is vendored into this binary, and under what terms.
#
# This answers a question that only starts being asked once a repository is
# public — "what am I actually shipping when I ship your app" — and it answers
# it about the whole transitive tree, which is the only place the answer can be
# wrong in an interesting way. A Tauri dependency graph is several hundred
# crates deep and nobody reads it by hand.
#
# `cargo deny check` is deliberately NOT part of `pnpm lint`, and so not part of
# `pnpm verify`. The advisories check fetches the RustSec database over the
# network, and `pnpm verify` is a gate that has to pass on a plane. It runs as
# `pnpm lint:deps` locally and as its own CI job, on the grounds that supply
# chain and correctness are different questions asked at different cadences —
# a dependency that was clean yesterday can be a finding today with no commit
# in between, which is exactly the failure mode a per-commit gate cannot model.

# There is no [graph] section, and the omission is the decision. Left empty,
# cargo-deny resolves every target rather than just the one this repo builds
# for today, so a Linux-only dependency is checked even though nothing here
# builds on Linux yet. Pinning to x86_64-pc-windows-msvc would make the report
# shorter and quietly stop answering the question the moment platform support
# widens.

[advisories]
# A yanked crate is a maintainer saying "do not use this version," and the
# lockfile is where that gets ignored by accident. Treat it as an error rather
# than the default warning: the fix is `cargo update -p <crate>`, which is
# cheap, and a warning in a job nobody fails is a warning nobody reads.
yanked = "deny"

# The first real run, 2026-08-18: zero vulnerabilities, zero license problems,
# and sixteen `unmaintained` advisories. Every one of them is transitive through
# Tauri, none has a safe upgrade, and none is a vulnerability — `unmaintained`
# says nobody is answering the door, not that something is wrong inside.
#
# They are ignored by name rather than by turning the class off, so a real
# advisory against any of these crates still fails the check, and so this list
# reads as sixteen decisions rather than one shrug. Each entry is removed when
# Tauri drops the dependency; `cargo deny check advisories` naming a crate that
# is no longer in the tree is itself an error, so this list cannot rot silently.
ignore = [
  # proc-macro-error, a build-time macro helper. Build-time only: nothing it
  # touches is linked into the shipped binary.
  "RUSTSEC-2024-0370",

  # The gtk-rs GTK3 bindings, ten crates, via Tauri's Linux backend. This app
  # is Windows-only and never compiles them — they are in `Cargo.lock` because
  # a lockfile records every platform's resolution, not because they are built.
  # There is deliberately no `[graph] targets` narrowing above, so they are
  # reported rather than hidden; this is where they get answered. The day a
  # Linux target is supported, these ten come back as a real question.
  "RUSTSEC-2024-0411",
  "RUSTSEC-2024-0412",
  "RUSTSEC-2024-0413",
  "RUSTSEC-2024-0414",
  "RUSTSEC-2024-0415",
  "RUSTSEC-2024-0416",
  "RUSTSEC-2024-0417",
  "RUSTSEC-2024-0418",
  "RUSTSEC-2024-0419",
  "RUSTSEC-2024-0420",

  # The rust-unic Unicode crates, five of them, reached through
  # urlpattern -> tauri-utils. The advisory says plainly that no safe upgrade
  # exists; the fix has to come from Tauri replacing urlpattern.
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",

  # zbus_names, zvariant and zvariant_derive, reached through zbus ->
  # tauri-plugin-opener's D-Bus backend for Linux and the BSDs. Added
  # 2026-10-26. They were folded into zbus and are no longer published on their
  # own, so no safe upgrade exists until zbus stops depending on them. Like the
  # gtk-rs crates above, they are never compiled for Windows.
  "RUSTSEC-2026-0370",
  "RUSTSEC-2026-0371",
  "RUSTSEC-2026-0372",
]

[licenses]
# An allow-list, not a deny-list, and that is what makes the GPL question
# answer itself. cargo-deny denies anything not named here, so GPL-2.0,
# GPL-3.0, AGPL-3.0, LGPL and the rest are findings by construction, along with
# any license nobody has looked at yet. A deny-list would have to predict the
# name of the thing we are trying to keep out, which is the wrong way round.
#
# A GPL-family transitive dependency is a real finding and not something to
# quietly add to this list. The reason the core is Apache-2.0 in the first
# place is that copyleft anywhere near it gives someone an argument that the
# private tools loading into this shell are derivative works; pulling copyleft
# in through a dependency reaches the same place by a longer road.
# This list names only licenses the tree actually resolves to today. An
# allowance matching nothing is reported as an "unmatched license allowance"
# warning on every run, and a check that prints warnings nobody acts on is a
# check people stop reading — so `ISC` and `Unicode-DFS-2016` were removed after
# the first run rather than left in as reasonable-sounding guesses. Adding one
# back when a crate arrives under it is a one-line decision, which is the right
# size for that decision to be.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",

    # ISC, added 2026-08-20 — the "one-line decision" the paragraph above
    # describes, taken. It arrives through `inotify` and `inotify-sys` under
    # `notify`, the file watcher the plugin reload loop uses to notice a
    # rebuilt core.
    #
    # Both are Linux-only and this app is Windows-only, so neither is compiled
    # here. They are a finding anyway because there is deliberately no
    # `[graph] targets` narrowing above — which is the omission working as
    # intended rather than a false positive to suppress. Answering it in
    # `allow` rather than `exceptions` follows the standing rule at the foot of
    # this file: widen for a license, never for a crate.
    #
    # ISC is permissive, OSI-approved and FSF Free/Libre — functionally MIT
    # with tidier wording, and the license OpenBSD publishes under. It carries
    # no reciprocity, so it raises none of the derivative-work question that
    # keeps the GPL family off this list.
    "ISC",

    # CDLA-Permissive-2.0, added 2026-08-21 — the same one-line decision, taken
    # for the in-app updater.
    #
    # It arrives through `webpki-root-certs`, under `rustls-platform-verifier`,
    # under `reqwest`. `reqwest` was already here through Tauri; what
    # `tauri-plugin-updater` adds is the TLS stack it needs to fetch
    # `latest.json` and an installer over HTTPS from a host we do not control.
    #
    # It is a **data** license, not a code license, and that is why it is
    # unfamiliar: the crate is Mozilla's CA root store packaged as a crate, and
    # the Linux Foundation wrote this family for exactly that shape of thing.
    # Version 2.0 imposes no obligation of any kind on software that uses the
    # data — not even attribution, which 1.0 required — so it raises none of
    # the derivative-work question that keeps the GPL family off this list.
    "CDLA-Permissive-2.0",

    # MPL-2.0 is copyleft and is allowed anyway, which is the one entry in this
    # list that deserves an argument rather than a nod. Its reciprocity is
    # file-scoped: modify an MPL file and that file stays MPL, and nothing
    # propagates to the code that links against it. That is a materially
    # different bargain from the GPL family, and it is a bargain this repo can
    # keep, because it has no intention of modifying a vendored crate in place.
    # It appears in practice through `option-ext`, which arrives via `dirs-sys`
    # under Tauri. If a future MPL dependency ever needs *patching*, that is a
    # decision to make deliberately, not one to inherit from this line.
    "MPL-2.0",
]

# cargo-deny's default. Left explicit because a license file scoring below the
# threshold is reported as "unknown license" rather than as a mismatch, and the
# first person to hit that will want to know the number is a knob and not a
# fact about the crate.
confidence-threshold = 0.8

# Per-crate escapes for a dependency whose license is acceptable for a reason
# specific to that dependency. Empty, and it should stay much shorter than the
# `allow` list above — an exception is a judgement about one crate, whereas an
# entry in `allow` is a policy about every crate that will ever arrive under
# that license.
exceptions = []

[bans]
# Both of these are set to "allow" rather than left at their defaults, because
# in this workspace they report facts that are already understood and would
# otherwise bury the findings that are not.
#
# `multiple-versions`: a Tauri tree carries dozens of duplicate crate versions.
# That is a compile-time and binary-size question, not a legal or a security
# one, and it is not what this file is for.
#
# `wildcards`: the intra-workspace path dependencies — `examples/echo-tool`
# depending on `crates/veistra-rpc` by path — have no version requirement and are
# read as wildcards. They are the same repository at the same commit, so the
# risk the check exists to catch cannot apply to them.
multiple-versions = "allow"
wildcards = "allow"

[sources]
# Where a crate came from matters as much as what it says about itself. Both of
# these are cargo-deny's defaults and both are stated anyway, because "someone
# added a git dependency pointing at a fork" is the supply chain problem this
# project is most likely to actually have — a Tauri patch waiting on an
# upstream release is a normal thing to want, and it should be a conversation
# rather than a commit that slips through.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# The first real run, 2026-08-18, against the full resolved graph:
#
#   advisories FAILED, bans ok, licenses ok, sources ok
#
# The `allow` list above needed no additions — the whole Tauri tree resolves
# under licenses already named, and there is no GPL-family dependency anywhere
# in it. That was the question worth asking before going public, and the answer
# is clean.
#
# The sixteen advisory findings are all `unmaintained` and all handled above,
# individually and with reasons. Zero vulnerabilities.
#
# The standing rule, unchanged now that the check has teeth: a denial is the
# check working. Read what it names before deciding it is noise, and widen the
# `allow` list only for a license, never for a crate.
