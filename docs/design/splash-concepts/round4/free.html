    <title>OpenKaava</title>
    <!--
      This file is deliberately standalone: no imports, no build step, no
      shared modules, no coupling of any kind to the rest of the application.
      The product name and the wordmark below are written out here, and
      `scripts/check-branding.mjs` fails `pnpm lint` if either stops agreeing
      with branding.toml.

      Everything it needs is inlined, so the markup below IS the finished
      screen and the first window can paint before anything else in the app
      has loaded:
        - the styles, with the token values copied literally out of
          src/tokens.css under the same names (this file cannot @import it:
          that would be a request, and a dependency)
        - the art, drawn on a canvas by the `splash-art` script (Raking light;
          it needs no image, so there is no request for one)
        - the mark, as inline svg
        - the typefaces, as base64 woff2 subsets (see @font-face)
        - the boot logic, as a plain non-module script at the bottom

      Raking light. The picture is a plate of small rounded tiles lit by one
      low key light from the upper left, and the mark is an object standing on
      it, lit by the same light. Integration is by occlusion and shadow rather
      than by a halo: the tiles run on underneath the mark and show through
      its pit, the plate has its own soft relief whose lit and unlit faces
      follow the light, and the mark throws a short soft shadow to the lower
      right made of tiles dropping out and dimming. The mark itself stays a
      crisp vector, so the brand shape is never approximated by a grid. The
      tile field is tonal (ink on the plate, never a colour of its own); the
      user's accent appears only in the sparkle tiles. In the light theme the
      same scene is ink on paper: a tile is ink, so shadow is more of it.

      The progress bar sits on the seam between the picture and the band and
      carries its own waves. They are drawn from requestAnimationFrame on the
      main thread, not from a compositor-only animation, so a page that has
      stalled stops moving them: the waves are the proof of life. The loop
      runs only while boot is working; ready and failure each settle in under
      a second and the loop stops.
    -->
    <!--
      Theme and accent, read before first paint. The shell mirrors the two
      appearance settings into localStorage (src/shell/settings/
      splashAppearance.ts) and this window shares that origin, so a stored
      value is available synchronously with no IPC round-trip. Nothing stored
      (a first launch) leaves the neutral palette in the CSS below. The test
      in src/splash/splash.test.ts runs this script, so the key and the value
      shape are checked against the writer.
    -->
    <script id="splash-appearance">
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem("kaava.splash-appearance"));
          var root = document.documentElement;
          var theme = stored.theme;
          if (theme === "system") {
            theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          if (theme === "light") root.dataset.theme = "light";
          if (/^(amber|blue|green|violet|coral)$/.test(stored.accent)) {
            root.dataset.accent = stored.accent;
          }
        } catch (err) {
          /* unset or unreadable: the neutral defaults stand */
        }
      })();
    </script>
        <!-- CONCEPT ONLY: stripped when this ships. Paste verbatim into <head>, directly after
         <script id="splash-appearance">, before any other script. -->
    <script id="concept-demo">
      (function () {
        window.__conceptErrors = [];
        window.addEventListener("error", function (e) {
          window.__conceptErrors.push(String(e.message) + " @" + e.lineno);
        });
        if (window.__TAURI__) return;
        var q = new URLSearchParams(location.search);
        var demo = q.get("demo");
        if (!demo) return;
        var root = document.documentElement;
        if (q.get("theme") === "light") root.dataset.theme = "light";
        if (q.get("accent")) root.dataset.accent = q.get("accent");
        var total = +(q.get("total") || 5);
        var stop = +(q.get("step") || 2);
        var labels = [
          "Locating manifest",
          "Reading manifest",
          "Scanning checkouts",
          "Starting Home and Files",
          "Starting Files",
        ];
        var events = [];
        var t = 300;
        var last = demo === "working" || demo === "failed" ? stop : total;
        for (var s = 1; s <= last; s++) {
          events.push([t, { phase: "working", step: s, total: total, label: labels[(s - 1) % labels.length] }]);
          t += 700;
        }
        if (demo === "ready" || demo === "cycle") events.push([t, { phase: "ready" }]);
        if (demo === "failed") {
          events.push([
            t,
            {
              phase: "failed",
              message: "Could not read C:\\Users\\dev\\projects\\saas\\kaava.toml: expected `=` at line 12",
            },
          ]);
        }
        window.__TAURI__ = {
          app: {
            getVersion: function () {
              return Promise.resolve("0.6.1");
            },
          },
          core: {
            invoke: function (cmd) {
              return Promise.resolve(
                cmd === "boot_status" ? { phase: "working", step: 0, total: total, label: "Starting…" } : null,
              );
            },
          },
          event: {
            listen: function (name, fn) {
              events.forEach(function (e) {
                setTimeout(function () {
                  fn({ payload: e[1] });
                }, e[0]);
              });
              return Promise.resolve(function () {});
            },
          },
        };
      })();
    </script>

      /*
       * Tokens, copied from src/tokens.css under the same names. Only the ones
       * this file reads are here; src/splash/splash.test.ts fails if any of
       * them drifts from tokens.css, so a stale copy is caught by `pnpm test`
       * rather than noticed on a launch.
       */
      :root {
        color-scheme: dark;

        --bg-canvas: #0f0f10;
        --bg-surface-1: #141415;
        --bg-layer-1: #181a1b;
        --border-subtle: #222425;
        --border-subtle-1: #2c2e30;
        --border-strong: #36393a;
        --border-strong-1: #45484a;

        --txt-primary: #e4e6e6;
        --txt-secondary: #cacdce;
        --txt-tertiary: #afb3b6;
        --txt-placeholder: #959a9d;
        --txt-danger: #f4a49c;
        --danger: #e5534b;

        --accent-amber: #d98a3f;
        --accent-blue: #3f76ff;
        --accent-green: #4cb863;
        --accent-violet: #a585f0;
        --accent-coral: #e5736b;

        --sans: Inter, "Inter Variable", system-ui, "Segoe UI", sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

        --radius-md: 6px;
        --radius-xl: 12px;
        --shadow-overlay: 0 12px 32px -6px rgba(0, 0, 0, 0.6), 0 2px 6px rgba(0, 0, 0, 0.3);
        --control-md: 28px;
        --focus-ring: 2px solid color-mix(in srgb, var(--accent) 45%, transparent);
        --focus-ring-offset: 2px;

        /* Not a token: what the accent means for the splash's own parts.
           Neutral until the head script has found a stored accent, so a first
           launch is never drawn in a colour the user did not pick. The tiles
           and the sparkles read it; the progress bar does not (it is green). */
        --accent: var(--txt-primary);
      }

      :root[data-theme="light"] {
        color-scheme: light;

        --bg-canvas: #f2f2f3;
        --bg-surface-1: #ffffff;
        --bg-layer-1: #f9f9f9;
        --border-subtle: #eaebec;
        --border-subtle-1: #e1e2e3;
        --border-strong: #d5d7d9;
        --border-strong-1: #cacdcf;

        --txt-primary: #0f0f10;
        --txt-secondary: #313435;
        --txt-tertiary: #494d50;
        --txt-placeholder: #5d6265;
        --txt-danger: #9c231b;
        --danger: #bf2c22;

        --accent-amber: #a85a14;
        --accent-blue: #2f62e0;
        --accent-green: #23803b;
        --accent-violet: #6c47c9;
        --accent-coral: #b8392f;
      }

      /* The accent. Neutral (the text colour) until the head script finds a
         stored one. */
      :root[data-accent="amber"] {
        --accent: var(--accent-amber);
      }
      :root[data-accent="blue"] {
        --accent: var(--accent-blue);
      }
      :root[data-accent="green"] {
        --accent: var(--accent-green);
      }
      :root[data-accent="violet"] {
        --accent: var(--accent-violet);
      }
      :root[data-accent="coral"] {
        --accent: var(--accent-coral);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      /* Transparent, not a colour: the window is transparent too, so the
         desktop shows through everywhere except the card below. Any fill
         here would be the square backing the rounded card is meant to
         remove. */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      /* The window is 72px larger than the card in each direction, and this
         padding is that gutter: room for the shadow to fall on transparent
         pixels instead of being clipped at the window edge. */
      body {
        padding: 36px;
      }

      /* The window is transparent and undecorated (see tauri.conf.json), so
         this card IS the visible window: the app window's radius, the
         hairline border and the overlay shadow are drawn here, anti-aliased
         by the compositor. The clip on `overflow` rounds the canvas.

         Three stacked parts, all positioned from the card's padding box
         (598 x 418): the picture, 296px; the bar, 8px, on the seam; and the
         band, the rest. Roughly 70 / 30, as the reference splash. */
      .splash {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg-surface-1);
        border: 1px solid var(--border-subtle-1);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-overlay);
        color: var(--txt-primary);
        font-family: var(--sans);
      }

      .splash__image {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 296px;
      }

      .splash__art {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* The mark. The svg is a 24 unit box with the glyph centred in it, so
         the box's centre is the glyph's centre; 4px a unit makes the glyph
         56 x 77. The art script reads this element's rectangle to place the
         shadow, so moving it here moves the shadow with it. */
      .splash__mark {
        position: absolute;
        left: 50%;
        top: 70px;
        width: 96px;
        height: 96px;
        margin-left: -48px;
        overflow: visible;
      }

      /* The slab: the same outline stacked six times, drifting right and a
         little down (the way the light falls), which reads as an edge about
         five pixels thick without a second shape to keep in step with the
         first. */
      .splash__mark-wall {
        fill: color-mix(in srgb, var(--txt-primary) 34%, var(--bg-surface-1));
      }

      .splash__mark-face {
        fill: var(--txt-primary);
      }

      /* Mark, then name, centred on the card. The soft shadow in the text's
         own plate colour keeps it legible over a bright tile without cutting
         a hole in the picture. */
      .splash__lockup {
        position: absolute;
        left: 0;
        right: 0;
        top: 186px;
        display: flex;
        justify-content: center;
        transition: opacity 200ms;
      }

      .splash[data-phase="failed"] .splash__lockup {
        opacity: 0;
        pointer-events: none;
      }

      .splash__name {
        display: flex;
        align-items: center;
        gap: 14px;
        text-shadow: 0 0 10px color-mix(in srgb, var(--bg-surface-1) 90%, transparent);
      }

      .splash__wordmark {
        margin: 0;
        font-family: var(--sans);
        font-size: 26px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.012em;
        color: var(--txt-primary);
      }

      .splash__rule {
        flex: none;
        width: 1px;
        height: 20px;
        background: var(--border-strong-1);
      }

      /* The negative right margin takes back the tracking after the last
         glyph, so the pair centres on the glyphs and not on the gap. */
      .splash__company {
        margin: 0 -0.2em 0 0;
        font-family: var(--sans);
        font-size: 10.5px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--txt-secondary);
      }

      /* The trademark sign. Inter's U+2122 is already a small raised glyph (about
         half an em wide, its top on the cap line), so it is left on the
         baseline and only resized, then lifted by the amount the resize
         dropped its top. It takes the word's weight and colour and none of its
         tracking or case, and a hair of space before it. */
      .splash__tm {
        margin-left: 0.1em;
        font-weight: 600;
        letter-spacing: 0;
        line-height: 0;
        text-transform: none;
        position: relative;
      }

      .splash__wordmark .splash__tm {
        font-size: 0.8em;
        top: -0.18em;
      }

      .splash__company .splash__tm {
        font-size: 1.1em;
        margin-left: 0.02em;
      }

      /* A panel rather than bare text: the message has to stay legible over
         the picture. It starts under the mark, where the lockup was. */
      .splash__error {
        position: absolute;
        left: 0;
        right: 0;
        top: 170px;
        bottom: 14px;
        display: flex;
        justify-content: center;
        padding: 0 28px;
      }

      .splash__error-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        width: 100%;
        max-width: 440px;
        max-height: 100%;
        padding: 16px 20px;
        border: 1px solid var(--border-subtle-1);
        border-radius: var(--radius-xl);
        background: color-mix(in srgb, var(--bg-surface-1) 92%, transparent);
      }

      /* The message scrolls inside the panel, so a long path never pushes
         the button off the card. */
      .splash__error-message {
        margin: 0;
        min-height: 0;
        overflow-y: auto;
        text-align: center;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.45;
        color: var(--txt-danger);
        overflow-wrap: anywhere;
      }

      /* The design system's secondary button: layer fill, strong border. */
      .splash__continue {
        flex: none;
        height: var(--control-md);
        padding: 0 12px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-md);
        background: var(--bg-layer-1);
        color: var(--txt-primary);
        font-family: var(--sans);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }

      .splash__continue:hover {
        border-color: var(--border-strong-1);
      }

      .splash__continue:focus-visible {
        outline: var(--focus-ring);
        outline-offset: var(--focus-ring-offset);
      }

      /* The bar, on the seam. The track is the CSS background so it is there
         before the script is; the fill and its waves are the canvas. */
      .splash__bar {
        position: absolute;
        left: 0;
        right: 0;
        top: 296px;
        height: 8px;
        background: var(--border-subtle-1);
      }

      .splash__wave {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* The band. Solid, the canvas colour of the app, so it reads as the
         ground the picture stands on in both themes. Status top right and the
         tip top left, the legal line and the version on the bottom edge. */
      .splash__band {
        position: absolute;
        left: 0;
        right: 0;
        top: 304px;
        bottom: 0;
        padding: 14px 20px 13px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-rows: auto 1fr auto;
        column-gap: 28px;
        background: var(--bg-canvas);
      }

      .splash__tipbox {
        grid-area: 1 / 1;
        display: flex;
        align-items: flex-start;
        gap: 10px;
        min-width: 0;
        max-width: 340px;
      }

      .splash__tip-label {
        flex: none;
        margin-top: 1px;
        padding: 0 5px;
        border: 1px solid var(--border-strong);
        border-radius: 4px;
        font-family: var(--sans);
        font-size: 9.5px;
        font-weight: 600;
        line-height: 14px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--txt-placeholder);
      }

      .splash__tip {
        margin: 0;
        font-family: var(--sans);
        font-size: 12px;
        font-weight: 400;
        line-height: 17px;
        color: var(--txt-tertiary);
      }

      .splash__status {
        grid-area: 1 / 2;
        text-align: right;
      }

      .splash__step {
        margin: 0;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 500;
        line-height: 17px;
        white-space: nowrap;
        color: var(--txt-secondary);
      }

      .splash[data-phase="failed"] .splash__step {
        color: var(--txt-danger);
      }

      .splash__substep {
        margin: 3px 0 0;
        font-family: var(--sans);
        font-size: 11px;
        font-weight: 400;
        line-height: 14px;
        white-space: nowrap;
        color: var(--txt-placeholder);
      }

      .splash__legal {
        grid-area: 3 / 1;
        align-self: end;
        margin: 0;
        font-family: var(--sans);
        font-size: 11px;
        font-weight: 400;
        line-height: 14px;
        color: var(--txt-placeholder);
      }

      .splash__version {
        grid-area: 3 / 2;
        align-self: end;
        min-height: 14px;
        font-family: var(--sans);
        font-size: 11px;
        font-weight: 400;
        line-height: 14px;
        text-align: right;
        color: var(--txt-tertiary);
      }

      @media (prefers-reduced-motion: reduce) {
        .splash__lockup {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash" data-phase="working">
      <div class="splash__image">
        <canvas class="splash__art" aria-hidden="true"></canvas>

        <svg class="splash__mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <defs>
            <path
              id="kaava-mark"
              d="M12 2.4c3.3 0 7 4.2 7 10.1 0 4.8-3.1 9.1-7 9.1s-7-4.3-7-9.1C5 6.6 8.7 2.4 12 2.4zm0 8.4a2.9 2.9 0 1 0 0 5.8 2.9 2.9 0 0 0 0-5.8z"
            />
          </defs>
          <use href="#kaava-mark" class="splash__mark-wall" x="1.02" y="0.5" />
          <use href="#kaava-mark" class="splash__mark-wall" x="0.85" y="0.42" />
          <use href="#kaava-mark" class="splash__mark-wall" x="0.68" y="0.33" />
          <use href="#kaava-mark" class="splash__mark-wall" x="0.51" y="0.25" />
          <use href="#kaava-mark" class="splash__mark-wall" x="0.34" y="0.17" />
          <use href="#kaava-mark" class="splash__mark-wall" x="0.17" y="0.08" />
          <use href="#kaava-mark" class="splash__mark-face" />
        </svg>

        <div class="splash__lockup">
          <div class="splash__name">
            <p class="splash__wordmark">OpenKaava<span class="splash__tm">™</span></p>
            <span class="splash__rule" aria-hidden="true"></span>
            <span class="splash__company">Veistra<span class="splash__tm">™</span></span>
          </div>
        </div>

        <div class="splash__error" hidden>
          <div class="splash__error-panel">
            <p class="splash__error-message"></p>
            <button type="button" class="splash__continue">Continue anyway</button>
          </div>
        </div>
      </div>

      <div
        class="splash__bar"
        role="progressbar"
        aria-label="Startup"
        aria-valuemin="0"
        aria-valuemax="1"
        aria-valuenow="0"
      >
        <canvas class="splash__wave" aria-hidden="true"></canvas>
      </div>

      <div class="splash__band">
        <div class="splash__tipbox">
          <span class="splash__tip-label">Tip</span>
          <p class="splash__tip">A different OpenKaava tip appears here on each launch.</p>
        </div>
        <div class="splash__status">
          <p class="splash__step">Starting</p>
          <p class="splash__substep">Step 1 of 5</p>
        </div>
        <p class="splash__legal">© 2026 Veistra. All rights reserved.</p>
        <span class="splash__version"></span>
      </div>
    </div>

    <script id="splash-art">
      /*
       * Raking light. Two canvases and no state of their own: the plate of
       * tiles (the picture) and the strip inside the progress bar. Everything
       * here is drawn from numbers, so there is nothing to load.
       *
       * The plate is built once at the card's size: every tile gets a tone
       * from one lit surface (a key light, a soft relief, the shadow the mark
       * throws), and a tile is then drawn or not by comparing that tone with
       * a blue-ish noise value, at one of six fixed strengths. Nothing is
       * blurred, so the only two things a tile can do are be there or be
       * brighter, which is what keeps it a mosaic. Boot progress raises the
       * lamp a little at a time; ready brings it to full, failure lets it
       * fall and turns the sparkles to the danger colour.
       *
       * Nothing here talks to Tauri. The boot script calls the four methods
       * on `splashArt` and this file owns the time, so a status that arrives
       * late or all at once still plays out smoothly. The frame loop runs
       * while boot is working (the bar's waves are the sign of life) and
       * stops by itself once ready or failure has settled.
       */
      var splashArt = (function () {
        "use strict";

        var TAU = Math.PI * 2;
        // Tile pitch in CSS px; the tile is half of it. Both are snapped to whole device pixels.
        var PITCH = 6;
        // Tile strength tables, dim to bright. A tile is ink laid on the plate: light on dark in the
        // dark theme, so brighter is lit; dark on light in the light theme, so stronger is more shade.
        var LEVELS_DARK = [0.05, 0.1, 0.17, 0.27, 0.4, 0.6];
        var LEVELS_LIGHT = [0.06, 0.11, 0.18, 0.28, 0.42, 0.62];
        // The light comes from the left and a little above, so the shadow runs right and a little
        // down. This is the direction it runs, and its reach.
        var DIRX = 0.9;
        var DIRY = 0.44;
        var SLAB = 5; // how far the slab's foot sits from its face, px
        var SHADOW_STEPS = 40;
        var SHADOW_STEP = 3;
        // Broad swells in the plate: wavelength px, direction deg, slope, phase. Long, so they read
        // as bands of light across the plate and not as texture.
        var RELIEF = [
          [320, 38, 0.5, 0.9],
          [196, 64, 0.3, 2.4],
        ];
        var SPARKLES = 11;
        var FRAME_CAP = 0.05; // s; a stalled frame must not teleport the animation

        function clamp(x, a, b) {
          return x < a ? a : x > b ? b : x;
        }
        function smooth(a, b, x) {
          var t = clamp((x - a) / (b - a), 0, 1);
          return t * t * (3 - 2 * t);
        }
        function lerp(a, b, t) {
          return a + (b - a) * t;
        }
        function mulberry(a) {
          return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        function hexRgb(h, fallback) {
          var m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(h || "");
          if (!m) return fallback;
          var s = m[1];
          if (s.length === 3) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
          return [parseInt(s.substr(0, 2), 16), parseInt(s.substr(2, 2), 16), parseInt(s.substr(4, 2), 16)];
        }
        function mix(a, b, t) {
          return [Math.round(lerp(a[0], b[0], t)), Math.round(lerp(a[1], b[1], t)), Math.round(lerp(a[2], b[2], t))];
        }
        function rgba(c, a) {
          return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a.toFixed(3) + ")";
        }
        // A context, or null: a canvas that has none (or a stub) must not stop boot.
        function context(cv) {
          try {
            return cv && cv.getContext ? cv.getContext("2d") || null : null;
          } catch (err) {
            return null;
          }
        }

        var canvas = document.querySelector(".splash__art");
        var ctx = context(canvas);
        var barCanvas = document.querySelector(".splash__wave");
        var bctx = context(barCanvas);
        var reduce = false;
        try {
          reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        } catch (err) {
          reduce = false;
        }

        /* ---- state: what boot has told us, and what is drawn ---- */
        var phase = "working";
        var target = 0; // bar fill the art is heading for, 0..1
        var fill = 0; // bar fill drawn
        var amp = 1; // wave height 0..1
        var lampTarget = 0.9;
        var lamp = 0.9; // brightness of the plate
        var calm = 0; // 0 sparkles twinkle, 1 they hold still
        var fail = 0; // 0..1 how far the colours have turned to danger
        var clock = 0; // art clock, seconds; advances only while frames run
        var phaseA = 0;
        var phaseB = 0;
        var raf = 0;
        var last = 0;

        /* ---- built once per size ---- */
        var P = null;
        var built = false;
        var W = 0;
        var H = 0;
        var D = 1;
        var cw = 0;
        var ch = 0;
        var base = null;
        var bgctx = null;
        var markC = { x: 0, y: 0, u: 4 };
        var lockBox = null;
        var grid = null;
        var tiles = null;
        var sparks = [];
        var tileColour = [];
        var baseLamp = -1;
        var bw = 0;
        var bh = 0;
        var bd = 1;

        function palette() {
          var cs = getComputedStyle(document.documentElement);
          function rgb(name, fb) {
            return hexRgb(cs.getPropertyValue(name).trim(), fb);
          }
          var light = document.documentElement.dataset.theme === "light";
          var ink = rgb("--txt-primary", light ? [15, 15, 16] : [228, 230, 230]);
          return {
            light: light,
            ink: ink,
            accent: rgb("--accent", ink),
            green: rgb("--accent-green", light ? [35, 128, 59] : [76, 184, 99]),
            danger: rgb("--danger", light ? [191, 44, 34] : [229, 83, 75]),
          };
        }

        /* ---- the mark, as a mask ---- */
        // The outline of the mark in its 24 unit box, as four cubic segments (the same numbers as the
        // svg path), and the pit, a circle that is a hole. Rasterised once so the shadow can ask
        // "is there mark at this pixel" thousands of times without touching the DOM.
        var OUTLINE = [
          [12, 2.4, 15.3, 2.4, 19, 6.6, 19, 12.5],
          [19, 12.5, 19, 17.3, 15.9, 21.6, 12, 21.6],
          [12, 21.6, 8.1, 21.6, 5, 17.3, 5, 12.5],
          [5, 12.5, 5, 6.6, 8.7, 2.4, 12, 2.4],
        ];
        function outlinePoints() {
          var pts = [];
          for (var s = 0; s < OUTLINE.length; s++) {
            var c = OUTLINE[s];
            for (var i = 0; i < 24; i++) {
              var t = i / 24;
              var a = (1 - t) * (1 - t) * (1 - t);
              var b = 3 * (1 - t) * (1 - t) * t;
              var d = 3 * (1 - t) * t * t;
              var e = t * t * t;
              pts.push([a * c[0] + b * c[2] + d * c[4] + e * c[6], a * c[1] + b * c[3] + d * c[5] + e * c[7]]);
            }
          }
          return pts;
        }
        function rasterMark() {
          var u = markC.u;
          var size = Math.ceil(24 * u) + 2;
          var x0 = Math.round(markC.x - 12 * u) - 1;
          var y0 = Math.round(markC.y - 12 * u) - 1;
          var cells = new Uint8Array(size * size);
          var pts = outlinePoints();
          for (var j = 0; j < size; j++) {
            var v = (y0 + j + 0.5 - markC.y) / u + 12;
            var xs = [];
            for (var k = 0; k < pts.length; k++) {
              var p = pts[k];
              var q = pts[(k + 1) % pts.length];
              if (p[1] <= v !== q[1] <= v) xs.push(p[0] + ((v - p[1]) / (q[1] - p[1])) * (q[0] - p[0]));
            }
            xs.sort(function (a, b) {
              return a - b;
            });
            for (var i = 0; i < size; i++) {
              var ux = (x0 + i + 0.5 - markC.x) / u + 12;
              var inside = false;
              for (var n = 0; n + 1 < xs.length; n += 2) {
                if (ux >= xs[n] && ux < xs[n + 1]) inside = true;
              }
              if (inside && (ux - 12) * (ux - 12) + (v - 13.7) * (v - 13.7) < 2.9 * 2.9) inside = false;
              cells[j * size + i] = inside ? 1 : 0;
            }
          }
          grid = { x0: x0, y0: y0, size: size, cells: cells };
        }
        function maskAt(x, y) {
          var i = Math.floor(x - grid.x0);
          var j = Math.floor(y - grid.y0);
          if (i < 0 || j < 0 || i >= grid.size || j >= grid.size) return 0;
          return grid.cells[j * grid.size + i];
        }

        /* ---- the lit surface ---- */
        var shadowW = [];
        function shadowWeights() {
          shadowW = [];
          for (var k = 0; k < SHADOW_STEPS; k++) shadowW.push((1 - k / SHADOW_STEPS) / 7);
        }
        // How much of the key light the mark takes from this point: a soft streak of the mask along
        // the light, wider and fainter the further it travels.
        function shadow(x, y) {
          var acc = 0;
          for (var k = 0; k < SHADOW_STEPS; k++) {
            var t = SLAB + k * SHADOW_STEP;
            var bx = x - DIRX * t;
            var by = y - DIRY * t;
            var s = k * 0.24;
            acc +=
              (maskAt(bx, by) + maskAt(bx - DIRY * s, by + DIRX * s) + maskAt(bx + DIRY * s, by - DIRX * s)) *
              shadowW[k];
          }
          return clamp(acc / 3, 0, 1);
        }
        var RELIEF_K = RELIEF.map(function (r) {
          var k = TAU / r[0];
          var a = (r[1] * Math.PI) / 180;
          // Slope along the light: how squarely this swell faces it.
          var face = -(Math.cos(a) * -DIRX + Math.sin(a) * -DIRY);
          return { kx: k * Math.cos(a), ky: k * Math.sin(a), c: r[2] * face, ph: r[3] };
        });
        function relief(x, y) {
          var wx = x + 24 * Math.sin(y * 0.019 + 1.3);
          var wy = y + 18 * Math.sin(x * 0.015 - 0.6);
          var g = 0;
          for (var i = 0; i < RELIEF_K.length; i++) {
            var r = RELIEF_K[i];
            g += r.c * Math.cos(r.kx * wx + r.ky * wy + r.ph);
          }
          return g;
        }
        // Light raking in from the upper left: the plate is brightest on the lamp's side and falls
        // off along the light across the whole card, so there is no pool around the mark, only a
        // direction. The far side stays lit enough for the mark's shadow to read against it.
        function keyLight(x, y) {
          var u = ((x - W / 2) * -DIRX + (y - H / 2) * -DIRY) / (W * 0.55);
          return 0.38 + 0.62 * smooth(-1.1, 1.1, u);
        }

        /* ---- blue-ish noise: white noise, high-passed, ranked ---- */
        var NW = 96;
        var NH = 80;
        var noise = null;
        function makeNoise() {
          var n = NW * NH;
          var r = mulberry(7311);
          var w = new Float32Array(n);
          var hp = new Float32Array(n);
          var i;
          for (i = 0; i < n; i++) w[i] = r();
          for (var y = 0; y < NH; y++) {
            for (var x = 0; x < NW; x++) {
              var s = 0;
              for (var dy = -2; dy <= 2; dy++) {
                for (var dx = -2; dx <= 2; dx++) s += w[((y + dy + NH) % NH) * NW + ((x + dx + NW) % NW)];
              }
              hp[y * NW + x] = w[y * NW + x] - s / 25;
            }
          }
          var idx = [];
          for (i = 0; i < n; i++) idx.push(i);
          idx.sort(function (a, b) {
            return hp[a] - hp[b];
          });
          noise = new Float32Array(n);
          for (i = 0; i < n; i++) noise[idx[i]] = (i + 0.5) / n;
        }

        /* ---- layout: measure the markup, then build the plate ---- */
        function measure() {
          var cr = canvas.getBoundingClientRect();
          markC = { x: W / 2, y: 118, u: 4 };
          lockBox = { x0: W / 2 - 118, x1: W / 2 + 118, y0: 182, y1: 216 };
          var mk = document.querySelector(".splash__mark");
          if (mk && cr.width) {
            var r = mk.getBoundingClientRect();
            if (r.width) markC = { x: r.left - cr.left + r.width / 2, y: r.top - cr.top + r.height / 2, u: r.width / 24 };
          }
          var nm = document.querySelector(".splash__name");
          if (nm && cr.width) {
            var n = nm.getBoundingClientRect();
            if (n.width) lockBox = { x0: n.left - cr.left, x1: n.right - cr.left, y0: n.top - cr.top, y1: n.bottom - cr.top };
          }
        }

        function build() {
          built = false;
          if (!canvas || !ctx) return;
          D = Math.min(window.devicePixelRatio || 1, 2);
          W = canvas.clientWidth;
          H = canvas.clientHeight;
          if (!(W > 16 && H > 16)) return;
          cw = Math.round(W * D);
          ch = Math.round(H * D);
          canvas.width = cw;
          canvas.height = ch;
          base = document.createElement("canvas");
          base.width = cw;
          base.height = ch;
          bgctx = context(base);
          P = palette();
          measure();
          rasterMark();
          shadowWeights();
          if (!noise) makeNoise();

          // Tile colours by strength: the ink, drifting a little towards the accent as it brightens.
          var table = P.light ? LEVELS_LIGHT : LEVELS_DARK;
          tileColour = [];
          for (var l = 0; l < table.length; l++) tileColour.push(rgba(mix(P.ink, P.accent, 0.3 * (l / (table.length - 1))), table[l]));

          // The lattice, in device pixels, with one column on the card's axis and one row on the mark's centre.
          var pd = Math.max(4, Math.round(PITCH * D));
          var td = Math.max(2, Math.round(pd / 2));
          var cx = Math.round((markC.x * D) / 1);
          var cy = Math.round(markC.y * D);
          var ix0 = -Math.ceil(cx / pd);
          var ix1 = Math.ceil((cw - cx) / pd);
          var iy0 = -Math.ceil(cy / pd);
          var iy1 = Math.ceil((ch - cy) / pd);
          var xs = [];
          var ys = [];
          var tone = [];
          var thr = [];
          var spare = [];
          var rng = mulberry(4021);
          for (var iy = iy0; iy <= iy1; iy++) {
            for (var ix = ix0; ix <= ix1; ix++) {
              var xc = cx + ix * pd;
              var yc = cy + iy * pd;
              if (xc + td < 0 || yc + td < 0 || xc - td > cw || yc - td > ch) continue;
              var x = xc / D;
              var y = yc / D;

              // The plate: a key light from the upper left, its relief, and a fall-off to the edges.
              var key = keyLight(x, y);
              var lit = 0.04 + 0.82 * key + 0.5 * relief(x, y) * (0.4 + 0.6 * key);
              var rx = (x - W / 2) / (W / 2);
              var ry = (y - H / 2) / (H / 2);
              lit *= 1 - 0.6 * smooth(0.5, 1.2, Math.sqrt(rx * rx + ry * ry));
              // The mark's shadow, and the dimmer pocket the lockup reads from.
              var dx = Math.max(lockBox.x0 - x, 0, x - lockBox.x1);
              var dy = Math.max(lockBox.y0 - y, 0, y - lockBox.y1);
              var basin = 1 - smooth(0, 40, Math.sqrt(dx * dx + dy * dy));
              var sh = x > markC.x - 40 && x < markC.x + 140 && y > markC.y - 30 && y < markC.y + 110 ? shadow(x, y) : 0;
              lit = clamp(lit, 0, 1) * (1 - 0.96 * sh);
              // Paper and ink: in the light theme a tile is shade, so it is the unlit that is drawn.
              var inkAmount = P.light ? Math.pow(1 - lit, 2.4) * 0.78 : lit;
              inkAmount *= 1 - 0.8 * basin * basin;

              xs.push(Math.round(xc - td / 2));
              ys.push(Math.round(yc - td / 2));
              tone.push(clamp(inkAmount, 0, 1));
              thr.push(noise[(((iy % NH) + NH) % NH) * NW + (((ix % NW) + NW) % NW)]);
              spare.push(basin < 0.02 && sh < 0.02 && key > 0.25 && y < H - 12 && maskAt(x, y) === 0);
            }
          }
          tiles = { n: xs.length, x: xs, y: ys, tone: tone, thr: thr, size: td, radius: td * 0.3, spark: new Uint8Array(xs.length) };

          // Sparkles: a few tiles that are brighter than their neighbours and in the accent. Chosen once,
          // from tiles that are well lit and clear of the mark, its shadow and the lockup, and spread out.
          sparks = [];
          var guard = 0;
          while (sparks.length < SPARKLES && guard++ < 4000) {
            var pick = Math.floor(rng() * tiles.n);
            if (!spare[pick]) continue;
            var ok = true;
            for (var s = 0; s < sparks.length; s++) {
              var ddx = tiles.x[pick] - tiles.x[sparks[s].i];
              var ddy = tiles.y[pick] - tiles.y[sparks[s].i];
              if (ddx * ddx + ddy * ddy < 52 * 52 * D * D) ok = false;
            }
            if (!ok) continue;
            sparks.push({ i: pick, ph: rng() * TAU, rate: 0.7 + rng() * 0.8, hold: 0.55 + rng() * 0.4 });
            tiles.spark[pick] = 1;
          }
          baseLamp = -1;
          built = true;
        }

        function buildBar() {
          bw = 0;
          if (!barCanvas || !bctx) return;
          bd = Math.min(window.devicePixelRatio || 1, 2);
          bw = barCanvas.clientWidth;
          bh = barCanvas.clientHeight;
          if (!(bw > 4 && bh > 1)) {
            bw = 0;
            return;
          }
          barCanvas.width = Math.round(bw * bd);
          barCanvas.height = Math.round(bh * bd);
        }

        /* ---- drawing ---- */
        function roundRects(c, list, size, radius) {
          c.beginPath();
          var rr = typeof c.roundRect === "function";
          for (var i = 0; i < list.length; i++) {
            if (rr) c.roundRect(tiles.x[list[i]], tiles.y[list[i]], size, size, radius);
            else c.rect(tiles.x[list[i]], tiles.y[list[i]], size, size);
          }
          c.fill();
        }

        function drawBase() {
          baseLamp = lamp;
          baseFail = fail;
          if (!bgctx) return;
          bgctx.setTransform(1, 0, 0, 1, 0, 0);
          bgctx.clearRect(0, 0, cw, ch);
          var buckets = [];
          var l;
          for (l = 0; l < tileColour.length; l++) buckets.push([]);
          var top = tileColour.length - 1;
          for (var i = 0; i < tiles.n; i++) {
            if (tiles.spark[i]) continue;
            var a = tiles.tone[i] * lamp * (1 - 0.3 * fail);
            // Density follows the tone, strength steps with it.
            var density = clamp((a - 0.04) * 1.75, 0, 1);
            if (tiles.thr[i] >= density) continue;
            buckets[clamp(Math.floor(a * 6.4), 0, top)].push(i);
          }
          for (l = 0; l < buckets.length; l++) {
            if (!buckets[l].length) continue;
            bgctx.fillStyle = tileColour[l];
            roundRects(bgctx, buckets[l], tiles.size, tiles.radius);
          }
        }

        function present() {
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.clearRect(0, 0, cw, ch);
          if (base) ctx.drawImage(base, 0, 0);
          if (!sparks.length) return;
          var col = mix(P.accent, P.danger, fail);
          for (var s = 0; s < sparks.length; s++) {
            var sp = sparks[s];
            var tw = 0.5 + 0.5 * Math.sin(clock * sp.rate * 1.6 + sp.ph);
            var a = lerp(0.3 + 0.7 * tw, sp.hold, calm) * (1 - 0.45 * fail);
            ctx.fillStyle = rgba(col, a);
            ctx.beginPath();
            if (typeof ctx.roundRect === "function") ctx.roundRect(tiles.x[sp.i], tiles.y[sp.i], tiles.size, tiles.size, tiles.radius);
            else ctx.rect(tiles.x[sp.i], tiles.y[sp.i], tiles.size, tiles.size);
            ctx.fill();
          }
        }

        // The path of one wave across the filled width, left to right.
        function trace(c, w, y0, amplitude, len, ph) {
          c.moveTo(0, y0 + amplitude * Math.sin(-ph));
          for (var x = 2; x < w + 2; x += 2) {
            var px = Math.min(x, w);
            c.lineTo(px, y0 + amplitude * Math.sin((px * TAU) / len - ph));
          }
        }

        // Fill the part of the bar under (or over) one wave.
        function swell(c, w, y0, amplitude, len, ph, below) {
          c.beginPath();
          trace(c, w, y0, amplitude, len, ph);
          c.lineTo(w, below ? bh : 0);
          c.lineTo(0, below ? bh : 0);
          c.closePath();
          c.fill();
        }

        function drawBar() {
          if (!bw) return;
          var c = bctx;
          c.setTransform(1, 0, 0, 1, 0, 0);
          c.clearRect(0, 0, barCanvas.width, barCanvas.height);
          var fd = Math.round(fill * barCanvas.width);
          if (fd < 1) return;
          var w = fd / bd;
          c.setTransform(bd, 0, 0, bd, 0, 0);
          var col = mix(P.green, P.danger, fail);
          var hi = mix(col, [255, 255, 255], 0.45);
          var lo = mix(col, [0, 0, 0], 0.42);
          // The still bar keeps a little of the layering, so it reads as the same bar at rest.
          var live = 0.3 + 0.7 * amp;
          c.fillStyle = rgba(col, 1);
          c.fillRect(0, 0, w, bh);
          // A deep swell under a surface, a light one over it, and a crest along the first.
          c.fillStyle = rgba(lo, 0.85 * live);
          swell(c, w, bh * 0.58, 1.9 * amp, 64, phaseA, true);
          c.fillStyle = rgba(hi, 0.5 * live);
          swell(c, w, bh * 0.3, 1.3 * amp, 38, phaseB, false);
          c.strokeStyle = rgba(hi, 0.9 * live);
          c.lineWidth = 1;
          c.beginPath();
          trace(c, w, bh * 0.58 - 0.5, 1.9 * amp, 64, phaseA);
          c.stroke();
          // The leading edge, a little brighter, so the end of the fill reads at a glance.
          c.fillStyle = rgba(hi, 0.75);
          c.fillRect(Math.max(0, w - 1.5), 0, 1.5, bh);
        }

        function draw() {
          if (built) {
            if (baseLamp < 0 || Math.abs(lamp - baseLamp) > 0.002 || Math.abs(fail - baseFail) > 0.01) drawBase();
            present();
          }
          drawBar();
        }
        var baseFail = 0;

        /* ---- the clock ---- */
        function settled() {
          if (!built && !bw) return true;
          if (phase === "working" || phase === "finalizing") return false;
          var done = amp < 0.01 && Math.abs(lamp - lampTarget) < 0.004 && calm > 0.99;
          if (phase === "failed") return done && fail > 0.99;
          return done && Math.abs(fill - 1) < 0.0015;
        }

        function ease(from, to, dt, rate) {
          return from + (to - from) * (1 - Math.exp(-dt * rate));
        }

        function advance(dt) {
          clock += dt;
          fill = Math.abs(target - fill) < 0.0008 ? target : ease(fill, target, dt, 4.5);
          var ampTo = phase === "failed" ? 0 : phase === "ready" && fill > 0.985 ? 0 : 1;
          amp = ease(amp, ampTo, dt, ampTo ? 6 : 3.4);
          if (amp < 0.004 && !ampTo) amp = 0;
          lamp = Math.abs(lampTarget - lamp) < 0.002 ? lampTarget : ease(lamp, lampTarget, dt, 3);
          var calmTo = phase === "working" || phase === "finalizing" ? 0 : 1;
          calm = ease(calm, calmTo, dt, 2.6);
          if (calm > 0.996) calm = 1;
          fail = ease(fail, phase === "failed" ? 1 : 0, dt, 5);
          if (fail > 0.996) fail = 1;
          phaseA += dt * ((TAU * 46) / 58);
          phaseB += dt * ((TAU * 29) / 34);
        }

        function frame(now) {
          raf = 0;
          var dt = last ? clamp((now - last) / 1000, 0, FRAME_CAP) : 1 / 60;
          last = now;
          advance(dt);
          draw();
          if (settled()) {
            last = 0;
            return;
          }
          raf = requestAnimationFrame(frame);
        }

        // Reduced motion: no loop at all. Each state is applied whole and drawn once.
        function snap() {
          fill = target;
          amp = 0;
          lamp = lampTarget;
          calm = 1;
          fail = phase === "failed" ? 1 : 0;
          draw();
        }

        function go() {
          if (reduce) return snap();
          if (!raf) {
            last = 0;
            raf = requestAnimationFrame(frame);
          }
        }

        function resize() {
          build();
          buildBar();
          baseLamp = -1;
          if (reduce) snap();
          else draw();
        }

        build();
        buildBar();
        if (reduce) snap();
        else {
          draw();
        }
        window.addEventListener("resize", resize);

        /* ---- what the boot script calls ---- */
        return {
          // Step `step` of `total` is in flight. The bar only ever moves forward.
          working: function (step, total) {
            if (phase !== "working") return;
            var p = total > 0 ? clamp(step / total, 0, 1) : 0;
            target = Math.max(target, Math.min(0.95, p));
            lampTarget = 0.9 + 0.07 * p;
            go();
          },
          // The last stretch: the bar waits near the end while the app hands over.
          finalizing: function () {
            if (phase === "failed" || phase === "ready") return;
            phase = "finalizing";
            target = Math.max(target, 0.95);
            lampTarget = 0.97;
            go();
          },
          ready: function () {
            if (phase === "failed") return;
            phase = "ready";
            target = 1;
            lampTarget = 1;
            go();
          },
          // The bar stays where it is, goes still, and turns to danger.
          fail: function () {
            if (phase === "failed") return;
            phase = "failed";
            target = fill;
            lampTarget = 0.6;
            go();
          },
        };
      })();
    </script>

    <script>
      /*
       * A plain <script>, not `type="module"`: a module is deferred and
       * fetched as a separate resource even when it imports nothing, and
       * this needs neither. Nothing here is transformed by Vite.
       *
       * The Tauri API is reached through `window.__TAURI__`, which requires
       * `app.withGlobalTauri: true` in tauri.conf.json. That global is
       * injected by the Tauri runtime as an initialisation script, so it is
       * already present before this runs and costs no request, unlike
       * `import { invoke } from "@tauri-apps/api/core"`, which would drag
       * the bundler back in and put this window's startup behind a module
       * graph again.
       */
      (function () {
        "use strict";

        /*
         * Minimum time the splash stays up, no matter how fast boot
         * finishes. This holds back only the *handoff*: the Rust-side work
         * in boot.rs runs at full speed either way and is usually done well
         * before this timer is.
         *
         * 5s is deliberately longer than boot ever actually takes. A boot
         * this app can run (a manifest read and a checkout scan) finishes in
         * well under a second on any real machine, so without a floor the
         * splash would read as barely doing anything, which undersells an
         * app that, once handed off to, is not thin. This is the version of
         * that impression that a fast boot earns instead.
         *
         * Kept well clear of `WATCHDOG_TIMEOUT` in boot.rs (10s): that timer
         * force-closes the splash if nothing calls `finish_boot` in time, as
         * a fallback for a frontend that never got the chance to. This timer
         * is the frontend getting that chance; if the two ever converged,
         * the watchdog would start racing the normal path instead of only
         * ever backstopping it.
         */
        var MIN_VISIBLE_MS = 5000;

        /*
         * How long the bar sits at `FINALIZE_PROGRESS` under a "Finalizing"
         * label before jumping to the real `Ready` state.
         *
         * `boot::BootStatus` has no phase for this: the moment boot.rs
         * reports `Ready`, it is genuinely done, there is no fourth step
         * running in the background during this hold. It exists for the
         * same reason `MIN_VISIBLE_MS` does: a bar that snaps straight from
         * "step 3 of 3" to "Ready" reads as though the last stretch of work
         * was skipped rather than finished, even though nothing was
         * actually skipped. This manufactures the beat that a real final
         * step would have taken.
         *
         * It runs *inside* `MIN_VISIBLE_MS`, not on top of it: `handleReady`
         * only calls `armReadyHandoff` after this hold, so the 5s floor is
         * simply measured from a slightly later point. The two never stack.
         * `Ready` itself is not a resting state either: the art keeps the
         * waves moving until the fill reaches the end, so the remainder of
         * `MIN_VISIBLE_MS` reads as more of the same loading sequence
         * instead of a second, frozen stop tacked on after it.
         */
        var FINALIZE_HOLD_MS = 450;
        var FINALIZE_PROGRESS = 0.95;

        /*
         * One tip per launch, picked at random. A placeholder list for the
         * concept; the real ones are written the same way, one sentence each.
         * Picked before the Tauri check below so a file opened straight in a
         * browser shows one too.
         */
        var TIPS = ["A different OpenKaava tip appears here on each launch.", "Tips are short, one sentence, and true."];
        var tipEl = document.querySelector(".splash__tip");
        if (tipEl) tipEl.textContent = TIPS[Math.floor(Math.random() * TIPS.length)];

        var startedAt = performance.now();

        var errorBox = document.querySelector(".splash__error");
        var errorMessage = document.querySelector(".splash__error-message");
        var continueButton = document.querySelector(".splash__continue");
        var bar = document.querySelector(".splash__bar");
        var root = document.querySelector(".splash");
        var step = document.querySelector(".splash__step");
        var substep = document.querySelector(".splash__substep");
        var versionEl = document.querySelector(".splash__version");
        // The step in flight, kept so a failure can say where it stopped.
        var lastLabel = "Starting";
        var lastTotal = 5;
        var failedAt = 0;

        var tauri = window.__TAURI__;

        /*
         * Absent when this file is opened directly in a browser, which is
         * how its layout gets checked without building the app. Bailing
         * here leaves the static markup above on screen as a preview of the
         * initial state, rather than throwing on the first property access.
         */
        if (!tauri) return;

        var invoke = tauri.core.invoke;
        var listen = tauri.event.listen;

        // The version is the application's own, asked for once. It stays empty until it answers,
        // and stays empty if it never does: a missing number is better than a wrong one.
        try {
          tauri.app.getVersion().then(
            function (version) {
              versionEl.textContent = "Version " + version;
            },
            function () {},
          );
        } catch (err) {
          /* no app API: leave the slot empty */
        }

        function showStep(label, detail) {
          step.textContent = label;
          substep.textContent = detail;
        }

        /** Mirrors `boot::BootStatus`; see src/bindings.ts for the types. */
        function render(status) {
          var working = status.phase === "working";
          var failed = status.phase === "failed";
          var progress = working ? status.step / status.total : status.phase === "ready" ? 1 : 0;

          root.dataset.phase = status.phase;
          bar.setAttribute("aria-valuenow", String(progress));

          if (working) {
            lastTotal = status.total;
            failedAt = Math.max(0, status.step - 1);
            // `step 0` is a state boot can report before it starts; it is not a step.
            if (status.step > 0) lastLabel = status.label;
            showStep(
              status.step > 0 ? status.label : "Starting",
              status.step > 0 ? "Step " + status.step + " of " + status.total : "Getting ready",
            );
          } else if (failed) {
            showStep(
              lastLabel === "Starting" ? "Failed" : lastLabel + " · failed",
              "Stopped at step " + (failedAt + 1) + " of " + lastTotal,
            );
          } else {
            showStep("Ready", "All " + lastTotal + " steps complete");
          }

          errorBox.hidden = !failed;
          if (failed) errorMessage.textContent = status.message;

          if (working) splashArt.working(status.step, status.total);
          else if (failed) splashArt.fail();
          else splashArt.ready();
        }

        function finish() {
          invoke("finish_boot").catch(function (err) {
            console.error(String(err));
          });
        }

        // Guards the handoff so it is only ever armed once, however status
        // first reaches `ready`: via the live listener, via the poll, or
        // both racing each other.
        var handoffArmed = false;

        function armReadyHandoff() {
          if (handoffArmed) return;
          handoffArmed = true;
          // Hold until MIN_VISIBLE_MS has elapsed, but not a moment longer:
          // if boot was already slow enough to clear it, this fires now.
          var remaining = Math.max(0, MIN_VISIBLE_MS - (performance.now() - startedAt));
          window.setTimeout(finish, remaining);
        }

        // Separate from `handoffArmed`: that one guards `finish` itself,
        // this guards *entering* the finalizing hold, and they cannot share
        // a flag. `armReadyHandoff` sets its guard only once the hold is
        // already over, so if both the live listener and the poll saw
        // `ready` and this reused that flag, the second caller would read
        // it as still unarmed and start a second hold on top of the first.
        var finalizeStarted = false;

        // The one state transition `render` cannot make on its own: boot.rs
        // never reports it, so it is driven from here rather than folded
        // into `render`'s `status.phase` branches.
        function handleReady() {
          if (finalizeStarted) return;
          finalizeStarted = true;

          bar.setAttribute("aria-valuenow", String(FINALIZE_PROGRESS));
          showStep("Finalizing", "Step " + lastTotal + " of " + lastTotal);
          splashArt.finalizing();

          window.setTimeout(function () {
            render({ phase: "ready" });
            armReadyHandoff();
          }, FINALIZE_HOLD_MS);
        }

        // `failed` is deliberately never auto-finished: the user should
        // get a chance to read why before being dropped into the main
        // window, so it waits on this button instead.
        continueButton.addEventListener("click", finish);

        /*
         * Tauri events are not replayed: if boot reports `Ready` before the
         * listener below is registered, that event is simply gone. Polling
         * `boot_status` closes that gap, but its response can also land
         * *after* a live event has already moved things forward, and
         * applying it then would overwrite newer data with older. This flag
         * is the guard. Status only ever moves forward (working, then
         * exactly one of ready/failed), so "has a live event arrived at
         * all" is enough to tell stale from current.
         */
        var liveEventReceived = false;

        // The poll is chained off `listen`'s promise rather than fired
        // alongside it, and that is the point: `listen` is itself an async
        // IPC call that resolves only once the listener is registered on
        // the Rust side. Polling before then would leave a window in which
        // an event could fire and be missed by both paths.
        listen("boot:status", function (event) {
          liveEventReceived = true;
          // `ready` goes through `handleReady`'s finalizing hold instead of
          // straight to `render`; see that function for why.
          if (event.payload.phase === "ready") return handleReady();
          render(event.payload);
        })
          .then(function () {
            return invoke("boot_status");
          })
          .then(function (polled) {
            if (liveEventReceived) return;
            // Boot may have finished before this window even loaded. Routing
            // through `handleReady` here too is what stops that case sitting
            // untouched until the watchdog in boot.rs forces the handoff ten
            // seconds later; it still gets its finalizing hold either way.
            if (polled.phase === "ready") return handleReady();
            render(polled);
          })
          .catch(function (err) {
            console.error(String(err));
          });
      })();
    </script>
  </body>
</html>
