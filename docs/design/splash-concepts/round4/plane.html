    <title>OpenKaava</title>
    <!--
      This file is deliberately standalone: no imports, no build step, no
      shared modules, no coupling of any kind to the rest of the application.
      The product name and the wordmark below are written out here, and
      `scripts/check-branding.mjs` fails `pnpm lint` if either stops agreeing
      with branding.toml.

      Everything it needs is inlined: the styles (with the token values copied
      literally out of src/tokens.css under the same names), the art (drawn on
      a canvas by the `splash-art` script, so there is no image to request),
      the typefaces (base64 woff2 subsets, in the font block below) and the boot logic
      (a plain non-module script at the bottom). src/splash/splash.test.ts
      compares the token copies and fails `pnpm test` on any difference.

      Plane. The picture is a floor of small tiles receding to a horizon, with
      the mark standing on it. Tiles shrink and thin out toward the horizon;
      the mark is lit from behind, so a ring of tiles catches its edge (that
      ring is the one place the user's accent appears) and a fading tiled
      reflection lies in front of it. Every tile is either present or absent
      by a baked noise threshold and steps through a few fixed brightness
      levels, so nothing is blurred and the picture stays a mosaic. Boot
      progress lights the floor row by row from the front; the bar under the
      picture carries the status and its waves are drawn by the page's own
      script, so a page that froze would freeze them too.

      The picture reads only neutral ink on the card's own ground, so one
      colouring serves dark and light and every accent. Green belongs to the
      bar alone.
    -->
    <!--
      Theme and accent, read before first paint. The shell mirrors the two
      appearance settings into localStorage (src/shell/settings/
      splashAppearance.ts) and this window shares that origin, so a stored
      value is available synchronously with no IPC round-trip. Nothing stored
      (a first launch) leaves the neutral palette in the CSS below. The test
      in src/splash/splash.test.ts runs this script, so the key and the value
      shape are checked against the writer.
    -->
    <script id="splash-appearance">
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem("kaava.splash-appearance"));
          var root = document.documentElement;
          var theme = stored.theme;
          if (theme === "system") {
            theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          if (theme === "light") root.dataset.theme = "light";
          if (/^(amber|blue|green|violet|coral)$/.test(stored.accent)) {
            root.dataset.accent = stored.accent;
          }
        } catch (err) {
          /* unset or unreadable: the neutral defaults stand */
        }
      })();
    </script>
    <!-- CONCEPT ONLY: stripped when this ships. Paste verbatim into <head>, directly after
         <script id="splash-appearance">, before any other script. -->
    <script id="concept-demo">
      (function () {
        window.__conceptErrors = [];
        window.addEventListener("error", function (e) {
          window.__conceptErrors.push(String(e.message) + " @" + e.lineno);
        });
        if (window.__TAURI__) return;
        var q = new URLSearchParams(location.search);
        var demo = q.get("demo");
        if (!demo) return;
        var root = document.documentElement;
        if (q.get("theme") === "light") root.dataset.theme = "light";
        if (q.get("accent")) root.dataset.accent = q.get("accent");
        var total = +(q.get("total") || 5);
        var stop = +(q.get("step") || 2);
        var labels = [
          "Locating manifest",
          "Reading manifest",
          "Scanning checkouts",
          "Starting Home and Files",
          "Starting Files",
        ];
        var events = [];
        var t = 300;
        var last = demo === "working" || demo === "failed" ? stop : total;
        for (var s = 1; s <= last; s++) {
          events.push([t, { phase: "working", step: s, total: total, label: labels[(s - 1) % labels.length] }]);
          t += 700;
        }
        if (demo === "ready" || demo === "cycle") events.push([t, { phase: "ready" }]);
        if (demo === "failed") {
          events.push([
            t,
            {
              phase: "failed",
              message: "Could not read C:\\Users\\dev\\projects\\saas\\kaava.toml: expected `=` at line 12",
            },
          ]);
        }
        window.__TAURI__ = {
          app: {
            getVersion: function () {
              return Promise.resolve("0.6.1");
            },
          },
          core: {
            invoke: function (cmd) {
              return Promise.resolve(
                cmd === "boot_status" ? { phase: "working", step: 0, total: total, label: "Starting…" } : null,
              );
            },
          },
          event: {
            listen: function (name, fn) {
              events.forEach(function (e) {
                setTimeout(function () {
                  fn({ payload: e[1] });
                }, e[0]);
              });
              return Promise.resolve(function () {});
            },
          },
        };
      })();
    </script>
    <style>
      /*
       * Four faces, each subset so it can be inlined (a linked font resolves
       * after first paint, and the text would reflow into it). Regenerate with
       * `pyftsubset <fontsource woff2> --unicodes=<range> --flavor=woff2`:
       *
       *   Inter 600          U+0041-005A, U+0061-007A  the wordmark, the company line and the tip label, plus U+2122
       *   Inter 500          U+0020-007E, U+00A9, U+00B7, U+2026, U+2122  the status label and the button

       *   IBM Plex Mono 500  U+0020-007E, U+00A9, U+00B7, U+2014, U+2122  the step line and error text

      /*
       * Tokens, copied from src/tokens.css under the same names. Only the ones
       * this file reads are here; src/splash/splash.test.ts fails if any of
       * them drifts from tokens.css, so a stale copy is caught by `pnpm test`
       * rather than noticed on a launch.
       */
      :root {
        color-scheme: dark;

        --bg-canvas: #0f0f10;
        --bg-surface-1: #141415;
        --bg-layer-1: #181a1b;
        --border-subtle: #222425;
        --border-subtle-1: #2c2e30;
        --border-strong: #36393a;
        --border-strong-1: #45484a;

        --txt-primary: #e4e6e6;
        --txt-secondary: #cacdce;
        --txt-tertiary: #afb3b6;
        --txt-placeholder: #959a9d;
        --txt-danger: #f4a49c;
        --danger: #e5534b;

        --accent-amber: #d98a3f;
        --accent-blue: #3f76ff;
        --accent-green: #4cb863;
        --accent-violet: #a585f0;
        --accent-coral: #e5736b;

        --sans: Inter, "Inter Variable", system-ui, "Segoe UI", sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

        --radius-md: 6px;
        --radius-xl: 12px;
        --shadow-overlay: 0 12px 32px -6px rgba(0, 0, 0, 0.6), 0 2px 6px rgba(0, 0, 0, 0.3);
        --control-md: 28px;
        --focus-ring: 2px solid color-mix(in srgb, var(--accent) 45%, transparent);
        --focus-ring-offset: 2px;

        /* Not a token: what the accent means for the splash's own parts.
           Neutral until the head script has found a stored accent, so a first
           launch is never drawn in a colour the user did not pick. */
        --accent: var(--txt-primary);
      }

      :root[data-theme="light"] {
        color-scheme: light;

        --bg-canvas: #f2f2f3;
        --bg-surface-1: #ffffff;
        --bg-layer-1: #f9f9f9;
        --border-subtle: #eaebec;
        --border-subtle-1: #e1e2e3;
        --border-strong: #d5d7d9;
        --border-strong-1: #cacdcf;

        --txt-primary: #0f0f10;
        --txt-secondary: #313435;
        --txt-tertiary: #494d50;
        --txt-placeholder: #5d6265;
        --txt-danger: #9c231b;
        --danger: #bf2c22;

        --accent-amber: #a85a14;
        --accent-blue: #2f62e0;
        --accent-green: #23803b;
        --accent-violet: #6c47c9;
        --accent-coral: #b8392f;
      }

      /* The accent. Neutral (the text colour) until the head script finds a
         stored one. Only the rim light around the mark reads it. */
      :root[data-accent="amber"] {
        --accent: var(--accent-amber);
      }
      :root[data-accent="blue"] {
        --accent: var(--accent-blue);
      }
      :root[data-accent="green"] {
        --accent: var(--accent-green);
      }
      :root[data-accent="violet"] {
        --accent: var(--accent-violet);
      }
      :root[data-accent="coral"] {
        --accent: var(--accent-coral);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      /* Transparent, not a colour: the window is transparent too, so the
         desktop shows through everywhere except the card below. Any fill
         here would be the square backing the rounded card is meant to
         remove. */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      /* The window is 72px larger than the card in each direction, and this
         padding is that gutter: room for the shadow to fall on transparent
         pixels instead of being clipped at the window edge. */
      body {
        padding: 36px;
      }

      /* The window is transparent and undecorated (see tauri.conf.json), so
         this card IS the visible window: the app window's radius, the
         hairline border and the overlay shadow are drawn here, anti-aliased
         by the compositor. The clip on `overflow` rounds the picture. The
         card is 600x420: a 310px picture, a 6px bar, a 104px band. The art
         script measures the mark and the lockup, so these numbers are the
         only place the geometry is written down. */
      .splash {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg-surface-1);
        border: 1px solid var(--border-subtle-1);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-overlay);
        color: var(--txt-primary);
        font-family: var(--sans);
      }

      /* A faint pool of light behind the mark and a vignette to the canvas
         colour, both under the tiles. Smooth, so kept to a whisper: the
         tiles are the picture. */
      .splash__image {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 310px;
        background:
          radial-gradient(
            ellipse 62% 58% at 50% 42%,
            color-mix(in srgb, var(--bg-surface-1) 93%, var(--txt-primary)) 0%,
            transparent 100%
          ),
          radial-gradient(
            ellipse 90% 100% at 50% 40%,
            transparent 55%,
            color-mix(in srgb, var(--bg-surface-1) 55%, var(--bg-canvas)) 100%
          );
      }

      :root[data-theme="light"] .splash__image {
        background: radial-gradient(
          ellipse 90% 100% at 50% 40%,
          transparent 50%,
          color-mix(in srgb, var(--bg-surface-1) 60%, var(--bg-canvas)) 100%
        );
      }

      /* The track. The canvas draws the fill over it, so an empty bar is
         still a visible bar. */
      .splash__bar {
        position: absolute;
        left: 0;
        right: 0;
        top: 310px;
        height: 6px;
        background: var(--border-subtle-1);
      }

      /* Picture and bar share one canvas, so the clock that moves the waves
         is the clock that lights the floor. */
      .splash__art {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 316px;
        display: block;
      }

      .splash__stage {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 310px;
      }

      /* 104px square; the avocado fills 56x83 of it, centred, so its visible
         middle is the box's middle. */
      .splash__mark {
        position: absolute;
        left: 50%;
        top: 68px;
        width: 104px;
        height: 104px;
        margin-left: -52px;
        display: block;
        overflow: visible;
        transition: opacity 400ms;
      }

      /* Lit from above: full ink at the crown, a step toward the ground at
         the foot. */
      .splash__lit-top {
        stop-color: var(--txt-primary);
      }

      .splash__lit-bottom {
        stop-color: color-mix(in srgb, var(--txt-primary) 76%, var(--bg-surface-1));
      }

      .splash__lockup {
        position: absolute;
        left: 0;
        right: 0;
        top: 204px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        transition: opacity 300ms;
      }

      /* The name and its trade mark sign share one line box, so the sign sits
         beside the word without being inside the element that holds it. */
      .splash__name {
        display: block;
        font-family: var(--sans);
        font-size: 30px;
        font-weight: 600;
        line-height: 1;
        white-space: nowrap;
        color: var(--txt-primary);
      }

      .splash__wordmark {
        display: inline;
        margin: 0;
        font: inherit;
        color: inherit;
      }

      /* A hairline, drawn: the box-drawing glyph is not in any face here. As
         tall as the wordmark's capitals. */
      .splash__rule {
        flex: none;
        width: 1px;
        height: 22px;
        background: var(--border-strong-1);
      }

      .splash__company {
        font-family: var(--sans);
        font-size: 11px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--txt-tertiary);
      }

      /* Inter's trade mark sign is already a raised glyph (top at cap height
         of its own em), so shrinking it also lowers it: `top` puts it back
         level with the capitals of the text it follows. */
      .splash__tm {
        font-size: 0.58em;
        line-height: 0;
        letter-spacing: 0;
        position: relative;
        top: -0.62em;
        margin-left: 0.1em;
      }

      .splash__company .splash__tm {
        font-size: 0.9em;
        top: -0.09em;
        margin-left: 0;
      }

      .splash__band {
        position: absolute;
        left: 0;
        right: 0;
        top: 316px;
        bottom: 0;
        padding: 13px 22px 13px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: var(--bg-canvas);
      }

      .splash__band-top,
      .splash__band-bottom {
        display: flex;
        justify-content: space-between;
        gap: 24px;
      }

      .splash__band-top {
        align-items: flex-start;
      }

      .splash__band-bottom {
        align-items: baseline;
      }

      .splash__tipbox {
        min-width: 0;
        max-width: 340px;
      }

      .splash__tip-label {
        display: block;
        margin-bottom: 5px;
        font-family: var(--sans);
        font-size: 10px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.16em;
        color: var(--txt-placeholder);
      }

      .splash__tip {
        margin: 0;
        font-family: var(--sans);
        font-size: 12px;
        font-weight: 400;
        line-height: 1.45;
        color: var(--txt-secondary);
      }

      .splash__status {
        flex: none;
        text-align: right;
      }

      .splash__step {
        margin: 0;
        font-family: var(--sans);
        font-size: 13px;
        font-weight: 500;
        line-height: 1.3;
        color: var(--txt-primary);
      }

      .splash__substep {
        margin: 3px 0 0;
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        line-height: 1.3;
        color: var(--txt-placeholder);
      }

      .splash[data-phase="failed"] .splash__step {
        color: var(--txt-danger);
      }

      .splash__legal,
      .splash__version {
        margin: 0;
        font-family: var(--sans);
        font-size: 11px;
        font-weight: 400;
        line-height: 1.2;
      }

      .splash__legal {
        color: var(--txt-placeholder);
      }

      .splash__version {
        color: var(--txt-tertiary);
      }

      /* Failure keeps the mark (dimmed) and gives the floor to the message,
         so the lockup steps aside. */
      .splash[data-phase="failed"] .splash__mark {
        opacity: 0.5;
      }

      .splash[data-phase="failed"] .splash__lockup {
        opacity: 0;
      }

      .splash__error {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 310px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding: 0 28px 24px;
      }

      /* A panel rather than bare text: the message has to stay legible over
         the tiles. */
      .splash__error-panel {
        display: flex;
        align-items: center;
        gap: 16px;
        width: 100%;
        max-width: 500px;
        padding: 12px 14px 12px 16px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-xl);
        background: color-mix(in srgb, var(--bg-surface-1) 94%, transparent);
      }

      .splash__error-message {
        flex: 1;
        min-width: 0;
        margin: 0;
        text-align: left;
        overflow-wrap: anywhere;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.45;
        color: var(--txt-danger);
      }

      /* The design system's secondary button: layer fill, strong border. */
      .splash__continue {
        flex: none;
        height: var(--control-md);
        padding: 0 12px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-md);
        background: var(--bg-layer-1);
        color: var(--txt-primary);
        font-family: var(--sans);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }

      .splash__continue:hover {
        border-color: var(--border-strong-1);
      }

      .splash__continue:focus-visible {
        outline: var(--focus-ring);
        outline-offset: var(--focus-ring-offset);
      }

      @media (prefers-reduced-motion: reduce) {
        .splash__mark,
        .splash__lockup {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash" data-phase="working">
      <div class="splash__image" aria-hidden="true"></div>

      <!-- The progress bar proper. The art draws its fill; the boot script
           keeps aria-valuenow honest. -->
      <div
        class="splash__bar"
        role="progressbar"
        aria-label="Startup"
        aria-valuemin="0"
        aria-valuemax="1"
        aria-valuenow="0"
      ></div>

      <canvas class="splash__art" aria-hidden="true"></canvas>

      <div class="splash__stage">
        <svg class="splash__mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="splash-lit" x1="0" y1="0" x2="0" y2="1">
              <stop class="splash__lit-top" offset="0.1" />
              <stop class="splash__lit-bottom" offset="0.95" />
            </linearGradient>
          </defs>
          <path
            fill="url(#splash-lit)"
            d="M12 2.4c3.3 0 7 4.2 7 10.1 0 4.8-3.1 9.1-7 9.1s-7-4.3-7-9.1C5 6.6 8.7 2.4 12 2.4zm0 8.4a2.9 2.9 0 1 0 0 5.8 2.9 2.9 0 0 0 0-5.8z"
          />
        </svg>

        <div class="splash__lockup">
          <div class="splash__name"><p class="splash__wordmark">OpenKaava</p><span class="splash__tm">™</span></div>
          <i class="splash__rule" aria-hidden="true"></i>
          <span class="splash__company">Veistra<span class="splash__tm">™</span></span>
        </div>
      </div>

      <div class="splash__error" hidden>
        <div class="splash__error-panel">
          <p class="splash__error-message"></p>
          <button type="button" class="splash__continue">Continue anyway</button>
        </div>
      </div>

      <div class="splash__band">
        <div class="splash__band-top">
          <div class="splash__tipbox">
            <span class="splash__tip-label">TIP</span>
            <p class="splash__tip">A different OpenKaava tip appears here on each launch.</p>
          </div>
          <div class="splash__status">
            <p class="splash__step">Starting</p>
            <p class="splash__substep">Preparing</p>
          </div>
        </div>
        <div class="splash__band-bottom">
          <p class="splash__legal">© 2026 Veistra. All rights reserved.</p>
          <span class="splash__version"></span>
        </div>
      </div>
    </div>

    <script id="splash-art">
      /*
       * Plane. Two things are drawn on one canvas: the picture (a sky of
       * square tiles over a floor of perspective tiles, the mark standing on
       * the floor) and, on the strip below it, the progress bar.
       *
       * The tiles are laid out once. Each carries a static energy (the pool of
       * light, the rim around the mark, the reflection, the quiet under the
       * lockup) and a lit energy that only counts once boot progress has
       * reached its row. A frame sums them, drops a tile whose energy is below
       * its noise threshold, steps the rest to one of eight alphas and fills
       * each alpha in a single path. The picture is repainted only while a
       * state is changing; the bar is repainted every frame, because its waves
       * are the sign that this page is still running.
       *
       * Nothing here talks to Tauri. The boot script calls the four methods on
       * `splashArt` and this file owns the time, so a status that arrives late
       * or all at once still plays out as a sequence.
       */
      var splashArt = (function () {
        "use strict";

        var canvas = document.querySelector(".splash__art");
        var ctx = canvas.getContext("2d");
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        var BAR = 6;
        // Alpha of each of the eight brightness steps.
        var STEPS = [0.1, 0.17, 0.26, 0.37, 0.5, 0.65, 0.82, 1];
        // How far the reflection reaches below the mark's foot.
        var REFLECT = 58;
        var EDGE = 28;

        // The mark's outline, the four cubics of the path in the markup, in its
        // 24-unit space. Written out because a Path2D is not worth depending
        // on for a shape this small, and the tiles need to ask it questions.
        var CUBICS = [
          [12, 2.4, 15.3, 2.4, 19, 6.6, 19, 12.5],
          [19, 12.5, 19, 17.3, 15.9, 21.6, 12, 21.6],
          [12, 21.6, 8.1, 21.6, 5, 17.3, 5, 12.5],
          [5, 12.5, 5, 6.6, 8.7, 2.4, 12, 2.4],
        ];
        var SEED = { x: 12, y: 13.7, r: 2.9 };

        function c01(x) {
          return x < 0 ? 0 : x > 1 ? 1 : x;
        }
        function smooth(a, b, x) {
          var t = c01((x - a) / (b - a));
          return t * t * (3 - 2 * t);
        }
        function hash(a, b, c) {
          var h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 2246822519)) | 0;
          h = Math.imul(h ^ (h >>> 13), 1274126177);
          h ^= h >>> 16;
          return (h >>> 0) / 4294967296;
        }

        // A 64x64 threshold tile with the even spacing of blue noise, made by
        // high-passing white noise and re-ranking it a few times. White noise
        // clumps; this does not, so a half-lit region reads as a considered
        // scatter rather than static. It repeats every 64 cells.
        var BN = (function () {
          var N = 64;
          var n = N * N;
          var v = new Float32Array(n);
          var i;
          var pass;
          for (i = 0; i < n; i++) v[i] = hash(i % N, (i / N) | 0, 5);
          for (pass = 0; pass < 3; pass++) {
            var high = new Float32Array(n);
            for (var y = 0; y < N; y++) {
              for (var x = 0; x < N; x++) {
                var sum = 0;
                for (var dy = -2; dy <= 2; dy++) {
                  for (var dx = -2; dx <= 2; dx++) sum += v[((y + dy) & 63) * N + ((x + dx) & 63)];
                }
                high[y * N + x] = v[y * N + x] - sum / 25;
              }
            }
            var order = [];
            for (i = 0; i < n; i++) order.push(i);
            order.sort(function (a, b) {
              return high[a] - high[b];
            });
            for (i = 0; i < n; i++) v[order[i]] = i / n;
          }
          return v;
        })();
        function noise(i, j) {
          return BN[(j & 63) * 64 + (i & 63)];
        }

        /* ---- colour ---- */
        function parseColour(v) {
          var m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(v || "").trim());
          if (!m) return null;
          var h = m[1];
          if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
          return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
        }
        function mix(a, b, t) {
          return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
        }
        function rgba(c, a) {
          return "rgba(" + Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]) + "," + a + ")";
        }

        var P = null;
        var fills = null; // [colour][step] -> fillStyle; colours are ink, accent, danger
        function palette() {
          var root = document.documentElement;
          var cs = getComputedStyle(root);
          var light = root.dataset.theme === "light";
          function get(name, fallback) {
            return parseColour(cs.getPropertyValue(name)) || fallback;
          }
          var ink = get("--txt-primary", light ? [15, 15, 16] : [228, 230, 230]);
          P = {
            light: light,
            ink: ink,
            accent: get("--accent", ink),
            danger: get("--danger", light ? [191, 44, 34] : [229, 83, 75]),
            green: get("--accent-green", light ? [35, 128, 59] : [76, 184, 99]),
          };
          // Dark ink on a light ground is heavier than light ink on a dark one.
          var gain = light ? 0.92 : 1;
          fills = [P.ink, P.accent, P.danger].map(function (c) {
            return STEPS.map(function (a) {
              return rgba(c, +(a * gain).toFixed(3));
            });
          });
        }

        /* ---- layout ---- */
        var W = 0;
        var H = 0;
        var IH = 0; // height of the picture; the bar sits below it
        var dpr = 1;
        var mk = null;
        var lk = null;
        var horizon = 0;
        var grid = null; // the mark's mask: inside flags and distance to it

        function measure() {
          var box = canvas.getBoundingClientRect();
          var size = IH * 0.335;
          var x0 = W / 2 - size / 2;
          var y0 = IH * 0.24;
          var mark = document.querySelector(".splash__mark");
          if (mark) {
            var r = mark.getBoundingClientRect();
            if (r.width > 0) {
              size = r.width;
              x0 = r.left - box.left;
              y0 = r.top - box.top;
            }
          }
          var u = size / 24;
          mk = { u: u, x0: x0, y0: y0, cx: x0 + 12 * u, top: y0 + 2.4 * u, bottom: y0 + 21.6 * u };
          mk.h = mk.bottom - mk.top;
          mk.cy = (mk.top + mk.bottom) / 2;

          // The lockup's own extent, not the full-width box that centres it.
          lk = { x: W / 2 - 150, y: IH * 0.64, w: 300, h: 34 };
          var wm = document.querySelector(".splash__name");
          var co = document.querySelector(".splash__company");
          if (wm && co) {
            var a = wm.getBoundingClientRect();
            var b = co.getBoundingClientRect();
            if (a.width > 0 && b.width > 0) {
              lk = { x: a.left - box.left, y: a.top - box.top, w: b.right - a.left, h: a.height };
            }
          }
          // Eye level passes behind the mark's crown.
          horizon = Math.round(mk.top + mk.h * 0.16);
        }

        function outline() {
          var pts = [];
          for (var c = 0; c < CUBICS.length; c++) {
            var q = CUBICS[c];
            for (var k = 0; k < 20; k++) {
              var t = k / 20;
              var s = 1 - t;
              var a = s * s * s;
              var b = 3 * s * s * t;
              var e = 3 * s * t * t;
              var f = t * t * t;
              pts.push([
                mk.x0 + mk.u * (a * q[0] + b * q[2] + e * q[4] + f * q[6]),
                mk.y0 + mk.u * (a * q[1] + b * q[3] + e * q[5] + f * q[7]),
              ]);
            }
          }
          return pts;
        }

        function inPoly(pts, x, y) {
          var hit = false;
          for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) {
            var a = pts[i];
            var b = pts[j];
            if (a[1] > y !== b[1] > y && x < ((b[0] - a[0]) * (y - a[1])) / (b[1] - a[1]) + a[0]) hit = !hit;
          }
          return hit;
        }

        // A one-pixel mask of the avocado (seed hole excluded) and, for every
        // other cell, the distance to the nearest edge. The rim light and the
        // reflection both ask it where the mark is.
        function buildGrid() {
          var pts = outline();
          var gx = Math.floor(mk.x0 + 5 * mk.u - EDGE);
          var gy = Math.floor(mk.top - EDGE);
          var gw = Math.ceil(14 * mk.u + EDGE * 2) + 2;
          var gh = Math.ceil(mk.h + EDGE * 2) + 2;
          var inside = new Uint8Array(gw * gh);
          var dist = new Float32Array(gw * gh);
          var sx = mk.x0 + SEED.x * mk.u;
          var sy = mk.y0 + SEED.y * mk.u;
          var sr = SEED.r * mk.u;
          var x;
          var y;
          var i;
          for (y = 0; y < gh; y++) {
            for (x = 0; x < gw; x++) {
              var px = gx + x + 0.5;
              var py = gy + y + 0.5;
              i = y * gw + x;
              var on = inPoly(pts, px, py) && Math.hypot(px - sx, py - sy) > sr;
              inside[i] = on ? 1 : 0;
              dist[i] = on ? 0 : 1e4;
            }
          }
          // Two-pass chamfer distance.
          for (y = 0; y < gh; y++) {
            for (x = 0; x < gw; x++) {
              i = y * gw + x;
              var v = dist[i];
              if (x > 0) v = Math.min(v, dist[i - 1] + 1);
              if (y > 0) {
                v = Math.min(v, dist[i - gw] + 1);
                if (x > 0) v = Math.min(v, dist[i - gw - 1] + 1.4142);
                if (x < gw - 1) v = Math.min(v, dist[i - gw + 1] + 1.4142);
              }
              dist[i] = v;
            }
          }
          for (y = gh - 1; y >= 0; y--) {
            for (x = gw - 1; x >= 0; x--) {
              i = y * gw + x;
              var w = dist[i];
              if (x < gw - 1) w = Math.min(w, dist[i + 1] + 1);
              if (y < gh - 1) {
                w = Math.min(w, dist[i + gw] + 1);
                if (x < gw - 1) w = Math.min(w, dist[i + gw + 1] + 1.4142);
                if (x > 0) w = Math.min(w, dist[i + gw - 1] + 1.4142);
              }
              dist[i] = w;
            }
          }
          grid = { x: gx, y: gy, w: gw, h: gh, inside: inside, dist: dist };
        }

        function cell(x, y) {
          var ix = Math.floor(x - grid.x);
          var iy = Math.floor(y - grid.y);
          if (ix < 0 || iy < 0 || ix >= grid.w || iy >= grid.h) return -1;
          return iy * grid.w + ix;
        }
        function insideAt(x, y) {
          var i = cell(x, y);
          return i >= 0 && grid.inside[i] === 1;
        }
        function distAt(x, y) {
          var i = cell(x, y);
          return i < 0 ? 1e4 : grid.dist[i];
        }

        // How much of the tile at (x, y) lies in the mark's mirror image.
        function reflected(x, y, w, h) {
          var hit = 0;
          var offs = [
            [0, 0],
            [-0.3, 0],
            [0.3, 0],
            [0, -0.3],
            [0, 0.3],
          ];
          for (var i = 0; i < offs.length; i++) {
            if (insideAt(x + offs[i][0] * w, 2 * mk.bottom - (y + offs[i][1] * h))) hit++;
          }
          return hit / offs.length;
        }

        // The rim: tiles hugging the mark's edge, strongest where it faces the
        // light above and behind it.
        function rimAt(x, y) {
          var d = distAt(x, y);
          if (d > EDGE - 2) return 0;
          var facing = (y - mk.cy) / (mk.h * 0.55);
          var dir = 0.4 + 0.6 * c01(0.55 - facing * 0.6);
          return Math.exp(-Math.max(0, d - 1.5) / 5) * dir;
        }

        // The quiet under the lockup: 1 inside its box, easing to 0 beyond.
        function quiet(x, y) {
          var dx = Math.max(lk.x - 20 - x, 0, x - (lk.x + lk.w + 20));
          var dy = Math.max(lk.y - 10 - y, 0, y - (lk.y + lk.h + 10));
          return 1 - smooth(0, 24, Math.hypot(dx, dy));
        }

        /* ---- tiles ---- */
        // Parallel arrays, one entry per tile. Rects are in CSS pixels, snapped
        // to device pixels so every tile has crisp edges.
        var T = { n: 0 };

        // `q` is the tile's share of the quiet under the lockup (1 = none): the
        // lit front and the sparkles keep clear of the text too.
        function addTile(kind, i, j, x, y, w, h, es, el, rim, q) {
          if (insideAt(x, y)) return;
          // The core of the quiet patch holds no tiles at all, not just faint ones.
          if (q < 0.2) return;
          var spark = kind === 0 ? hash(i, j, 7) > 0.9965 : w >= 5 && hash(i, j, 9) > 0.9985;
          if (q < 0.9) spark = false;
          if (spark) {
            w *= 1.25;
            h *= 1.25;
          }
          var rw = Math.max(1 / dpr, Math.round(w * dpr) / dpr);
          var rh = Math.max(1 / dpr, Math.round(h * dpr) / dpr);
          T.rx.push(Math.round((x - w / 2) * dpr) / dpr);
          T.ry.push(Math.round((y - h / 2) * dpr) / dpr);
          T.rw.push(rw);
          T.rh.push(rh);
          T.rr.push(Math.min(rw, rh) >= 3 ? Math.min(rw, rh) * 0.24 : 0);
          T.cy.push(y);
          T.kind.push(kind);
          T.es.push(es);
          T.el.push(el);
          T.rim.push(rim);
          T.thr.push(noise(i, j));
          T.jit.push(hash(i, j, 3));
          T.spark.push(spark ? 1 : 0);
          T.tint.push(rim > 0.3 ? 1 : 0);
          T.q.push(q);
          T.n++;
        }

        function buildTiles() {
          T = { n: 0, rx: [], ry: [], rw: [], rh: [], rr: [], cy: [], kind: [], es: [], el: [], rim: [], thr: [], jit: [], spark: [], tint: [], q: [] };
          if (W < 8 || IH < 8) return;
          var gain = P.light ? 0.55 : 1;
          var cx = W / 2;
          var x;
          var y;
          var i;
          var j;

          // Sky: square tiles, three pixels on a six-pixel pitch, thinning
          // upward. Rows count up from the horizon.
          var pitch = 6;
          var iMax = Math.ceil(cx / pitch) + 1;
          for (j = 0, y = horizon - pitch / 2; y > -pitch; j++, y -= pitch) {
            for (i = -iMax; i <= iMax; i++) {
              x = cx + (i + 0.5) * pitch;
              if (x < -pitch || x > W + pitch) continue;
              var dxs = (x - mk.cx) / (W * 0.32);
              var dys = (y - (mk.top + mk.h * 0.4)) / (mk.h * 1.3);
              var pool = 0.46 * gain * Math.exp(-(dxs * dxs + dys * dys));
              var glow = 0.22 * Math.exp(-Math.pow((horizon - y) / 9, 2)) * Math.exp(-Math.pow((x - mk.cx) / (W * 0.3), 2));
              var topFade = 0.2 + 0.8 * smooth(0, 60, y);
              var rimS = rimAt(x, y);
              addTile(0, i, j, x, y, 3, 3, 0.035 + pool * topFade + glow + 0.62 * rimS, 0, rimS, 1);
            }
          }

          // Floor: columns converge on the horizon, rows crowd toward it.
          // Foreshortening is eased so tiles near the mark stay tiles.
          var S0 = IH - horizon;
          var KX = 0.078;
          function ratio(s) {
            return 0.6 + 0.25 * (s / S0);
          }
          var s = S0 - (KX * S0 * ratio(S0)) / 2;
          for (j = 0; ; j++) {
            var px = KX * s;
            var py = px * ratio(s);
            if (py < 1.5) break;
            y = horizon + s;
            var t = s / S0;
            var haze = smooth(0, 0.3, t);
            var unlit = (0.06 + 0.12 * t) * haze;
            var lit = (0.16 + 0.3 * t) * haze;
            var fill = 0.44 + 0.14 * (1 - t);
            // Every fourth row and every fifth column is a touch brighter: a
            // floor needs a few lines to be a floor, and these run to the
            // vanishing point.
            var rowLine = j % 4 === 0 ? 0.07 * haze : 0;
            var jMax = Math.ceil(cx / px) + 1;
            for (i = -jMax; i <= jMax; i++) {
              x = cx + (i + 0.5) * px;
              if (x < -px || x > W + px) continue;
              var dxp = (x - mk.cx) / (W * 0.26);
              var dyp = (y - (mk.bottom + 10)) / 48;
              var spill = 0.3 * gain * Math.exp(-(dxp * dxp + dyp * dyp));
              var mirror = 0;
              if (y >= mk.bottom - 2 && y <= mk.bottom + REFLECT) {
                mirror = reflected(x, y, px * fill, py * fill) * Math.pow(1 - (y - mk.bottom) / REFLECT, 0.9) * 1.5;
              }
              var q = 1 - 0.95 * quiet(x, y);
              var colLine = (((i % 5) + 5) % 5 === 0 ? 0.07 : 0) * haze;
              var rimF = rimAt(x, y);
              var base = unlit + spill + rowLine + colLine;
              addTile(1, i + 500, j, x, y, px * fill, py * fill, (base + mirror * (0.5 + 0.5 * q)) * q + 0.62 * rimF, (lit - unlit) * q, rimF, q);
            }
            s -= py;
          }
        }

        function layout() {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          W = canvas.clientWidth;
          H = canvas.clientHeight;
          IH = H - BAR;
          canvas.width = Math.round(W * dpr);
          canvas.height = Math.round(H * dpr);
          if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          measure();
          if (W >= 8 && IH >= 8) buildGrid();
          buildTiles();
          paintedKey = "";
        }

        /* ---- state ---- */
        var phase = "working";
        var levT = 0.025; // where the bar is headed
        var lev = 0; // where it is
        var litT = 0; // the same for the floor: how far from the front it is lit
        var lit = 0;
        var amp = 1; // wave height, 1 while working
        var wph = 0; // wave phase, stopped by failure
        var boost = 0; // ready: the rim lifts one step
        var fk = 0; // failure ramp

        /* ---- drawing ---- */
        var buckets = [];
        for (var b = 0; b < 24; b++) buckets.push([]);
        var paintedKey = "";

        function paintTiles() {
          if (!ctx) return;
          ctx.clearRect(0, 0, W, IH);
          var i;
          var k;
          for (k = 0; k < buckets.length; k++) buckets[k].length = 0;
          var front = IH - lit * (IH - horizon);
          var frontGain = 1 - smooth(0.9, 1, lit);
          var dim = 1 - 0.3 * fk;
          for (i = 0; i < T.n; i++) {
            var e = T.es[i];
            var near = 0;
            if (T.kind[i] === 1) {
              e += T.el[i] * c01((T.cy[i] - front) / 16 + 0.5);
              near = c01(1 - Math.abs(T.cy[i] - front) / 9) * frontGain * T.q[i];
              e += near * 0.24;
            }
            e += boost * 0.18 * T.rim[i];
            e *= dim;
            if (!T.spark[i] && e * 1.3 <= T.thr[i]) continue;
            var step = 7;
            if (!T.spark[i]) {
              var a = 0.08 + 0.92 * Math.pow(Math.min(1, e), 0.8) + (T.jit[i] - 0.5) * 0.2;
              step = Math.max(0, Math.min(7, Math.floor(a * 8)));
            }
            // Only the rim takes the accent; the lit front is plain ink, and
            // danger once boot has failed.
            var colour = 0;
            if (near > 0.4) colour = fk > 0.35 ? 2 : 0;
            else if (T.tint[i]) colour = 1;
            buckets[colour * 8 + step].push(i);
          }
          var round = typeof ctx.roundRect === "function";
          for (k = 0; k < buckets.length; k++) {
            var list = buckets[k];
            if (!list.length) continue;
            ctx.fillStyle = fills[(k / 8) | 0][k % 8];
            ctx.beginPath();
            for (var n = 0; n < list.length; n++) {
              var t = list[n];
              if (round && T.rr[t] > 0) ctx.roundRect(T.rx[t], T.ry[t], T.rw[t], T.rh[t], T.rr[t]);
              else ctx.rect(T.rx[t], T.ry[t], T.rw[t], T.rh[t]);
            }
            ctx.fill();
          }
          paintedKey = lit + "|" + boost + "|" + fk;
        }

        // Two layers of water in a six-pixel strip: a pale wave behind a solid
        // one, each a sum of two sines moving at its own pace. Where the tops
        // fall is the wave shape, so a single frame still shows it.
        function paintBar() {
          if (!ctx) return;
          var by = IH;
          ctx.clearRect(0, by, W, BAR);
          var fw = Math.round(W * lev * dpr) / dpr;
          if (fw < 1) return;
          var base = mix(P.green, P.danger, fk);
          var pale = mix(base, [255, 255, 255], 0.4);
          ctx.save();
          ctx.beginPath();
          ctx.rect(0, by, fw, BAR);
          ctx.clip();
          // Long swells (about 55 and 38 pixels crest to crest) so the shape is
          // readable at this height, each with a faster ripple on top.
          var layers = [
            { c: rgba(pale, 0.7), lvl: 0.3, amp: 1.8, k: 0.115, sp: 3.0, ph: 0, k2: 0.26, ph2: 1.9 },
            { c: rgba(base, 1), lvl: 0.54, amp: 1.7, k: 0.165, sp: 4.4, ph: 2.1, k2: 0.37, ph2: 0.6 },
          ];
          for (var n = 0; n < layers.length; n++) {
            var L = layers[n];
            ctx.fillStyle = L.c;
            ctx.beginPath();
            ctx.moveTo(0, by + BAR);
            for (var x = 0; x <= fw + 2; x += 2) {
              var wave = 0.78 * Math.sin(L.k * x - wph * L.sp - L.ph) + 0.22 * Math.sin(L.k2 * x - wph * L.sp * 1.4 + L.ph2);
              ctx.lineTo(x, by + BAR * L.lvl + wave * amp * L.amp);
            }
            ctx.lineTo(fw + 2, by + BAR);
            ctx.closePath();
            ctx.fill();
          }
          // The leading edge, a little brighter than the water behind it.
          ctx.fillStyle = rgba([255, 255, 255], 0.3 * (1 - fk) * (1 - smooth(0.97, 1, lev)));
          ctx.fillRect(Math.max(0, fw - 2), by, 2, BAR);
          ctx.restore();
        }

        function paintAll() {
          if (!P || !ctx) return;
          paintTiles();
          paintBar();
        }

        /* ---- the clock ---- */
        var running = false;
        var last = 0;

        function ease(v, to, dt, rate) {
          var n = v + (to - v) * (1 - Math.exp(-dt * rate));
          return Math.abs(to - n) < 0.0006 ? to : n;
        }

        function settled() {
          if (reduce) return true;
          if (phase === "failed") return fk >= 1;
          if (phase === "ready") return lev >= 1 && lit >= 1 && amp <= 0 && boost >= 1;
          return false;
        }

        function frame(now) {
          // Clamped: a hidden window stops delivering frames, and the first one
          // back must not teleport the animation to its end.
          var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
          last = now;
          if (phase === "failed") {
            fk = Math.min(1, fk + dt / 0.45);
          } else {
            lev = ease(lev, levT, dt, 2.6);
            lit = ease(lit, litT, dt, 1.5);
            wph += dt;
            if (phase === "ready") {
              if (lev >= 0.985) amp = Math.max(0, amp - dt / 0.7);
              if (lit >= 0.96) boost = Math.min(1, boost + dt / 1.1);
            }
          }
          paintBar();
          if (paintedKey !== lit + "|" + boost + "|" + fk) paintTiles();
          if (settled()) {
            running = false;
            last = 0;
          } else {
            requestAnimationFrame(frame);
          }
        }

        function kick() {
          if (reduce) {
            // Still, but not blind: every state is drawn once, with no waves.
            lev = levT;
            if (phase !== "failed") lit = litT;
            amp = 0;
            boost = phase === "ready" ? 1 : 0;
            fk = phase === "failed" ? 1 : 0;
            paintAll();
            return;
          }
          if (running) return;
          running = true;
          last = 0;
          requestAnimationFrame(frame);
        }

        palette();
        layout();
        window.addEventListener("resize", function () {
          layout();
          paintAll();
        });
        // Text metrics move once the inlined faces decode; the lockup's box
        // feeds the quiet patch, so measure again.
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function () {
            layout();
            paintAll();
          });
        }
        if (reduce) amp = 0;
        paintAll();
        kick();

        return {
          /** Boot is at `step` of `total`. */
          working: function (step, total) {
            if (phase !== "working") return;
            levT = step > 0 ? Math.min(0.92, Math.max(0.025, (step - 0.5) / Math.max(1, total))) : 0.025;
            litT = levT;
            kick();
          },
          /** Boot is done and the splash is holding a beat before ready. */
          finalizing: function () {
            if (phase !== "working") return;
            levT = 0.95;
            litT = 0.95;
            kick();
          },
          ready: function () {
            if (phase === "failed") return;
            phase = "ready";
            levT = 1;
            litT = 1;
            kick();
          },
          fail: function () {
            phase = "failed";
            kick();
          },
        };
      })();
    </script>

    <script>
      /*
       * A plain <script>, not `type="module"`: a module is deferred and
       * fetched as a separate resource even when it imports nothing, and
       * this needs neither. Nothing here is transformed by Vite.
       *
       * The Tauri API is reached through `window.__TAURI__`, which requires
       * `app.withGlobalTauri: true` in tauri.conf.json. That global is
       * injected by the Tauri runtime as an initialisation script, so it is
       * already present before this runs and costs no request.
       */
      (function () {
        "use strict";

        /*
         * Minimum time the splash stays up, no matter how fast boot
         * finishes. This holds back only the *handoff*: the Rust-side work
         * in boot.rs runs at full speed either way. A boot this app can run
         * finishes in well under a second, so without a floor the splash
         * would read as barely doing anything.
         *
         * Kept well clear of `WATCHDOG_TIMEOUT` in boot.rs (10s): that timer
         * force-closes the splash if nothing calls `finish_boot` in time, as
         * a fallback for a frontend that never got the chance to. This timer
         * is the frontend getting that chance; if the two ever converged, the
         * watchdog would start racing the normal path.
         */
        var MIN_VISIBLE_MS = 5000;

        /*
         * How long the bar sits at `FINALIZE_PROGRESS` under a "Finalizing"
         * label before jumping to the real `Ready` state. `boot::BootStatus`
         * has no phase for this: the moment boot.rs reports `Ready`, it is
         * genuinely done. The hold exists because a bar that snaps from the
         * last step straight to "Ready" reads as though the last stretch of
         * work was skipped. It runs *inside* `MIN_VISIBLE_MS`, not on top of
         * it.
         */
        var FINALIZE_HOLD_MS = 450;
        var FINALIZE_PROGRESS = 0.95;

        // One per launch. Placeholders: the real list lives with the docs.
        var TIPS = ["A different OpenKaava tip appears here on each launch.", "Tips are short, one sentence, and true."];

        var startedAt = performance.now();

        var errorBox = document.querySelector(".splash__error");
        var errorMessage = document.querySelector(".splash__error-message");
        var continueButton = document.querySelector(".splash__continue");
        var bar = document.querySelector(".splash__bar");
        var root = document.querySelector(".splash");
        var step = document.querySelector(".splash__step");
        var sub = document.querySelector(".splash__substep");
        var tip = document.querySelector(".splash__tip");
        var version = document.querySelector(".splash__version");
        // The step in flight, kept so a failure can say where it stopped.
        var lastLabel = "Starting";
        var lastStep = 0;
        var lastTotal = 0;

        tip.textContent = TIPS[Math.floor(Math.random() * TIPS.length)];

        var tauri = window.__TAURI__;

        /*
         * Absent when this file is opened directly in a browser, which is
         * how its layout gets checked without building the app. Bailing
         * here leaves the static markup above on screen as a preview of the
         * initial state, rather than throwing on the first property access.
         */
        if (!tauri) return;

        var invoke = tauri.core.invoke;
        var listen = tauri.event.listen;

        // Empty until it resolves; a failure leaves it empty rather than wrong.
        if (tauri.app && tauri.app.getVersion) {
          tauri.app
            .getVersion()
            .then(function (v) {
              version.textContent = "Version " + v;
            })
            .catch(function () {});
        }

        /** Mirrors `boot::BootStatus` — see src/bindings.ts for the types. */
        function render(status) {
          var working = status.phase === "working";
          var failed = status.phase === "failed";
          var progress = working ? status.step / status.total : status.phase === "ready" ? 1 : 0;

          root.dataset.phase = status.phase;
          bar.setAttribute("aria-valuenow", String(progress));

          // `step 0` is a state boot can report before it starts; it is not a step.
          if (working) {
            lastStep = status.step;
            lastTotal = status.total;
            lastLabel = status.step > 0 ? status.label : "Starting";
          }

          if (working) {
            step.textContent = lastLabel;
            sub.textContent = lastStep > 0 ? "Step " + lastStep + " of " + lastTotal : "Preparing";
          } else if (failed) {
            step.textContent = lastStep > 0 ? lastLabel + " · failed" : "Failed to start";
            sub.textContent = lastStep > 0 ? "Stopped at step " + lastStep + " of " + lastTotal : "Startup stopped";
          } else {
            step.textContent = "Ready";
            sub.textContent = lastTotal > 0 ? "All " + lastTotal + " steps complete" : "Startup complete";
          }

          errorBox.hidden = !failed;
          if (failed) errorMessage.textContent = status.message;

          if (working) splashArt.working(status.step, status.total);
          else if (failed) splashArt.fail();
          else splashArt.ready();
        }

        function finish() {
          invoke("finish_boot").catch(function (err) {
            console.error(String(err));
          });
        }

        // Guards the handoff so it is only ever armed once, however status
        // first reaches `ready` — via the live listener, via the poll, or
        // both racing each other.
        var handoffArmed = false;

        function armReadyHandoff() {
          if (handoffArmed) return;
          handoffArmed = true;
          // Hold until MIN_VISIBLE_MS has elapsed, but not a moment longer:
          // if boot was already slow enough to clear it, this fires now.
          var remaining = Math.max(0, MIN_VISIBLE_MS - (performance.now() - startedAt));
          window.setTimeout(finish, remaining);
        }

        // Separate from `handoffArmed`: that one guards `finish` itself, this
        // guards *entering* the finalizing hold. `armReadyHandoff` sets its
        // guard only once the hold is over, so sharing a flag would let a
        // second `ready` start a second hold on top of the first.
        var finalizeStarted = false;

        // The one state transition `render` cannot make on its own: boot.rs
        // never reports it, so it is driven from here.
        function handleReady() {
          if (finalizeStarted) return;
          finalizeStarted = true;

          bar.setAttribute("aria-valuenow", String(FINALIZE_PROGRESS));
          step.textContent = "Finalizing";
          sub.textContent = "Almost ready";
          splashArt.finalizing();

          window.setTimeout(function () {
            render({ phase: "ready" });
            armReadyHandoff();
          }, FINALIZE_HOLD_MS);
        }

        // `failed` is deliberately never auto-finished: the user should get a
        // chance to read why before being dropped into the main window, so it
        // waits on this button instead.
        continueButton.addEventListener("click", finish);

        /*
         * Tauri events are not replayed: if boot reports `Ready` before the
         * listener below is registered, that event is simply gone. Polling
         * `boot_status` closes that gap, but its response can also land
         * *after* a live event has already moved things forward, and
         * applying it then would overwrite newer data with older. Status
         * only ever moves forward (working, then exactly one of
         * ready/failed), so "has a live event arrived at all" is enough to
         * tell stale from current.
         */
        var liveEventReceived = false;

        // The poll is chained off `listen`'s promise rather than fired
        // alongside it: `listen` resolves only once the listener is
        // registered on the Rust side, and polling earlier would leave a
        // window in which an event could fire and be missed by both paths.
        listen("boot:status", function (event) {
          liveEventReceived = true;
          // `ready` goes through `handleReady`'s finalizing hold instead of
          // straight to `render`.
          if (event.payload.phase === "ready") return handleReady();
          render(event.payload);
        })
          .then(function () {
            return invoke("boot_status");
          })
          .then(function (polled) {
            if (liveEventReceived) return;
            // Boot may have finished before this window even loaded. Routing
            // through `handleReady` here too is what stops that case sitting
            // untouched until the watchdog in boot.rs forces the handoff.
            if (polled.phase === "ready") return handleReady();
            render(polled);
          })
          .catch(function (err) {
            console.error(String(err));
          });
      })();
    </script>
  </body>
</html>
