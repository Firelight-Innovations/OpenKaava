<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaava splash concept: Field lines, live</title>
    <style>
      /* Tokens copied from src/tokens.css (dark and light, five accents). */
      :root {
        --bg-canvas: #0f0f10;
        --bg-surface-1: #141415;
        --bg-layer-1: #181a1b;
        --bg-layer-2: #1d1f20;
        --border-subtle: #222425;
        --border-subtle-1: #2c2e30;
        --border-strong: #36393a;
        --txt-primary: #e4e6e6;
        --txt-secondary: #cacdce;
        --txt-tertiary: #afb3b6;
        --txt-disabled: #7a8185;
        --danger: #e5534b;
        --accent-amber: #d98a3f;
        --accent-blue: #4d9be6;
        --accent-green: #4cb863;
        --accent-violet: #a585f0;
        --accent-coral: #e5736b;
        --accent: var(--txt-primary);
        --sans: Inter, system-ui, "Segoe UI", sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
        color-scheme: dark;
      }
      :root[data-theme="light"] {
        --bg-canvas: #f2f2f3;
        --bg-surface-1: #ffffff;
        --bg-layer-1: #f9f9f9;
        --bg-layer-2: #ffffff;
        --border-subtle: #eaebec;
        --border-subtle-1: #e1e2e3;
        --border-strong: #d5d7d9;
        --txt-primary: #0f0f10;
        --txt-secondary: #313435;
        --txt-tertiary: #494d50;
        --txt-disabled: #767c7f;
        --danger: #bf2c22;
        --accent-amber: #a85a14;
        --accent-blue: #1f63b5;
        --accent-green: #23803b;
        --accent-violet: #6c47c9;
        --accent-coral: #b8392f;
        color-scheme: light;
      }
      :root[data-accent="amber"] { --accent: var(--accent-amber); }
      :root[data-accent="blue"] { --accent: var(--accent-blue); }
      :root[data-accent="green"] { --accent: var(--accent-green); }
      :root[data-accent="violet"] { --accent: var(--accent-violet); }
      :root[data-accent="coral"] { --accent: var(--accent-coral); }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--bg-canvas);
        color: var(--txt-secondary);
        font: 13px var(--sans);
      }
      h1 { margin: 0; font-size: 13px; font-weight: 600; color: var(--txt-primary); }
      .note { max-width: 560px; margin: 0; text-align: center; font-size: 12px; color: var(--txt-tertiary); line-height: 1.45; }
      .stage {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 560px;
        height: 360px;
        overflow: hidden;
        background: var(--bg-surface-1);
        border: 1px solid var(--border-subtle-1);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }
      .field { position: relative; flex: 1; min-height: 0; background: var(--bg-surface-1); }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .wordmark {
        position: absolute; left: 20px; bottom: 16px; margin: 0;
        font: 600 20px var(--sans); letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--txt-primary);
      }
      .bar { position: relative; flex: none; height: 40px; background: var(--bg-surface-1); border-top: 1px solid var(--border-subtle); }
      .track { position: absolute; top: -1px; left: 0; right: 0; height: 2px; background: var(--border-subtle); }
      .fill { height: 100%; width: 0; background: var(--accent); }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 100%; padding: 0 16px; }
      .label { font-size: 12px; font-weight: 500; color: var(--txt-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .step { font: 500 11px var(--mono); color: var(--txt-tertiary); }
      .failed .fill { background: var(--danger); }
      .controls { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 560px; }
      button {
        height: 26px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 6px;
        background: var(--bg-layer-1); color: var(--txt-secondary); font: 500 12px var(--sans); cursor: pointer;
      }
      button[aria-pressed="true"] { border-color: var(--accent); color: var(--txt-primary); }
      @media (prefers-reduced-motion: reduce) { .stage { box-shadow: none; } }
    </style>
  </head>
  <body>
    <h1>Field lines, live</h1>
    <div class="stage" id="stage">
      <div class="field"><canvas id="c"></canvas><p class="wordmark" id="wm">OpenKaava</p></div>
      <div class="bar">
        <div class="track"><div class="fill" id="fill"></div></div>
        <div class="row"><span class="label" id="label">Starting…</span><span class="step" id="step"></span></div>
      </div>
    </div>
    <div class="controls" id="theme"></div>
    <div class="controls" id="accent"></div>
    <div class="controls" id="actions"></div>
    <p class="note">Concept: the current field-line motif, computed live. Each boot step charges a node and the lines bend. Simulated boot.</p>

    <script>
      "use strict";
      /*
       * The shared harness. `K` stands in for boot.rs: five steps arrive on a
       * fixed schedule with the real labels' shape, then a "Finalizing" hold,
       * then ready. A concept only reads `K` and draws; it never owns timing.
       *   K.t         seconds since the run began
       *   K.step      1-based step in flight (0 before the first), K.total
       *   K.p         progress 0..1, eased toward step/total
       *   K.phase     "working" | "finalizing" | "ready" | "failed"
       *   K.ready     0..1, eased once ready (for the exit beat)
       *   K.age(i)    seconds since step i began, or -1 if it has not
       *   K.pal()     resolved colours for the canvas
       */
      var K = {
        total: 5,
        labels: ["Reading project manifest", "Restoring clusters", "Starting terminals",
                 "Starting File Explorer and File Viewer", "Attaching environments"],
        starts: [0.35, 1.25, 2.1, 3.15, 4.0],
        readyAt: 4.9,
        t: 0, step: 0, p: 0, ready: 0, phase: "working", failAt: -1, wordmark: true,
        age: function (i) { return this.t >= this.starts[i - 1] ? this.t - this.starts[i - 1] : -1; },
        pal: function () {
          var cs = getComputedStyle(document.documentElement), g = function (n) { return cs.getPropertyValue(n).trim(); };
          return { ground: g("--bg-surface-1"), canvas: g("--bg-canvas"), layer: g("--bg-layer-1"), layer2: g("--bg-layer-2"),
                   line: g("--border-subtle"), line2: g("--border-subtle-1"), line3: g("--border-strong"),
                   txt: g("--txt-primary"), txt2: g("--txt-secondary"), txt3: g("--txt-tertiary"),
                   dim: g("--txt-disabled"), accent: g("--accent"), danger: g("--danger"),
                   light: document.documentElement.dataset.theme === "light" };
        },
      };
      var els = { fill: document.getElementById("fill"), label: document.getElementById("label"),
                  step: document.getElementById("step"), stage: document.getElementById("stage"),
                  wm: document.getElementById("wm") };
      var canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
      var qs = new URLSearchParams(location.search);
      var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      var W = 0, H = 0;

      function resize() {
        var r = canvas.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);
        W = r.width; H = r.height;
        canvas.width = Math.round(W * d); canvas.height = Math.round(H * d);
        ctx.setTransform(d, 0, 0, d, 0, 0);
        if (K.onResize) K.onResize(W, H);
        if (freeze && K.draw) K.draw(ctx, W, H, K.pal());
      }

      function advance(dt) {
        K.t += dt;
        var s = 0;
        for (var i = 0; i < K.total; i++) if (K.t >= K.starts[i]) s = i + 1;
        if (K.phase === "working" || K.phase === "finalizing") K.step = s;
        if (K.failAt >= 0 && K.t >= K.failAt && K.phase !== "failed") K.phase = "failed";
        if (K.phase === "working" && K.t >= K.readyAt) K.phase = "finalizing";
        var target = K.phase === "working" ? K.step / K.total : K.phase === "finalizing" ? 0.95 : K.phase === "ready" ? 1 : K.p;
        if (K.phase === "finalizing" && K.t >= K.readyAt + 0.45) K.phase = "ready";
        K.p += (target - K.p) * Math.min(1, dt * 9);
        if (K.phase === "ready") K.ready = Math.min(1, K.ready + dt / 0.8);
        if (K.t > K.readyAt + 4.2 && !freeze) reset();
      }

      function chrome() {
        els.fill.style.width = (K.p * 100).toFixed(2) + "%";
        els.stage.classList.toggle("failed", K.phase === "failed");
        els.label.textContent = K.phase === "working" ? (K.step ? K.labels[K.step - 1] : "Starting…")
          : K.phase === "finalizing" ? "Finalizing" : K.phase === "ready" ? "Ready" : "Startup failed";
        els.step.textContent = K.phase === "working" && K.step ? K.step + " / " + K.total : "";
        els.wm.style.display = K.wordmark ? "" : "none";
      }

      function reset() { K.t = 0; K.step = 0; K.p = 0; K.ready = 0; K.phase = "working"; K.failAt = -1; if (K.onReset) K.onReset(); }

      var freeze = qs.has("freeze") ? parseFloat(qs.get("freeze")) : 0;
      var last = 0;
      function frame(now) {
        var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016; last = now;
        if (reduce) { K.t = K.readyAt; K.step = K.total; K.phase = "finalizing"; K.p = 0.95; }
        else advance(dt);
        chrome(); K.draw(ctx, W, H, K.pal());
        requestAnimationFrame(frame);
      }

      function chip(host, items, current, onPick) {
        items.forEach(function (it, i) {
          var b = document.createElement("button"); b.textContent = it[0];
          b.setAttribute("aria-pressed", String(i === current));
          b.addEventListener("click", function () {
            [].forEach.call(host.children, function (c, j) { c.setAttribute("aria-pressed", String(j === i)); });
            onPick(it[1]);
          });
          host.appendChild(b);
        });
      }
      var root = document.documentElement;
      root.dataset.theme = qs.get("theme") === "light" ? "light" : "dark";
      if (qs.get("accent") !== "none") root.dataset.accent = qs.get("accent") || "blue";
      chip(document.getElementById("theme"), [["Dark", "dark"], ["Light", "light"]], root.dataset.theme === "light" ? 1 : 0,
           function (v) { root.dataset.theme = v; });
      var accents = ["neutral", "amber", "blue", "green", "violet", "coral"];
      chip(document.getElementById("accent"), accents.map(function (a) { return [a[0].toUpperCase() + a.slice(1), a]; }),
           accents.indexOf(root.dataset.accent || "neutral"),
           function (v) { if (v === "neutral") delete root.dataset.accent; else root.dataset.accent = v; });
      chip(document.getElementById("actions"), [["Replay", "r"], ["Fail at step 3", "f"]], -1,
           function (v) { reset(); if (v === "f") K.failAt = K.starts[2] + 0.6; });

      window.addEventListener("resize", resize);
    </script>
    <script>
/*
 * Field lines, live. The current splash art is a frozen render of lines running
 * between seven nodes. Here the same idea is computed: each boot step charges
 * a node, and lines are traced through the field of every node that is
 * awake, so the pattern bends as the system comes up and settles when it is
 * ready. Positive nodes are the accent, negative nodes are neutral, and the
 * lines take the colour of the node they leave.
 */
(function () {
  K.wordmark = true;
  var NODES = [
    { x: 0.16, y: 0.34, q: 1, step: 1 }, { x: 0.36, y: 0.72, q: -1, step: 2 }, { x: 0.5, y: 0.3, q: 1, step: 3 },
    { x: 0.66, y: 0.66, q: -1, step: 4 }, { x: 0.82, y: 0.32, q: 1, step: 5 }, { x: 0.3, y: 0.2, q: -0.6, step: 2 },
    { x: 0.9, y: 0.78, q: -0.8, step: 5 },
  ];
  var LINES = 16, STEPS = 110, H = 3.2;
  var nodes = [];

  function ease(u) { u = Math.max(0, Math.min(1, u)); return 1 - Math.pow(1 - u, 3); }

  K.onResize = function (w, h) { nodes = NODES.map(function (n) { return { x: n.x * w, y: n.y * h, q: n.q, step: n.step, ox: n.x * w, oy: n.y * h, ph: n.x * 9 + n.y * 5 }; }); };

  function field(px, py, out) {
    var fx = 0, fy = 0;
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i]; if (n.charge <= 0.001) continue;
      var dx = px - n.x, dy = py - n.y, d2 = dx * dx + dy * dy + 30, inv = n.q * n.charge / (d2 * Math.sqrt(d2));
      fx += dx * inv; fy += dy * inv;
    }
    out[0] = fx; out[1] = fy;
  }

  K.draw = function (c, w, h, P) {
    c.clearRect(0, 0, w, h);
    c.lineCap = "round"; c.lineJoin = "round";
    var failed = K.phase === "failed", accent = failed ? P.danger : P.accent;
    var neutral = P.light ? P.line3 : P.line3;
    var drift = K.phase === "ready" ? 0.4 : 1, f = [0, 0], breath = 1 + 0.06 * Math.sin(K.t * 1.4);

    nodes.forEach(function (n) {
      n.x = n.ox + Math.sin(K.t * 0.35 * drift + n.ph) * 7; n.y = n.oy + Math.cos(K.t * 0.29 * drift + n.ph * 1.3) * 5;
      var age = K.age(n.step); n.charge = age < 0 ? 0 : ease(age * 0.9);
      if (failed && n.step >= 3) n.charge = 0;
    });

    // reveal: lines grow outward from their node for about a second after it wakes
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i]; if (n.q <= 0 || n.charge <= 0.01) continue;
      var reveal = ease(K.age(n.step) * 0.7);
      for (var l = 0; l < LINES; l++) {
        var ang = (l / LINES) * 6.283 + 0.2 + i, x = n.x + Math.cos(ang) * 4, y = n.y + Math.sin(ang) * 4;
        var pts = [[x, y]], maxN = Math.floor(STEPS * reveal);
        for (var s = 0; s < maxN; s++) {
          field(x, y, f); var m = Math.hypot(f[0], f[1]); if (m < 1e-9) break;
          x += (f[0] / m) * H; y += (f[1] / m) * H; pts.push([x, y]);
          if (x < -10 || x > w + 10 || y < -10 || y > h + 10) break;
          var hit = false;
          for (var j = 0; j < nodes.length; j++) if (nodes[j].q < 0 && nodes[j].charge > 0.01 && Math.hypot(x - nodes[j].x, y - nodes[j].y) < 5) { hit = true; break; }
          if (hit) break;
        }
        c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
        for (var k = 1; k < pts.length; k++) c.lineTo(pts[k][0], pts[k][1]);
        c.strokeStyle = accent; c.globalAlpha = (0.3 + (l % 3) * 0.07) * n.charge; c.lineWidth = 1; c.stroke();
      }
    }
    c.globalAlpha = 1;

    // nodes
    nodes.forEach(function (n, i) {
      if (n.charge <= 0.01) { c.strokeStyle = P.line2; c.lineWidth = 1; c.beginPath(); c.arc(n.x, n.y, 3, 0, 6.283); c.stroke(); return; }
      var r = (n.q > 0 ? 4 : 3) * (n.q > 0 ? breath : 1);
      c.fillStyle = n.q > 0 ? accent : neutral; c.globalAlpha = 0.14 * n.charge;
      c.beginPath(); c.arc(n.x, n.y, r * 3.2, 0, 6.283); c.fill();
      c.globalAlpha = n.charge; c.beginPath(); c.arc(n.x, n.y, r, 0, 6.283); c.fill();
      c.globalAlpha = 1;
    });

    // ready: one ring leaves each positive node, then everything is still
    if (K.phase === "ready") nodes.forEach(function (n) {
      if (n.q <= 0) return; var u = K.ready; c.strokeStyle = accent; c.globalAlpha = 0.5 * (1 - u); c.lineWidth = 1;
      c.beginPath(); c.arc(n.x, n.y, 6 + u * 46, 0, 6.283); c.stroke(); c.globalAlpha = 1;
    });
  };
})();

    </script>
    <script>
      resize();
      if (K.onReset) K.onReset();
      if (freeze) {
        for (var s = 0; s < freeze * 60; s++) advance(1 / 60);
        chrome(); K.draw(ctx, W, H, K.pal());
      } else requestAnimationFrame(frame);
    </script>
  </body>
</html>
