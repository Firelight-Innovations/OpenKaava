    <title>OpenKaava</title>
    <!--
      This file is deliberately standalone: no imports, no build step, no
      shared modules, no coupling of any kind to the rest of the application.
      The first window of the app has to paint without waiting on the bundle
      it is covering for, so everything it needs is inlined here:
        - the styles, with the token values copied literally out of
          src/tokens.css under the same names (src/splash/splash.test.ts fails
          `pnpm test` if any of them drifts)
        - the art, drawn on one canvas by the `splash-art` script below
          (Halftone; it needs no image, so there is no request for one)
        - the typefaces, as base64 woff2 subsets (see @font-face)
        - the boot logic, as a plain non-module <script> at the bottom

      The product name and the wordmark are written out here, and
      `scripts/check-branding.mjs` fails `pnpm lint` if either stops agreeing
      with branding.toml. Checking rather than generating is what keeps this
      file something you can open and read.
    -->
    <!--
      Theme and accent, read before first paint. The shell mirrors the two
      appearance settings into localStorage (src/shell/settings/
      splashAppearance.ts) and this window shares that origin, so a stored
      value is available synchronously with no IPC round-trip. Nothing stored
      (a first launch) leaves the neutral palette in the CSS below. The test
      in src/splash/splash.test.ts runs this script, so the key and the value
      shape are checked against the writer.
    -->
    <script id="splash-appearance">
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem("kaava.splash-appearance"));
          var root = document.documentElement;
          var theme = stored.theme;
          if (theme === "system") {
            theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          if (theme === "light") root.dataset.theme = "light";
          if (/^(amber|blue|green|violet|coral)$/.test(stored.accent)) {
            root.dataset.accent = stored.accent;
          }
        } catch (err) {
          /* unset or unreadable: the neutral defaults stand */
        }
      })();
    </script>
    <!-- CONCEPT ONLY: stripped when this ships. Paste verbatim into <head>, directly after
         <script id="splash-appearance">, before any other script. -->
    <script id="concept-demo">
      (function () {
        window.__conceptErrors = [];
        window.addEventListener("error", function (e) {
          window.__conceptErrors.push(String(e.message) + " @" + e.lineno);
        });
        if (window.__TAURI__) return;
        var q = new URLSearchParams(location.search);
        var demo = q.get("demo");
        if (!demo) return;
        var root = document.documentElement;
        if (q.get("theme") === "light") root.dataset.theme = "light";
        if (q.get("accent")) root.dataset.accent = q.get("accent");
        var total = +(q.get("total") || 5);
        var stop = +(q.get("step") || 2);
        var labels = [
          "Locating manifest",
          "Reading manifest",
          "Scanning checkouts",
          "Starting Home and Files",
          "Starting Files",
        ];
        var events = [];
        var t = 300;
        var last = demo === "working" || demo === "failed" ? stop : total;
        for (var s = 1; s <= last; s++) {
          events.push([t, { phase: "working", step: s, total: total, label: labels[(s - 1) % labels.length] }]);
          t += 700;
        }
        if (demo === "ready" || demo === "cycle") events.push([t, { phase: "ready" }]);
        if (demo === "failed") {
          events.push([
            t,
            {
              phase: "failed",
              message: "Could not read C:\\Users\\dev\\projects\\saas\\kaava.toml: expected `=` at line 12",
            },
          ]);
        }
        window.__TAURI__ = {
          app: {
            getVersion: function () {
              return Promise.resolve("0.6.1");
            },
          },
          core: {
            invoke: function (cmd) {
              return Promise.resolve(
                cmd === "boot_status" ? { phase: "working", step: 0, total: total, label: "Starting…" } : null,
              );
            },
          },
          event: {
            listen: function (name, fn) {
              events.forEach(function (e) {
                setTimeout(function () {
                  fn({ payload: e[1] });
                }, e[0]);
              });
              return Promise.resolve(function () {});
            },
          },
        };
      })();
    </script>
    <style>
      /*
       * Four faces, each subset so it can be inlined (a linked font resolves
       * after first paint, and the text would reflow into it). Regenerate with
       * `pyftsubset <fontsource woff2> --unicodes=<range> --flavor=woff2`:
       *
       *   Inter 600          U+2122, U+0041-005A, U+0061-007A  the wordmark and the ™ after Veistra, 5kB
       *   Inter 500          U+0020-007E, U+00A9, U+00B7, U+2026, U+2122  the company name, status line and button, 12kB
       *   Inter 400          U+0020-007E, U+00A9, U+00B7, U+2122  the legal line and the version, 12kB
       *   IBM Plex Mono 500  U+0020-007E, U+00A9, U+00B7, U+2014, U+2122  the step label and error text, 9kB

       * The status line and error text are arbitrary strings (labels from
       * boot.rs, error messages with file paths), so the ranges cover printable

      /*
       * Tokens, copied from src/tokens.css under the same names. Only the ones
       * this file reads are here; src/splash/splash.test.ts fails if any of
       * them drifts from tokens.css, so a stale copy is caught by `pnpm test`
       * rather than noticed on a launch.
       */
      :root {
        color-scheme: dark;

        --bg-canvas: #0f0f10;
        --bg-surface-1: #141415;
        --bg-layer-1: #181a1b;
        --border-subtle: #222425;
        --border-subtle-1: #2c2e30;
        --border-strong: #36393a;
        --border-strong-1: #45484a;

        --txt-primary: #e4e6e6;
        --txt-secondary: #cacdce;
        --txt-tertiary: #afb3b6;
        --txt-danger: #f4a49c;
        --danger: #e5534b;

        --accent-amber: #d98a3f;
        --accent-blue: #3f76ff;
        --accent-green: #4cb863;
        --accent-violet: #a585f0;
        --accent-coral: #e5736b;

        --sans: Inter, "Inter Variable", system-ui, "Segoe UI", sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

        --radius-md: 6px;
        --radius-xl: 12px;
        --shadow-overlay: 0 12px 32px -6px rgba(0, 0, 0, 0.6), 0 2px 6px rgba(0, 0, 0, 0.3);
        --control-md: 28px;
        --focus-ring: 2px solid color-mix(in srgb, var(--accent) 45%, transparent);
        --focus-ring-offset: 2px;

        /* Not a token: what the accent means for the splash's own parts.
           Neutral until the head script has found a stored accent, so a first
           launch is never drawn in a colour the user did not pick. */
        --accent: var(--txt-primary);
      }

      :root[data-theme="light"] {
        color-scheme: light;

        --bg-canvas: #f2f2f3;
        --bg-surface-1: #ffffff;
        --bg-layer-1: #f9f9f9;
        --border-subtle: #eaebec;
        --border-subtle-1: #e1e2e3;
        --border-strong: #d5d7d9;
        --border-strong-1: #cacdcf;

        --txt-primary: #0f0f10;
        --txt-secondary: #313435;
        --txt-tertiary: #494d50;
        --txt-danger: #9c231b;
        --danger: #bf2c22;

        --accent-amber: #a85a14;
        --accent-blue: #2f62e0;
        --accent-green: #23803b;
        --accent-violet: #6c47c9;
        --accent-coral: #b8392f;
      }

      /* The accent. Neutral (the text colour) until the head script finds a
         stored one. The mosaic, the small mark and the progress thumb all read it. */
      :root[data-accent="amber"] {
        --accent: var(--accent-amber);
      }
      :root[data-accent="blue"] {
        --accent: var(--accent-blue);
      }
      :root[data-accent="green"] {
        --accent: var(--accent-green);
      }
      :root[data-accent="violet"] {
        --accent: var(--accent-violet);
      }
      :root[data-accent="coral"] {
        --accent: var(--accent-coral);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      /* Transparent, not a colour: the window is transparent too, so the
         desktop shows through everywhere except the card below. Any fill
         here would be the square backing the rounded card is meant to
         remove. */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      /* The window is 72px larger than the card in each direction, and this
         padding is that gutter: room for the shadow to fall on transparent
         pixels instead of being clipped at the window edge. */
      body {
        padding: 36px;
      }

      /* The window is transparent and undecorated (see tauri.conf.json), so
         this card IS the visible window: the app window's radius, the
         hairline border and the overlay shadow are drawn here, anti-aliased
         by the compositor. The clip on `overflow` rounds the canvas. */
      .splash {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg-surface-1);
        border: 1px solid var(--border-subtle-1);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-overlay);
        color: var(--txt-primary);
        font-family: var(--sans);
      }

      /* The composition is a 6px lattice with a 30px frame: the type sits on
         its columns and rows, and the mosaic tiles are drawn on the same
         lattice, so the strip under the step label and the mark are one grid. */
      .splash__content {
        position: absolute;
        inset: 0;
      }

      .splash__art {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* Mark, wordmark, hairline, company: one row, top left. */
      .splash__lockup {
        position: absolute;
        left: 30px;
        top: 30px;
        height: 28px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* The path only fills the middle 14 x 19.2 of its 24 x 24 box, so the box
         is pulled in by the empty margin: the mark's own edge sits on the 30px
         line, and the gap to the wordmark is the 10px it looks like. */
      .splash__logo {
        display: block;
        flex: none;
        width: 28px;
        height: 28px;
        margin: 0 -5.8px;
        color: var(--accent);
      }

      .splash__logo svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* Baseline-aligned, so the company name sits on the wordmark's line and not
         at its middle; the hairline is the wordmark's cap height, bottom on the
         baseline. */
      .splash__names {
        display: flex;
        align-items: baseline;
        gap: 14px;
      }

      .splash__wordmark {
        margin: 0;
        font-family: var(--sans);
        font-size: 22px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.01em;
        color: var(--txt-primary);
      }

      .splash__rule {
        flex: none;
        width: 1px;
        height: 16px;
        background: var(--border-strong-1);
      }

      .splash__company {
        margin: 0;
        font-family: var(--sans);
        font-size: 14px;
        font-weight: 500;
        line-height: 1;
        letter-spacing: 0.01em;
        color: var(--txt-secondary);
      }

      /* Empty until the app reports its version; the slot is reserved so the
         line arriving moves nothing. */
      .splash__version {
        position: absolute;
        left: 30px;
        top: 68px;
        min-height: 14px;
        margin: 0;
        font-family: var(--sans);
        font-size: 11px;
        font-weight: 400;
        line-height: 14px;
        color: var(--txt-tertiary);
      }

      /* The progress bar: the step label, and the empty track the art draws its
         tile strip into. 246 and 270 are rows 41 and 45 of the lattice. */
      .splash__footer {
        position: absolute;
        left: 30px;
        top: 246px;
        width: 252px;
      }

      .splash__footer::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: -14px;
        height: 1px;
        background: var(--border-subtle-1);
      }

      .splash__step {
        height: 14px;
        margin: 0;
        overflow: hidden;
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        line-height: 14px;
        text-align: left;
        text-overflow: ellipsis;
        text-transform: lowercase;
        white-space: nowrap;
        color: var(--txt-tertiary);
      }

      .splash[data-phase="failed"] .splash__step {
        color: var(--txt-danger);
      }

      .splash__track {
        display: block;
        height: 18px;
        margin-top: 10px;
      }

      /* Quiet, but not below 4.5:1: --txt-tertiary is 8.7:1 on the dark card
         and on the light one. Two lines because one would run under the mark. */
      .splash__legal {
        position: absolute;
        left: 30px;
        bottom: 28px;
        margin: 0;
        font-family: var(--sans);
        font-size: 11px;
        font-weight: 400;
        line-height: 15px;
        color: var(--txt-tertiary);
      }

      .splash__legal span {
        display: block;
      }

      /* Over the art but left-aligned on the same 30px line as the type, and
         clear of the lockup above and the progress below. */
      .splash__error {
        position: absolute;
        left: 30px;
        top: 90px;
        width: 304px;
      }

      /* A panel rather than bare text: the message has to stay legible over
         the art. */
      .splash__error-panel {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        padding: 16px 18px 18px;
        border: 1px solid var(--border-subtle-1);
        border-radius: var(--radius-xl);
        background: color-mix(in srgb, var(--bg-surface-1) 92%, transparent);
        box-shadow: var(--shadow-overlay);
      }

      .splash__error-message {
        max-height: 128px;
        margin: 0;
        overflow-y: auto;
        overflow-wrap: anywhere;
        font-family: var(--mono);
        font-size: 11.5px;
        line-height: 1.5;
        color: var(--txt-danger);
      }

      /* The design system's secondary button: layer fill, strong border. */
      .splash__continue {
        height: var(--control-md);
        padding: 0 12px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-md);
        background: var(--bg-layer-1);
        color: var(--txt-primary);
        font-family: var(--sans);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }

      .splash__continue:hover {
        border-color: var(--border-strong-1);
      }

      .splash__continue:focus-visible {
        outline: var(--focus-ring);
        outline-offset: var(--focus-ring-offset);
      }
    </style>
  </head>
  <body>
    <div class="splash" data-phase="working">
      <div class="splash__content">
        <canvas class="splash__art" aria-hidden="true"></canvas>

        <div class="splash__error" hidden>
          <div class="splash__error-panel">
            <p class="splash__error-message"></p>
            <button type="button" class="splash__continue">Continue anyway</button>
          </div>
        </div>
      </div>

      <div class="splash__lockup">
        <i class="splash__logo" id="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path
              fill="currentColor"
              d="M12 2.4c3.3 0 7 4.2 7 10.1 0 4.8-3.1 9.1-7 9.1s-7-4.3-7-9.1C5 6.6 8.7 2.4 12 2.4zm0 8.4a2.9 2.9 0 1 0 0 5.8 2.9 2.9 0 0 0 0-5.8z"
            />
          </svg>
        </i>
        <span class="splash__names">
          <p class="splash__wordmark">OpenKaava</p>
          <span class="splash__rule" aria-hidden="true"></span>
          <p class="splash__company">Veistra™</p>
        </span>
      </div>

      <p class="splash__version" aria-label="Version"></p>

      <div
        class="splash__footer"
        role="progressbar"
        aria-label="Startup"
        aria-valuemin="0"
        aria-valuemax="1"
        aria-valuenow="0"
      >
        <p class="splash__step">starting</p>
        <span class="splash__track" aria-hidden="true"></span>
      </div>

      <p class="splash__legal">
        <span>© 2026 Firelight Innovations.</span> <span>All rights reserved.</span>
      </p>
    </div>

    <script id="splash-art">
      /*
       * Halftone. The mark is drawn large in tiles on a 6px lattice (3px tiles,
       * the proportions of the effort slider this is modelled on), in a field
       * that thins toward the type. Every tile has a threshold from a blue-noise
       * texture, and a tile is on while that threshold is below the progress
       * the art has displayed, so the mark does not slide in: it comes up as an
       * ordered dither, stippled first and then dense, the lit upper left a
       * little ahead of the shaded lower right. The three tones of the colour
       * mark are carried by brightness and density instead of by hue, so the
       * mosaic is only ever the accent (or, with none chosen, the text colour).
       *
       * Ready runs one soft light pass across the finished mark and stops.
       * Failure freezes where it was: the tiles that never arrived show as dim
       * danger-coloured slots. Under reduced motion each state is drawn once.
       *
       * Nothing here talks to Tauri. The boot script calls the four methods on
       * `splashArt` and this file owns the time, so a status that arrives late
       * or all at once still plays out as a sequence: progress is chased at a
       * limited speed rather than jumped to.
       */
      var splashArt = (function () {
        "use strict";

        var canvas = document.querySelector(".splash__art");
        var track = document.querySelector(".splash__track");
        var ctx = canvas && canvas.getContext ? canvas.getContext("2d") : null;
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        var PITCH = 6; // css px between tile origins
        var TILE = 3; // css px, the tile itself
        var LEVELS = 24; // brightness steps in a ramp; step 0 is the card, so it is never drawn
        var KNEE = 0.8; // the step at which a ramp reaches the accent; above it, toward the ink
        var BN = 32; // blue-noise texture is BN x BN and tiles across the lattice
        var FRAME = 30; // css px of margin the composition keeps from the card edge
        var FIELD_X = 292; // the field of loose tiles starts here, clear of the type column
        var LEAD = 0.3; // how far the lit side of the mark runs ahead of the shaded side
        var POP = 0.3; // seconds a tile takes to settle once it has landed
        var SWEEP_SECONDS = 1.5;
        var FAIL_SECONDS = 0.8;

        function c01(x) {
          return x < 0 ? 0 : x > 1 ? 1 : x;
        }
        function smooth(x) {
          x = c01(x);
          return x * x * (3 - 2 * x);
        }
        function mulberry(a) {
          return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        function hash(x, y, s) {
          var h = Math.imul(x + 1013, 0x27d4eb2d) ^ Math.imul(y + 7919, 0x165667b1) ^ Math.imul(s + 1, 0x9e3779b1);
          h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
          h ^= h >>> 13;
          h = Math.imul(h, 0xc2b2ae35);
          h ^= h >>> 16;
          return (h >>> 0) / 4294967296;
        }

        /* ---- blue noise: void-and-cluster, so thresholds never clump ---- */
        // A fixed seed, on purpose: the mark is the brand, and it should be the same
        // stippling on every launch rather than a different one each time.
        function blueNoise() {
          var n = BN * BN;
          var rnd = mulberry(0x6b61);
          var bits = new Uint8Array(n);
          var e = new Float32Array(n);
          var rank = new Float32Array(n);
          var R = 4;
          var K = [];
          var dx;
          var dy;
          var i;
          var c;
          var v;
          for (dy = -R; dy <= R; dy++) {
            for (dx = -R; dx <= R; dx++) K.push(Math.exp(-(dx * dx + dy * dy) / 4.5));
          }
          function splat(at, s) {
            var x = at % BN;
            var y = (at / BN) | 0;
            var q = 0;
            for (var oy = -R; oy <= R; oy++) {
              var row = ((y + oy + BN) % BN) * BN;
              for (var ox = -R; ox <= R; ox++) e[row + ((x + ox + BN) % BN)] += s * K[q++];
            }
          }
          // The one with the most neighbours (tightest cluster) or the zero with the fewest (largest void).
          function pick(one) {
            var best = 0;
            var bv = one ? -Infinity : Infinity;
            for (var j = 0; j < n; j++) {
              if ((bits[j] === 1) !== one) continue;
              if (one ? e[j] > bv : e[j] < bv) {
                bv = e[j];
                best = j;
              }
            }
            return best;
          }
          var n0 = Math.round(n * 0.1);
          for (i = 0; i < n0; ) {
            c = Math.floor(rnd() * n);
            if (!bits[c]) {
              bits[c] = 1;
              splat(c, 1);
              i++;
            }
          }
          for (i = 0; i < 400; i++) {
            c = pick(true);
            bits[c] = 0;
            splat(c, -1);
            v = pick(false);
            bits[v] = 1;
            splat(v, 1);
            if (v === c) break;
          }
          var proto = bits.slice();
          for (i = n0 - 1; i >= 0; i--) {
            c = pick(true);
            rank[c] = i;
            bits[c] = 0;
            splat(c, -1);
          }
          e.fill(0);
          for (i = 0; i < n; i++) {
            bits[i] = proto[i];
            if (proto[i]) splat(i, 1);
          }
          for (i = n0; i < n; i++) {
            v = pick(false);
            rank[v] = i;
            bits[v] = 1;
            splat(v, 1);
          }
          for (i = 0; i < n; i++) rank[i] = (rank[i] + 0.5) / n;
          return rank;
        }

        /* ---- the mark, as the colour asset draws it (24 x 24 box) ---- */
        // Each outline is two cubic segments, right half only (the mark is symmetric
        // about x = 12). Flattened to half-widths by y, so "is this point inside" is a lookup.
        function profile(segs, y0, y1) {
          var pts = [];
          segs.forEach(function (s) {
            for (var k = 0; k <= 48; k++) {
              var t = k / 48;
              var u = 1 - t;
              var a = u * u * u;
              var b = 3 * u * u * t;
              var c = 3 * u * t * t;
              var d = t * t * t;
              pts.push([a * s[0][1] + b * s[1][1] + c * s[2][1] + d * s[3][1], a * s[0][0] + b * s[1][0] + c * s[2][0] + d * s[3][0]]);
            }
          });
          var N = 256;
          var lut = new Float32Array(N + 1);
          var j = 0;
          for (var m = 0; m <= N; m++) {
            var y = y0 + ((y1 - y0) * m) / N;
            while (j < pts.length - 2 && pts[j + 1][0] < y) j++;
            var p0 = pts[j];
            var p1 = pts[j + 1];
            var f = p1[0] === p0[0] ? 0 : c01((y - p0[0]) / (p1[0] - p0[0]));
            lut[m] = p0[1] + (p1[1] - p0[1]) * f - 12;
          }
          return { y0: y0, y1: y1, N: N, lut: lut };
        }
        function halfAt(pr, y) {
          if (y < pr.y0 || y > pr.y1) return -1;
          var f = ((y - pr.y0) / (pr.y1 - pr.y0)) * pr.N;
          var k = Math.min(pr.N - 1, f | 0);
          return pr.lut[k] + (pr.lut[k + 1] - pr.lut[k]) * (f - k);
        }
        var OUTER = profile(
          [
            [[12, 2.4], [15.3, 2.4], [19, 6.6], [19, 12.5]],
            [[19, 12.5], [19, 17.3], [15.9, 21.6], [12, 21.6]],
          ],
          2.4,
          21.6,
        );
        var INNER = profile(
          [
            [[12, 3.85], [14.85, 3.85], [17.9, 7.55], [17.9, 12.6]],
            [[17.9, 12.6], [17.9, 16.75], [15.25, 20.35], [12, 20.35]],
          ],
          3.85,
          20.35,
        );
        // 0 outside, 1 skin, 2 flesh, 3 stone
        function region(ux, uy) {
          var dx = ux - 12;
          var oh = halfAt(OUTER, uy);
          if (oh < 0 || Math.abs(dx) > oh) return 0;
          var dy = uy - 13.7;
          if (dx * dx + dy * dy <= 8.41) return 3;
          var ih = halfAt(INNER, uy);
          return ih >= 0 && Math.abs(dx) <= ih ? 2 : 1;
        }
        // How much a point faces the light, which comes from the upper left. The
        // body is read as an ellipsoid, the stone as a sphere of its own.
        function facing(nx, ny) {
          var r2 = nx * nx + ny * ny;
          if (r2 > 1) r2 = 1;
          return c01(-0.46 * nx - 0.6 * ny + 0.65 * Math.sqrt(1 - r2));
        }

        /* ---- colour: everything derives from the card and the accent ---- */
        var P = null;
        function palette() {
          var cs = getComputedStyle(document.documentElement);
          function rgb(name, fallback) {
            var m = /^#([0-9a-f]{6})$/i.exec(cs.getPropertyValue(name).trim());
            return m ? [parseInt(m[1].slice(0, 2), 16), parseInt(m[1].slice(2, 4), 16), parseInt(m[1].slice(4), 16)] : fallback;
          }
          return {
            light: document.documentElement.dataset.theme === "light",
            bg: rgb("--bg-surface-1", [20, 20, 21]),
            ink: rgb("--txt-primary", [228, 230, 230]),
            accent: rgb("--accent", [228, 230, 230]),
            danger: rgb("--danger", [229, 83, 75]),
          };
        }
        function mixc(a, b, t) {
          return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
        }
        function css(c) {
          return "rgb(" + Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]) + ")";
        }
        // From the card up to `base`, then on toward the ink for the brightest tiles.
        function ramp(base, toInk) {
          var hot = mixc(base, P.ink, toInk);
          var out = [];
          for (var k = 0; k < LEVELS; k++) {
            var i = k / (LEVELS - 1);
            out.push(css(i <= KNEE ? mixc(P.bg, base, i / KNEE) : mixc(base, hot, (i - KNEE) / (1 - KNEE))));
          }
          return out;
        }

        /* ---- layout, in device pixels so every tile lands on whole ones ---- */
        var W = 0;
        var H = 0;
        var Wd = 0;
        var Hd = 0;
        var pitch = 6;
        var tile = 3;
        var off = 1;
        var atlas = null;
        var rampCss = [];
        var noise = null;

        var n = 0;
        var tx = null;
        var ty = null;
        var when = null;
        var lev = null;
        var sw = null;
        var kind = null;
        var born = null;
        var strip = { x0: 0, y0: 0, cols: 0, rows: 0, col0: 0, row0: 0 };

        function rrect(c, x, y, w, h, r) {
          c.beginPath();
          c.moveTo(x + r, y);
          c.lineTo(x + w - r, y);
          c.arcTo(x + w, y, x + w, y + r, r);
          c.lineTo(x + w, y + h - r);
          c.arcTo(x + w, y + h, x + w - r, y + h, r);
          c.lineTo(x + r, y + h);
          c.arcTo(x, y + h, x, y + h - r, r);
          c.lineTo(x, y + r);
          c.arcTo(x, y, x + r, y, r);
          c.closePath();
        }

        // One sprite per brightness step, drawn once, so a frame is a few thousand
        // drawImage calls from whole-pixel sources and never a path per tile.
        function makeAtlas() {
          atlas = null;
          var cv = document.createElement("canvas");
          cv.width = LEVELS * tile;
          cv.height = 2 * tile;
          var a = cv.getContext ? cv.getContext("2d") : null;
          if (!a) return;
          var r = tile * 0.3;
          for (var row = 0; row < 2; row++) {
            for (var k = 1; k < LEVELS; k++) {
              a.fillStyle = rampCss[row][k];
              rrect(a, k * tile, row * tile, tile, tile, r);
              a.fill();
            }
          }
          atlas = cv;
        }

        function paint(row, k, x, y) {
          if (atlas) ctx.drawImage(atlas, k * tile, row * tile, tile, tile, x, y, tile, tile);
          else {
            ctx.fillStyle = rampCss[row][k];
            ctx.fillRect(x, y, tile, tile);
          }
        }

        function layout() {
          var d = Math.min(window.devicePixelRatio || 1, 2);
          W = (canvas && canvas.clientWidth) || 558;
          H = (canvas && canvas.clientHeight) || 358;
          Wd = Math.round(W * d);
          Hd = Math.round(H * d);
          if (canvas) {
            canvas.width = Wd;
            canvas.height = Hd;
          }
          var oldTile = tile;
          pitch = Math.max(2, Math.round(PITCH * d));
          tile = Math.max(1, Math.round(TILE * d));
          off = Math.floor((pitch - tile) / 2);
          if (!atlas || tile !== oldTile) makeAtlas();
          if (!noise) noise = blueNoise();

          var cols = Math.floor(Wd / pitch);
          var rows = Math.floor(Hd / pitch);
          var cap = Math.max(1, cols * rows);
          tx = new Int32Array(cap);
          ty = new Int32Array(cap);
          when = new Float32Array(cap);
          lev = new Float32Array(cap);
          sw = new Float32Array(cap);
          kind = new Uint8Array(cap);
          born = new Float32Array(cap).fill(-1);
          n = 0;

          // The mark: FRAME from the top, bottom and right edges, centred on the card's height.
          var S = ((H - FRAME * 2) * d) / 19.2;
          var mcx = (W - FRAME) * d - 7 * S;
          var mcy = (H * d) / 2;

          for (var cy = 0; cy < rows; cy++) {
            for (var cx = 0; cx < cols; cx++) {
              var X0 = cx * pitch;
              var Y0 = cy * pitch;
              var Xc = X0 + pitch / 2;
              var Yc = Y0 + pitch / 2;
              var T = noise[(cy % BN) * BN + (cx % BN)];
              var counts = [9, 0, 0, 0];
              var ux = 12 + (Xc - mcx) / S;
              var uy = 12 + (Yc - mcy) / S;
              if (Math.abs(ux - 12) < 7.6 && Math.abs(uy - 12) < 10) {
                counts[0] = 0;
                for (var sy = 0; sy < 3; sy++) {
                  for (var sx = 0; sx < 3; sx++) {
                    counts[region(12 + (X0 + ((sx + 0.5) * pitch) / 3 - mcx) / S, 12 + (Y0 + ((sy + 0.5) * pitch) / 3 - mcy) / S)]++;
                  }
                }
              }
              var level;
              var density;
              var swp = 0.5;
              var isMark = 9 - counts[0] >= 4;
              if (isMark) {
                // Skin, flesh and stone are three brightnesses (and three densities), each
                // shaded by how far the surface faces the light. Where two of them meet
                // the cell is nearly left empty: the dark stroke the colour mark draws
                // between its tones, which is what keeps the three legible as three.
                var lam = facing((ux - 12) / 7.4, (uy - 12.2) / 10.2);
                var lamP = facing((ux - 12) / 2.9, (uy - 13.7) / 2.9);
                var tone = counts[3] > counts[2] && counts[3] > counts[1] ? 3 : counts[2] > counts[1] ? 2 : 1;
                if (tone === 1) {
                  level = 0.36 + 0.12 * lam;
                  density = 1;
                } else if (tone === 2) {
                  level = 0.68 + 0.32 * lam + (hash(cx, cy, 5) - 0.5) * 0.1;
                  density = 0.66 + 0.34 * lam;
                } else {
                  level = 0.2 + 0.36 * lamP;
                  density = 0.9;
                }
                // Seam: one of the four neighbouring points, half a cell out, is in another tone.
                var half = pitch * 0.55;
                var around = [
                  region(12 + (Xc + half - mcx) / S, uy),
                  region(12 + (Xc - half - mcx) / S, uy),
                  region(ux, 12 + (Yc + half - mcy) / S),
                  region(ux, 12 + (Yc - half - mcy) / S),
                ];
                for (var a4 = 0; a4 < 4; a4++) {
                  if (around[a4] > 0 && around[a4] !== tone) {
                    level *= 0.4;
                    density *= 0.3;
                  }
                }
                level += (hash(cx, cy, 1) - 0.5) * 0.08;
                if (tone === 2 && lam > 0.5 && hash(cx, cy, 2) < 0.035) level = 1;
                swp = c01(((ux - 5) / 14) * 0.45 + ((uy - 2.4) / 19.2) * 0.55);
              } else {
                var cssX = Xc / d;
                if (cssX < FIELD_X) continue;
                // The field thins toward the type, keeps a clear moat around the mark so
                // its edge stays clean, and softens into a faint halo just outside that.
                var rho = Math.sqrt(Math.pow((ux - 12) / 7, 2) + Math.pow((uy - 12) / 9.6, 2));
                var moat = smooth((rho - 1.05) / 0.09);
                var halo = Math.exp(-Math.max(0, rho - 1.14) * 5.5);
                var f = smooth((cssX - FIELD_X) / (W - FIELD_X));
                density = ((0.01 + 0.17 * f) * moat + 0.1 * halo * (0.4 + 0.6 * f)) * (rho > 1.05 ? 1 : 0);
                level = 0.08 + 0.14 * f + 0.14 * halo + (hash(cx, cy, 1) - 0.5) * 0.05;
                if (hash(cx, cy, 3) < 0.03) level = 0.5 + 0.2 * hash(cx, cy, 4);
              }
              // A tile that the dither never switches on is not stored at all. For the
              // mark the threshold is also the order it arrives in; for the field it is
              // rescaled to its own density, so the field fills in across the whole boot
              // instead of all at once in the first moments.
              if (T >= density) continue;
              tx[n] = X0 + off;
              ty[n] = Y0 + off;
              when[n] = isMark ? T : (T / density) * 0.96;
              lev[n] = c01(level);
              sw[n] = swp;
              kind[n] = isMark ? 1 : 0;
              n++;
            }
          }

          // The strip under the step label sits on the same lattice as everything else.
          var cr = canvas ? canvas.getBoundingClientRect() : null;
          var tr = track ? track.getBoundingClientRect() : null;
          var sx0 = tr && tr.width > 0 ? tr.left - cr.left : 30;
          var sy0 = tr && tr.width > 0 ? tr.top - cr.top : 270;
          var sw0 = tr && tr.width > 0 ? tr.width : 252;
          var sh0 = tr && tr.width > 0 ? tr.height : 18;
          strip.col0 = Math.round((sx0 * d) / pitch);
          strip.row0 = Math.round((sy0 * d) / pitch);
          strip.cols = Math.max(0, Math.floor((sw0 * d) / pitch));
          strip.rows = Math.max(1, Math.round((sh0 * d) / pitch));
          strip.x0 = strip.col0 * pitch;
          strip.y0 = strip.row0 * pitch;

          // A resize redraws what was already there as settled, not as new arrivals.
          for (var i = 0; i < n; i++) {
            if (when[i] < landed(i)) born[i] = -10;
          }
        }

        /* ---- state: the art keeps its own clock ---- */
        var te = 0; // seconds of art time
        var p = 0; // progress as displayed, 0..1
        var target = 0.08; // progress as asked for
        var phase = "working";
        var sweep = 0; // the ready light pass, 0..1
        var fk = 0; // the failure ramp, 0..1
        var lastBorn = 0; // art time of the last tile to land

        // Where the displayed progress has got to for one tile: the lit side of the mark
        // runs a little ahead of the shaded side. A tile has landed once this passes its `when`.
        function landed(i) {
          return kind[i] === 1 ? p * (1 + LEAD) - LEAD * sw[i] : p * 1.08;
        }

        /* ---- drawing ---- */
        function draw() {
          if (!ctx || !n) return;
          var c = ctx;
          c.setTransform(1, 0, 0, 1, 0, 0);
          c.clearRect(0, 0, Wd, Hd);
          var failed = phase === "failed";
          var sig = -0.25 + 1.6 * sweep;
          var dim = 1 - 0.3 * fk;
          var i;

          for (i = 0; i < n; i++) {
            var mark = kind[i] === 1;
            var k;
            if (when[i] >= landed(i)) {
              // Never arrived: a dim slot in the danger colour.
              if (failed && fk > 0) {
                k = (fk * (0.1 + 0.14 * lev[i]) * (LEVELS - 1) + 0.5) | 0;
                if (k > 0) paint(1, k, tx[i], ty[i]);
              }
              continue;
            }
            if (born[i] < 0) {
              born[i] = reduce ? -10 : te;
              if (!reduce) lastBorn = te;
            }
            var a = (te - born[i]) / POP;
            var lv = lev[i];
            if (mark) {
              var dl = sig - sw[i];
              lv *= 0.86 + 0.14 * (sweep >= 1 ? 1 : smooth(dl / 0.14));
              if (sweep > 0 && sweep < 1) {
                var q = (dl - 0.05) / 0.07;
                lv += 0.45 * Math.exp(-q * q) * (1 - lv);
              }
            }
            var flash = a < 1 ? (1 - a) * (1 - a) : 0;
            lv = (lv + flash * (mark ? 0.55 : 0.3) * (1 - lv)) * c01(a / 0.2) * dim;
            k = (lv * (LEVELS - 1) + 0.5) | 0;
            if (k > LEVELS - 1) k = LEVELS - 1;
            if (k > 0) paint(0, k, tx[i], ty[i]);
          }

          drawStrip(c, failed, dim);
        }

        // The slider the splash is modelled on: a track of tiles that thickens toward the
        // thumb, and a solid thumb that is the one bright thing on the strip.
        function drawStrip(c, failed, dim) {
          if (!strip.cols) return;
          var left = strip.x0 + off;
          var right = strip.x0 + (strip.cols - 1) * pitch + off + tile;
          var tw = Math.max(2, Math.round(pitch * 0.85));
          var thumbX = Math.round(left + (right - left - tw) * c01(p));
          var r;
          var k;
          for (var col = 0; col < strip.cols; col++) {
            var x = strip.x0 + col * pitch + off;
            var u = (col + 0.5) / strip.cols;
            var lit = x + tile <= thumbX;
            for (r = 0; r < strip.rows; r++) {
              var y = strip.y0 + r * pitch + off;
              var T = noise[((strip.row0 + r) % BN) * BN + ((strip.col0 + col) % BN)];
              if (lit) {
                if (T >= 0.14 + 0.86 * Math.pow(u, 1.25)) continue;
                k = ((0.16 + 0.66 * u) * dim * (LEVELS - 1) + 0.5) | 0;
              } else {
                k = (0.07 * (LEVELS - 1) + 0.5) | 0;
              }
              if (k > 0) paint(0, k, x, y);
            }
          }
          ctx.fillStyle = css(failed ? P.danger : P.ink);
          rrect(ctx, thumbX, strip.y0 + off, tw, (strip.rows - 1) * pitch + tile, tw / 2);
          ctx.fill();
        }

        /* ---- the clock ---- */
        var running = false;
        var last = 0;

        function settled() {
          if (reduce) return true;
          if (te - lastBorn < POP + 0.05) return false;
          if (phase === "failed") return fk >= 1;
          if (p < target - 0.0005) return false;
          return phase !== "ready" || sweep >= 1;
        }

        function frame(now) {
          // Clamped: a hidden window stops delivering frames, and the first one back
          // must not teleport the animation to its end.
          var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
          last = now;
          te += dt;
          if (phase === "failed") {
            fk = Math.min(1, fk + dt / FAIL_SECONDS);
          } else {
            // Chased, never jumped to: quick while far behind, unhurried as it closes.
            var gap = target - p;
            if (gap > 0) p = Math.min(target, p + Math.min(gap, (0.16 + 0.55 * gap) * dt));
            if (phase === "ready" && p >= 1) sweep = Math.min(1, sweep + dt / SWEEP_SECONDS);
          }
          draw();
          if (settled()) {
            running = false;
            last = 0;
          } else {
            requestAnimationFrame(frame);
          }
        }

        function kick() {
          if (reduce) {
            // Still but progressive: every state is drawn once, already seated.
            if (phase !== "failed") p = target;
            sweep = phase === "ready" ? 1 : 0;
            fk = phase === "failed" ? 1 : 0;
            draw();
            return;
          }
          if (running) return;
          running = true;
          requestAnimationFrame(frame);
        }

        P = palette();
        rampCss = [
          ramp(P.accent, P.light ? 0.4 : 0.6),
          ramp(P.danger, 0.3),
        ];
        layout();
        window.addEventListener("resize", function () {
          layout();
          draw();
        });
                kick();

        return {
          /** Boot is at `step` of `total`. */
          working: function (step, total) {
            if (phase !== "working") return;
            target = Math.max(target, 0.12 + 0.78 * c01(step / Math.max(1, total)));
            kick();
          },
          /** Boot is done and the splash is holding a beat before ready. */
          finalizing: function () {
            if (phase !== "working") return;
            target = Math.max(target, 0.97);
            kick();
          },
          ready: function () {
            if (phase === "failed") return;
            phase = "ready";
            target = 1;
            kick();
          },
          fail: function () {
            phase = "failed";
            target = p;
            kick();
          },
        };
      })();
    </script>

    <script>
      /*
       * A plain <script>, not `type="module"`: a module is deferred and
       * fetched as a separate resource even when it imports nothing, and
       * this needs neither. Nothing here is transformed by Vite.
       *
       * The Tauri API is reached through `window.__TAURI__`, which requires
       * `app.withGlobalTauri: true` in tauri.conf.json. That global is
       * injected by the Tauri runtime as an initialisation script, so it is
       * already present before this runs and costs no request — unlike
       * `import { invoke } from "@tauri-apps/api/core"`, which would drag
       * the bundler back in and put this window's startup behind a module
       * graph again.
       */
      (function () {
        "use strict";

        /*
         * Minimum time the splash stays up, no matter how fast boot
         * finishes. This holds back only the *handoff* — the Rust-side work
         * in boot.rs runs at full speed either way and is usually done well
         * before this timer is.
         *
         * 5s is deliberately longer than boot ever actually takes. A boot
         * this app can run (a manifest read and a checkout scan) finishes in
         * well under a second on any real machine, so without a floor the
         * splash would read as barely doing anything — which undersells an
         * app that, once handed off to, is not thin. This is the version of
         * that impression that a fast boot earns instead.
         *
         * Kept well clear of `WATCHDOG_TIMEOUT` in boot.rs (10s): that timer
         * force-closes the splash if nothing calls `finish_boot` in time, as
         * a fallback for a frontend that never got the chance to. This timer
         * is the frontend getting that chance — if the two ever converged,
         * the watchdog would start racing the normal path instead of only
         * ever backstopping it.
         */
        var MIN_VISIBLE_MS = 5000;

        /*
         * How long the bar sits at `FINALIZE_PROGRESS` under a "Finalizing"
         * label before jumping to the real `Ready` state.
         *
         * `boot::BootStatus` has no phase for this — the moment boot.rs
         * reports `Ready`, it is genuinely done, there is no fourth step
         * running in the background during this hold. It exists for the
         * same reason `MIN_VISIBLE_MS` does: a bar that snaps straight from
         * "step 3 of 3" to "Ready" reads as though the last stretch of work
         * was skipped rather than finished, even though nothing was
         * actually skipped. This manufactures the beat that a real final
         * step would have taken.
         *
         * It runs *inside* `MIN_VISIBLE_MS`, not on top of it — `handleReady`
         * only calls `armReadyHandoff` after this hold, so the 5s floor is
         * simply measured from a slightly later point. The two never stack.
         * `Ready` itself is not a resting state either: the art keeps its own
         * clock, so the last of the mark and the light pass across it play
         * out in whatever of `MIN_VISIBLE_MS` is left after this hold.
         */
        var FINALIZE_HOLD_MS = 450;
        var FINALIZE_PROGRESS = 0.95;

        var startedAt = performance.now();

        var errorBox = document.querySelector(".splash__error");
        var errorMessage = document.querySelector(".splash__error-message");
        var continueButton = document.querySelector(".splash__continue");
        var bar = document.querySelector(".splash__footer");
        var root = document.querySelector(".splash");
        var step = document.querySelector(".splash__step");
        var versionLine = document.querySelector(".splash__version");
        // The step in flight, kept so a failure can say where it stopped.
        var lastLabel = "starting";

        var tauri = window.__TAURI__;

        /*
         * Absent when this file is opened directly in a browser, which is
         * how its layout gets checked without building the app. Bailing
         * here leaves the static markup above on screen as a preview of the
         * initial state, rather than throwing on the first property access.
         */
        if (!tauri) return;

        var invoke = tauri.core.invoke;
        var listen = tauri.event.listen;

        // The slot stays empty until the version resolves, and stays empty if it never does.
        try {
          tauri.app.getVersion().then(
            function (version) {
              versionLine.textContent = "Version " + version;
            },
            function () {},
          );
        } catch (err) {
          /* an older runtime without the app API: no version line */
        }

        /** Mirrors `boot::BootStatus` — see src/bindings.ts for the types. */
        function render(status) {
          var working = status.phase === "working";
          var failed = status.phase === "failed";
          var progress = working ? status.step / status.total : status.phase === "ready" ? 1 : 0;

          root.dataset.phase = status.phase;
          bar.setAttribute("aria-valuenow", String(progress));

          // Lowercase and short is the point: the label is a quiet mono line, not a headline.
          if (working) lastLabel = status.step > 0 ? status.label : "starting";
          step.textContent = working
            ? lastLabel
            : failed
              ? lastLabel === "starting"
                ? "failed"
                : lastLabel + " · failed"
              : "ready";

          errorBox.hidden = !failed;
          if (failed) errorMessage.textContent = status.message;

          if (working) splashArt.working(status.step, status.total);
          else if (failed) splashArt.fail();
          else splashArt.ready();
        }

        function finish() {
          invoke("finish_boot").catch(function (err) {
            console.error(String(err));
          });
        }

        // Guards the handoff so it is only ever armed once, however status
        // first reaches `ready` — via the live listener, via the poll, or
        // both racing each other.
        var handoffArmed = false;

        function armReadyHandoff() {
          if (handoffArmed) return;
          handoffArmed = true;
          // Hold until MIN_VISIBLE_MS has elapsed, but not a moment longer:
          // if boot was already slow enough to clear it, this fires now.
          var remaining = Math.max(0, MIN_VISIBLE_MS - (performance.now() - startedAt));
          window.setTimeout(finish, remaining);
        }

        // Separate from `handoffArmed`: that one guards `finish` itself,
        // this guards *entering* the finalizing hold, and they cannot share
        // a flag. `armReadyHandoff` sets its guard only once the hold is
        // already over, so if both the live listener and the poll saw
        // `ready` and this reused that flag, the second caller would read
        // it as still unarmed and start a second hold on top of the first.
        var finalizeStarted = false;

        // The one state transition `render` cannot make on its own: boot.rs
        // never reports it, so it is driven from here rather than folded
        // into `render`'s `status.phase` branches.
        function handleReady() {
          if (finalizeStarted) return;
          finalizeStarted = true;

          bar.setAttribute("aria-valuenow", String(FINALIZE_PROGRESS));
          step.textContent = "finalizing";
          splashArt.finalizing();

          window.setTimeout(function () {
            render({ phase: "ready" });
            armReadyHandoff();
          }, FINALIZE_HOLD_MS);
        }

        // `failed` is deliberately never auto-finished — the user should
        // get a chance to read why before being dropped into the main
        // window, so it waits on this button instead.
        continueButton.addEventListener("click", finish);

        /*
         * Tauri events are not replayed: if boot reports `Ready` before the
         * listener below is registered, that event is simply gone. Polling
         * `boot_status` closes that gap — but its response can also land
         * *after* a live event has already moved things forward, and
         * applying it then would overwrite newer data with older. This flag
         * is the guard. Status only ever moves forward (working, then
         * exactly one of ready/failed), so "has a live event arrived at
         * all" is enough to tell stale from current.
         */
        var liveEventReceived = false;

        // The poll is chained off `listen`'s promise rather than fired
        // alongside it, and that is the point: `listen` is itself an async
        // IPC call that resolves only once the listener is registered on
        // the Rust side. Polling before then would leave a window in which
        // an event could fire and be missed by both paths.
        listen("boot:status", function (event) {
          liveEventReceived = true;
          // `ready` goes through `handleReady`'s finalizing hold instead of
          // straight to `render` — see that function for why.
          if (event.payload.phase === "ready") return handleReady();
          render(event.payload);
        })
          .then(function () {
            return invoke("boot_status");
          })
          .then(function (polled) {
            if (liveEventReceived) return;
            // Boot may have finished before this window even loaded. Routing
            // through `handleReady` here too is what stops that case sitting
            // untouched until the watchdog in boot.rs forces the handoff ten
            // seconds later — it still gets its finalizing hold either way.
            if (polled.phase === "ready") return handleReady();
            render(polled);
          })
          .catch(function (err) {
            console.error(String(err));
          });
      })();
    </script>
  </body>
</html>
