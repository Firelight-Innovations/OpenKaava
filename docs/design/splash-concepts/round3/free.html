    <title>OpenKaava</title>
    <!--
      This file is deliberately standalone: no imports, no build step, no
      shared modules, no coupling of any kind to the rest of the application.

      That includes the branding module the rest of the frontend reads: the
      product name and the wordmark below are written out here, and
      `scripts/check-branding.mjs` fails `pnpm lint` if either stops agreeing
      with branding.toml. Checking rather than generating is what keeps this
      file something you can open and read, which is the whole of its design.

      Everything the window needs is inlined:
        - the styles, with the token values copied literally out of
          src/tokens.css under the same names (this file cannot @import it:
          that would be a request, and a dependency)
        - the art, drawn on a canvas by the `splash-art` script below (Plate;
          it needs no image, so there is no request for one)
        - the mark, as inline SVG
        - the typefaces, as base64 woff2 subsets (see @font-face)
        - the boot logic, as a plain non-module <script> at the bottom

      The markup below IS the finished screen rather than a stand-in for it:
      the script only ever mutates text, one attribute and two `hidden`
      attributes, so there is no handoff to keep visually in sync.

      The cost is that the values here are copies. If a token in
      src/tokens.css changes, change it here too: src/splash/splash.test.ts
      compares the two and fails `pnpm test` on any difference.
    -->
    <!--
      Theme and accent, read before first paint. The shell mirrors the two
      appearance settings into localStorage (src/shell/settings/
      splashAppearance.ts) and this window shares that origin, so a stored
      value is available synchronously with no IPC round-trip. Nothing stored
      (a first launch) leaves the neutral palette in the CSS below. The test
      in src/splash/splash.test.ts runs this script, so the key and the value
      shape are checked against the writer.
    -->
    <script id="splash-appearance">
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem("kaava.splash-appearance"));
          var root = document.documentElement;
          var theme = stored.theme;
          if (theme === "system") {
            theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          if (theme === "light") root.dataset.theme = "light";
          if (/^(amber|blue|green|violet|coral)$/.test(stored.accent)) {
            root.dataset.accent = stored.accent;
          }
        } catch (err) {
          /* unset or unreadable: the neutral defaults stand */
        }
      })();
    </script>
    <!-- CONCEPT ONLY: stripped when this ships. Paste verbatim into <head>, directly after
         <script id="splash-appearance">, before any other script. -->
    <script id="concept-demo">
      (function () {
        window.__conceptErrors = [];
        window.addEventListener("error", function (e) {
          window.__conceptErrors.push(String(e.message) + " @" + e.lineno);
        });
        if (window.__TAURI__) return;
        var q = new URLSearchParams(location.search);
        var demo = q.get("demo");
        if (!demo) return;
        var root = document.documentElement;
        if (q.get("theme") === "light") root.dataset.theme = "light";
        if (q.get("accent")) root.dataset.accent = q.get("accent");
        var total = +(q.get("total") || 5);
        var stop = +(q.get("step") || 2);
        var labels = [
          "Locating manifest",
          "Reading manifest",
          "Scanning checkouts",
          "Starting Home and Files",
          "Starting Files",
        ];
        var events = [];
        var t = 300;
        var last = demo === "working" || demo === "failed" ? stop : total;
        for (var s = 1; s <= last; s++) {
          events.push([t, { phase: "working", step: s, total: total, label: labels[(s - 1) % labels.length] }]);
          t += 700;
        }
        if (demo === "ready" || demo === "cycle") events.push([t, { phase: "ready" }]);
        if (demo === "failed") {
          events.push([
            t,
            {
              phase: "failed",
              message: "Could not read C:\\Users\\dev\\projects\\saas\\kaava.toml: expected `=` at line 12",
            },
          ]);
        }
        window.__TAURI__ = {
          app: {
            getVersion: function () {
              return Promise.resolve("0.6.1");
            },
          },
          core: {
            invoke: function (cmd) {
              return Promise.resolve(
                cmd === "boot_status" ? { phase: "working", step: 0, total: total, label: "Starting…" } : null,
              );
            },
          },
          event: {
            listen: function (name, fn) {
              events.forEach(function (e) {
                setTimeout(function () {
                  fn({ payload: e[1] });
                }, e[0]);
              });
              return Promise.resolve(function () {});
            },
          },
        };
      })();
    </script>
    <style>
      /*
       * Four faces, each subset so it can be inlined (a linked font resolves
       * after first paint, and the text would reflow into it). Regenerate with
       * `pyftsubset <fontsource woff2> --unicodes=<range> --flavor=woff2`:
       *
       *   Inter 600          U+2122, U+0041-005A, U+0061-007A  the wordmark, 4kB
       *   Inter 500          U+0020-007E, U+00A9, U+00B7, U+2122, U+2026  Veistra, the button, 12kB

       *   IBM Plex Mono 500  U+0020-007E, U+00A9, U+00B7, U+2014, U+2122  the step count and error text, 9kB

       * boot.rs, error messages with file paths), so the ranges cover printable

      /*
       * Tokens, copied from src/tokens.css under the same names. Only the ones
       * this file reads are here; src/splash/splash.test.ts fails if any of
       * them drifts from tokens.css, so a stale copy is caught by `pnpm test`
       * rather than noticed on a launch.
       */
      :root {
        color-scheme: dark;

        --bg-canvas: #0f0f10;
        --bg-surface-1: #141415;
        --bg-layer-1: #181a1b;
        --border-subtle: #222425;
        --border-subtle-1: #2c2e30;
        --border-strong: #36393a;
        --border-strong-1: #45484a;

        --txt-primary: #e4e6e6;
        --txt-secondary: #cacdce;
        --txt-tertiary: #afb3b6;
        --txt-danger: #f4a49c;
        --danger: #e5534b;

        --accent-amber: #d98a3f;
        --accent-blue: #3f76ff;
        --accent-green: #4cb863;
        --accent-violet: #a585f0;
        --accent-coral: #e5736b;

        --sans: Inter, "Inter Variable", system-ui, "Segoe UI", sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

        --radius-md: 6px;
        --radius-xl: 12px;
        --shadow-overlay: 0 12px 32px -6px rgba(0, 0, 0, 0.6), 0 2px 6px rgba(0, 0, 0, 0.3);
        --control-md: 28px;
        --focus-ring: 2px solid color-mix(in srgb, var(--accent) 45%, transparent);
        --focus-ring-offset: 2px;

        /* Not a token: what the accent means for the splash's own parts.
           Neutral until the head script has found a stored accent, so a first
           launch is never drawn in a colour the user did not pick. */
        --accent: var(--txt-primary);
      }

      :root[data-theme="light"] {
        color-scheme: light;

        --bg-canvas: #f2f2f3;
        --bg-surface-1: #ffffff;
        --bg-layer-1: #f9f9f9;
        --border-subtle: #eaebec;
        --border-subtle-1: #e1e2e3;
        --border-strong: #d5d7d9;
        --border-strong-1: #cacdcf;

        --txt-primary: #0f0f10;
        --txt-secondary: #313435;
        --txt-tertiary: #494d50;
        --txt-danger: #9c231b;
        --danger: #bf2c22;

        --accent-amber: #a85a14;
        --accent-blue: #2f62e0;
        --accent-green: #23803b;
        --accent-violet: #6c47c9;
        --accent-coral: #b8392f;
      }

      /* The accent. Neutral (the text colour) until the head script finds a
         stored one. The art and the progress segments both read it. */
      :root[data-accent="amber"] {
        --accent: var(--accent-amber);
      }
      :root[data-accent="blue"] {
        --accent: var(--accent-blue);
      }
      :root[data-accent="green"] {
        --accent: var(--accent-green);
      }
      :root[data-accent="violet"] {
        --accent: var(--accent-violet);
      }
      :root[data-accent="coral"] {
        --accent: var(--accent-coral);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      /* Transparent, not a colour: the window is transparent too, so the
         desktop shows through everywhere except the card below. Any fill
         here would be the square backing the rounded card is meant to
         remove. */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      /* The window is 72px larger than the card in each direction, and this
         padding is that gutter: room for the shadow to fall on transparent
         pixels instead of being clipped at the window edge. */
      body {
        padding: 36px;
      }

      /* The window is transparent and undecorated (see tauri.conf.json), so
         this card IS the visible window: the app window's radius, the
         hairline border and the overlay shadow are drawn here, anti-aliased
         by the compositor. The clip on `overflow` rounds the canvas. */
      .splash {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg-surface-1);
        border: 1px solid var(--border-subtle-1);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-overlay);
        color: var(--txt-primary);
        font-family: var(--sans);
      }

      .splash__content {
        position: absolute;
        inset: 0;
      }

      .splash__art {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* The lockup and the footer sit on the art's tile lattice: the art lays
         tiles on a 6px pitch from the card's padding edge, each tile 4px wide
         with a 1px margin, so a left edge of 31px (5 cells + 1) and a top of
         33px (2px of vertical centring + 5 cells + 1) put the mark's tile on
         the same grid as the field around it. The art reads the two blocks
         marked `data-plate` and clears the field around them. */
      .splash__head {
        position: absolute;
        left: 31px;
        top: 33px;
        z-index: 1;
      }

      .splash__lockup {
        display: flex;
        align-items: center;
      }

      /* A solid tile among small ones: the one fully-lit square on the card,
         standing where the reference's white thumb stands. The mark is knocked
         out of it in the surface colour, so it reads the same in either theme. */
      .splash__logo {
        flex: none;
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border-radius: var(--radius-xl);
        background: var(--txt-primary);
        color: var(--bg-surface-1);
      }

      .splash__logo svg {
        display: block;
        width: 28px;
        height: 28px;
        fill: currentColor;
      }

      .splash__wordmark {
        margin: 0 0 0 14px;
        font-family: var(--sans);
        font-size: 30px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.012em;
        color: var(--txt-primary);
      }

      /* Product | maker, the way a suite names its parts: a hairline as tall
         as the wordmark's capitals, and the maker one size down. */
      .splash__rule {
        flex: none;
        width: 1px;
        height: 22px;
        margin: 0 16px;
        background: var(--border-strong-1);
      }

      .splash__maker {
        margin: 0;
        font-family: var(--sans);
        font-size: 16px;
        font-weight: 500;
        line-height: 1;
        letter-spacing: 0.01em;
        color: var(--txt-secondary);
      }

      /* Empty until the app reports its version; the height is reserved so the
         clearing the art cuts around this block never changes size. */
      .splash__version {
        margin: 14px 0 0;
        min-height: 14px;
        font-family: var(--sans);
        font-size: 11px;
        font-weight: 400;
        line-height: 14px;
        letter-spacing: 0.01em;
        color: var(--txt-tertiary);
      }

      .splash__foot {
        position: absolute;
        left: 31px;
        bottom: 30px;
        z-index: 1;
      }

      .splash__progress {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 16px;
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        line-height: 1;
        white-space: nowrap;
      }

      /* One more small solid tile: the current step's. */
      .splash__pip {
        flex: none;
        width: 6px;
        height: 6px;
        border-radius: 2px;
        background: var(--accent);
      }

      .splash__count {
        color: var(--txt-primary);
      }

      .splash__step {
        color: var(--txt-tertiary);
        text-transform: lowercase;
      }

      .splash[data-phase="failed"] .splash__pip {
        background: var(--danger);
      }

      .splash[data-phase="failed"] .splash__step {
        color: var(--txt-danger);
      }

      /* The legal line is quiet but not faint: --txt-tertiary is 8:1 against
         the card in dark and 8.5:1 in light, well over the 4.5:1 small text
         needs, so it can stay a size smaller than anything else here. */
      .splash__legal {
        margin: 14px 0 0;
        padding-top: 12px;
        border-top: 1px solid var(--border-subtle-1);
        font-family: var(--sans);
        font-size: 11px;
        font-weight: 400;
        line-height: 14px;
        letter-spacing: 0.01em;
        color: var(--txt-tertiary);
      }

      .splash__error {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 24px 24px;
        z-index: 2;
      }

      /* A panel rather than bare text: the message has to stay legible over
         the art. */
      .splash__error-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        max-width: 400px;
        padding: 16px 24px 18px;
        border: 1px solid var(--border-subtle-1);
        border-radius: var(--radius-xl);
        background: color-mix(in srgb, var(--bg-surface-1) 94%, transparent);
        box-shadow: var(--shadow-overlay);
      }

      .splash__error-message {
        margin: 0;
        text-align: center;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.45;
        color: var(--txt-danger);
      }

      /* The design system's secondary button: layer fill, strong border. */
      .splash__continue {
        height: var(--control-md);
        padding: 0 12px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-md);
        background: var(--bg-layer-1);
        color: var(--txt-primary);
        font-family: var(--sans);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }

      .splash__continue:hover {
        border-color: var(--border-strong-1);
      }

      .splash__continue:focus-visible {
        outline: var(--focus-ring);
        outline-offset: var(--focus-ring-offset);
      }
    </style>
  </head>
  <body>
    <div class="splash" data-phase="working">
      <div class="splash__content">
        <canvas class="splash__art" aria-hidden="true"></canvas>

        <div class="splash__error" hidden>
          <div class="splash__error-panel">
            <p class="splash__error-message"></p>
            <button type="button" class="splash__continue">Continue anyway</button>
          </div>
        </div>
      </div>

      <div class="splash__head" data-plate>
        <div class="splash__lockup">
          <i class="splash__logo" id="logo" aria-hidden="true"
            ><svg viewBox="0 0 24 24" focusable="false">
              <path
                d="M12 2.4c3.3 0 7 4.2 7 10.1 0 4.8-3.1 9.1-7 9.1s-7-4.3-7-9.1C5 6.6 8.7 2.4 12 2.4zm0 8.4a2.9 2.9 0 1 0 0 5.8 2.9 2.9 0 0 0 0-5.8z"
              /></svg
          ></i>
          <p class="splash__wordmark">OpenKaava</p>
          <i class="splash__rule" aria-hidden="true"></i>
          <p class="splash__maker">Veistra™</p>
        </div>
        <p class="splash__version"></p>
      </div>

      <div class="splash__foot" data-plate>
        <div
          class="splash__progress"
          role="progressbar"
          aria-label="Startup"
          aria-valuemin="0"
          aria-valuemax="1"
          aria-valuenow="0"
        >
          <i class="splash__pip" aria-hidden="true"></i>
          <span class="splash__count">00/05</span>
          <span class="splash__step">starting</span>
        </div>
        <p class="splash__legal">© 2026 Firelight Innovations. All rights reserved.</p>
      </div>
    </div>

    <script id="splash-art">
      /*
       * Plate. The whole card is a field of small rounded tiles on a 6px
       * lattice, in the manner of the effort slider: sparse and dim at one
       * corner, dense and bright at the other, dithered so no two neighbours
       * agree. Where the lockup and the footer sit the field is cleared, and
       * the edge of each clearing is the same dither fading out.
       *
       * Progress is density, not position. Every tile has a place in a random
       * order, and boot progress is how far down that order the card has got:
       * the whole composition is there from the first frame as a faint
       * constellation and fills in everywhere at once, like a plate being
       * developed. A tile that lights pops large and bright and settles into
       * its resting place, so the leading edge of progress is a quiet glitter.
       * Nothing sweeps; there is no bar to read.
       *
       * Ready brings the last of the field in, lets the sparkle tiles go once in
       * a random order, and tightens the grain (tile sizes and brightnesses
       * relax from their noisy values to the clean envelope). Failure stops the
       * order where it stood, leaves the unlit remainder as a faint danger
       * stipple, and turns the last few tiles to have lit the danger colour.
       *
       * Nothing here talks to Tauri. The boot script calls the four methods on
       * `splashArt` and this file owns the time: ramps are queued with a
       * minimum gap, so a status that arrives late or all at once still plays
       * out as a sequence. The loop runs only while something is moving.
       */
      var splashArt = (function () {
        "use strict";

        var canvas = document.querySelector(".splash__art");
        var ctx = canvas && canvas.getContext ? canvas.getContext("2d") : null;
        var reduce = false;
        try {
          reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        } catch (err) {
          /* no matchMedia: motion stays on */
        }

        /* ---- tuning ---- */
        var PITCH = 6; // css px between tile centres
        var FULL = 4; // css px, the largest tile
        var SIZES = [0.5, 0.75, 1, 1.25]; // size classes, as a share of FULL; the last is only ever a pop
        var K = 8; // brightness steps per size class and palette
        var SEED = 20260;
        var FEATHER = 34; // css px over which a clearing fades back into the field
        var CLEAR_PAD = 10; // css px of clearing beyond the text it holds
        var CLEAR_RADIUS = 16;
        // Progress is 0..1 down the lighting order. Steps take it from P0 to P_STEPS,
        // finalizing to P_FINAL, ready to 1.
        var P0 = 0.07;
        var P_STEPS = 0.8;
        var P_FINAL = 0.92;
        // Ramps start at least this far apart, so a boot that reports five steps
        // in one millisecond still reads as five beats; the last two are tighter
        // because the splash has only a few seconds in all.
        var STEP_GAP = 0.3;
        var END_GAP = 0.22;
        var RAMP = 0.65;
        var RESOLVE = 1.1;
        var FAIL_SECONDS = 0.9;
        var TAIL = 0.8; // flashes take this long to die after the last ramp

        function c01(x) {
          return x < 0 ? 0 : x > 1 ? 1 : x;
        }
        function smooth(x) {
          x = c01(x);
          return x * x * (3 - 2 * x);
        }
        function frac(x) {
          return x - Math.floor(x);
        }
        function mulberry(a) {
          return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        function hash2(ix, iy) {
          var h = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263)) | 0;
          h = Math.imul(h ^ (h >>> 13), 1274126177);
          return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
        }
        // Value noise, 0..1: the slow weather the envelope is modulated by.
        function vnoise(x, y) {
          var ix = Math.floor(x);
          var iy = Math.floor(y);
          var u = smooth(x - ix);
          var v = smooth(y - iy);
          var a = hash2(ix, iy);
          var b = hash2(ix + 1, iy);
          var c = hash2(ix, iy + 1);
          var d = hash2(ix + 1, iy + 1);
          return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }

        /* ---- colour: everything derives from --accent ---- */
        function parseColour(s, fallback) {
          var m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(s || "").trim());
          if (!m) return fallback;
          var h = m[1];
          if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
          return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
        }
        function mix(a, b, t) {
          return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
        }
        function rgba(c, a) {
          return "rgba(" + Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]) + "," + a.toFixed(3) + ")";
        }

        // fills[palette][k]: 0 is the accent, 1 is the flash of a tile lighting (the
        // accent pushed toward the ink: lighter in dark, deeper in light), 2 is the
        // danger colour, 3 is a sparkle at rest (halfway between the two).
        var PALETTES = 4;
        var fills = [];
        var ghostFill = "";
        var ghostDanger = "";
        function palette() {
          var cs = null;
          try {
            cs = getComputedStyle(document.documentElement);
          } catch (err) {
            /* no styles: the fallbacks below stand */
          }
          function get(name) {
            return cs ? cs.getPropertyValue(name) : "";
          }
          var light = document.documentElement.dataset.theme === "light";
          var accent = parseColour(get("--accent"), [190, 190, 190]);
          var ink = parseColour(get("--txt-primary"), light ? [15, 15, 16] : [228, 230, 230]);
          var danger = parseColour(get("--danger"), [229, 83, 75]);
          var hot = mix(accent, ink, light ? 0.38 : 0.5);
          var sets = [accent, hot, danger, mix(accent, ink, light ? 0.22 : 0.34)];
          fills = [];
          for (var s = 0; s < sets.length; s++) {
            var row = [];
            for (var k = 0; k < K; k++) {
              row.push(rgba(sets[s], (light ? 0.3 : 0.22) + (light ? 0.7 : 0.78) * Math.pow(k / (K - 1), 1.2)));
            }
            fills.push(row);
          }
          ghostFill = rgba(accent, light ? 0.11 : 0.085);
          ghostDanger = rgba(danger, light ? 0.16 : 0.13);
        }

        /* ---- state ---- */
        var te = 0; // art clock, seconds
        var phase = "working";
        var ramps = []; // {t0, t1, a, b}: progress eases a -> b over t0..t1
        var lastB = P0;
        var lastT0 = -10;
        var readyAt = -1;
        var fk = 0; // failure ramp 0..1
        var frozenP = 0;
        var until = 0; // the loop keeps running until this clock time
        var p = P0; // progress as drawn

        /* ---- layout, in device pixels ---- */
        var W = 0;
        var H = 0;
        var cw = 0;
        var ch = 0;
        var dpr = 1;
        var pitch = 6;
        var sizeDev = [2, 3, 4];
        var radDev = [1, 1, 1];
        var ghostDev = 2;
        var hasRR = false;

        /* ---- the tiles: only the ones that exist in the finished field ---- */
        var n = 0;
        var tx = null;
        var ty = null;
        var rnk = null; // place in the lighting order, 0..1
        var aj = null; // resting brightness with its noise
        var ac = null; // the same without it
        var sj = null; // size class with noise
        var sc = null; // without
        var sp = null; // 1 for a sparkle
        var shine = null; // 1 for a tile that glimmers at ready: every sparkle, and a scatter of others
        var shw = null; // when in the ready shower, and when the grain tightens, 0..1
        var lit = null;
        var ign = null; // art clock at which the tile lit
        var lists = [];
        // Lists 0..GHOST-1 are (palette, size, brightness); the two after are the
        // tiles that have not lit yet, in their resting and failed colours.
        var GHOST = PALETTES * SIZES.length * K;

        function measure() {
          var out = [];
          var nodes = document.querySelectorAll("[data-plate]");
          var cr = canvas.getBoundingClientRect();
          for (var i = 0; i < nodes.length; i++) {
            var r = nodes[i].getBoundingClientRect();
            if (!r.width || !r.height) continue;
            var box = {
              x0: r.left - cr.left - CLEAR_PAD,
              y0: r.top - cr.top - CLEAR_PAD,
              x1: r.right - cr.left + CLEAR_PAD,
              y1: r.bottom - cr.top + CLEAR_PAD,
            };
            // A clearing that nearly reaches an edge carries on off the card, so no
            // stray column of tiles is left between the text and the edge.
            if (box.x0 < FEATHER) box.x0 = -400;
            if (box.y0 < FEATHER) box.y0 = -400;
            if (box.x1 > W - FEATHER) box.x1 = W + 400;
            if (box.y1 > H - FEATHER) box.y1 = H + 400;
            out.push(box);
          }
          return out;
        }

        // Distance outside a rounded box, negative inside it.
        function sdBox(x, y, b) {
          var hx = (b.x1 - b.x0) / 2 - CLEAR_RADIUS;
          var hy = (b.y1 - b.y0) / 2 - CLEAR_RADIUS;
          var qx = Math.abs(x - (b.x0 + b.x1) / 2) - hx;
          var qy = Math.abs(y - (b.y0 + b.y1) / 2) - hy;
          return Math.sqrt(Math.pow(Math.max(qx, 0), 2) + Math.pow(Math.max(qy, 0), 2)) + Math.min(Math.max(qx, qy), 0) - CLEAR_RADIUS;
        }

        // What the finished field looks like, 0..1: light from the lower right,
        // with weather. Position here is a property of the picture, not of progress.
        function envelope(x, y) {
          var nx = x / W;
          var ny = y / H;
          var b = smooth((nx * 0.62 + ny * 0.78 - 0.42) / 0.9);
          // A lighter lobe in the top right corner, so the field wraps the clear area
          // rather than only rising from its floor.
          var cx = 1 - nx;
          var lobe = 0.55 * smooth(1 - Math.sqrt(cx * cx * 1.6 + ny * ny * 3.2) / 0.62);
          var weather = vnoise(x / 64 + 3.1, y / 64 + 7.7);
          return Math.min(0.94, c01((0.09 + 0.91 * Math.pow(Math.max(b, lobe), 1.1)) * (0.7 + 0.6 * weather)));
        }

        // Resting classes only: the last one is reserved for the pop of a tile lighting.
        function sizeClass(e) {
          return e < 0.3 ? 0 : e < 0.62 ? 1 : 2;
        }

        function build() {
          var cols = Math.max(0, Math.floor(cw / pitch));
          var rows = Math.max(0, Math.floor(ch / pitch));
          var x0 = Math.floor((cw - cols * pitch) / 2);
          var y0 = Math.floor((ch - rows * pitch) / 2);
          var plates = measure();
          var rng = mulberry(SEED);
          var cap = cols * rows;
          tx = new Int32Array(cap);
          ty = new Int32Array(cap);
          rnk = new Float32Array(cap);
          aj = new Float32Array(cap);
          ac = new Float32Array(cap);
          sj = new Uint8Array(cap);
          sc = new Uint8Array(cap);
          sp = new Uint8Array(cap);
          shine = new Uint8Array(cap);
          shw = new Float32Array(cap);
          lit = new Uint8Array(cap);
          ign = new Float32Array(cap);
          n = 0;
          for (var r = 0; r < rows; r++) {
            for (var c = 0; c < cols; c++) {
              // Every cell draws the same number of values, so a clearing that moves
              // never reshuffles the tiles around it.
              var r1 = rng();
              var r2 = rng();
              var r3 = rng();
              var r4 = rng();
              var r5 = rng();
              var r6 = rng();
              var x = (x0 + c * pitch + pitch / 2) / dpr;
              var y = (y0 + r * pitch + pitch / 2) / dpr;
              var e = envelope(x, y);
              for (var q = 0; q < plates.length; q++) {
                e = Math.min(e, e * smooth(sdBox(x, y, plates[q]) / FEATHER));
              }
              // Presence: the envelope thresholded by a pattern that is mostly noise.
              // A cleaner lattice here shows as rows of evenly spaced dots wherever the
              // field is sparse.
              var dither = frac(c * 0.7548776662466927 + r * 0.5698402909980532 + 0.31 + (r1 - 0.5) * 0.55);
              if (dither >= e) continue;
              var i = n++;
              tx[i] = x0 + c * pitch;
              ty[i] = y0 + r * pitch;
              rnk[i] = frac(c * 0.6180339887498949 + r * 0.8191725133961645 + 0.17 + (r2 - 0.5) * 0.3);
              var base = 0.3 + 0.7 * Math.pow(e, 0.8);
              ac[i] = c01(base * 0.84);
              aj[i] = c01(base * (0.5 + 0.55 * r3));
              sc[i] = sizeClass(e);
              sj[i] = sizeClass(e + (r4 - 0.5) * 0.4);
              shw[i] = r6;
              shine[i] = frac(r1 * 977.7) < 0.09 ? 1 : 0;
              if (r5 < 0.05) {
                sp[i] = 1;
                ac[i] = 0.92;
                aj[i] = 0.92;
                sc[i] = 2;
                sj[i] = 2;
                shine[i] = 1;
              }
            }
          }
          for (var j = 0; j < n; j++) {
            if (rnk[j] <= p) {
              lit[j] = 1;
              ign[j] = -99;
            }
          }
        }

        function layout() {
          if (!canvas) return;
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          W = canvas.clientWidth || 0;
          H = canvas.clientHeight || 0;
          cw = Math.round(W * dpr);
          ch = Math.round(H * dpr);
          canvas.width = cw;
          canvas.height = ch;
          pitch = Math.max(2, Math.round(PITCH * dpr));
          var full = Math.max(2, Math.round(FULL * dpr));
          sizeDev = [];
          radDev = [];
          for (var s = 0; s < SIZES.length; s++) {
            var px = Math.max(1, Math.round(full * SIZES[s]));
            sizeDev.push(px);
            radDev.push(px >= 3 ? Math.max(1, Math.round(px * 0.26)) : px / 2);
          }
          ghostDev = Math.max(1, Math.round(full * 0.4));
          hasRR = !!ctx && typeof ctx.roundRect === "function";
          build();
        }

        /* ---- progress ---- */
        function progressAt(t) {
          var v = P0;
          for (var i = 0; i < ramps.length; i++) {
            var r = ramps[i];
            if (t >= r.t1) {
              v = r.b;
              continue;
            }
            v = t > r.t0 ? r.a + (r.b - r.a) * smooth((t - r.t0) / (r.t1 - r.t0)) : r.a;
            break;
          }
          return v;
        }

        // Queue a ramp to `b`. It starts now, or `gap` after the previous one
        // started, whichever is later.
        function admit(b, dur, gap) {
          if (phase === "failed" || b <= lastB + 1e-4) return null;
          var t0 = Math.max(te, lastT0 + gap);
          var r = { t0: reduce ? -1000 : t0, t1: reduce ? -999 : t0 + dur, a: lastB, b: b };
          ramps.push(r);
          lastB = b;
          lastT0 = t0;
          until = Math.max(until, r.t1 + TAIL);
          return r;
        }

        /* ---- drawing ---- */
        function tile(x, y, s, r) {
          if (hasRR) ctx.roundRect(x, y, s, s, r);
          else ctx.rect(x, y, s, s);
        }

        function ensureLists() {
          while (lists.length < GHOST + 2) lists.push([]);
          for (var i = 0; i < lists.length; i++) lists[i].length = 0;
        }

        function draw() {
          if (!ctx || !n) return;
          var failed = phase === "failed";
          var rz = reduce ? (phase === "ready" ? 1 : 0) : smooth(readyAt >= 0 ? (te - readyAt) / RESOLVE : 0);
          // A breath of extra light while the resolve runs, then back to rest.
          var expo = (0.82 + 0.18 * c01(p)) * (1 + 0.14 * Math.sin(Math.PI * rz)) * (1 - 0.32 * fk);
          var scarFrom = frozenP - 0.05;
          var i;
          ensureLists();
          for (i = 0; i < n; i++) {
            if (!lit[i]) {
              lists[failed ? GHOST + 1 : GHOST].push(i);
              continue;
            }
            var age = te - ign[i];
            var fl = age < 1 ? Math.exp(-age * 5.5) : 0;
            if (shine[i] && readyAt >= 0) {
              var at = te - (readyAt + 0.1 + shw[i] * 0.8);
              if (at > 0 && at < 1.5) fl = Math.max(fl, Math.exp(-at * 3));
            }
            var a = ac[i] + (aj[i] - ac[i]) * (1 - rz);
            var s = rz > shw[i] ? sc[i] : sj[i];
            var pal = 0;
            if (failed && rnk[i] > scarFrom && fk > 0.15) {
              pal = 2;
              a = Math.max(a, 0.55) * fk;
            } else {
              a = a * expo + fl * 0.6;
              if (fl > 0.4) pal = 1;
              else if (sp[i]) pal = 3;
            }
            if (fl > 0.55 && s < SIZES.length - 1) s++;
            var k = Math.min(K - 1, Math.max(0, Math.floor(a * K)));
            lists[(pal * SIZES.length + s) * K + k].push(i);
          }

          ctx.clearRect(0, 0, cw, ch);
          var gl = lists[failed ? GHOST + 1 : GHOST];
          if (gl.length) {
            ctx.fillStyle = failed ? ghostDanger : ghostFill;
            ctx.beginPath();
            var go = (pitch - ghostDev) >> 1;
            for (i = 0; i < gl.length; i++) tile(tx[gl[i]] + go, ty[gl[i]] + go, ghostDev, ghostDev / 2);
            ctx.fill();
          }
          for (var pl = 0; pl < PALETTES; pl++) {
            for (var sz = 0; sz < SIZES.length; sz++) {
              var px = sizeDev[sz];
              var off = (pitch - px) >> 1;
              for (var kk = 0; kk < K; kk++) {
                var list = lists[(pl * SIZES.length + sz) * K + kk];
                if (!list.length) continue;
                ctx.fillStyle = fills[pl][kk];
                ctx.beginPath();
                for (var j = 0; j < list.length; j++) tile(tx[list[j]] + off, ty[list[j]] + off, px, radDev[sz]);
                ctx.fill();
              }
            }
          }
        }

        /* ---- the clock ---- */
        var running = false;
        var last = 0;

        function advance() {
          p = failed() ? frozenP : progressAt(te);
          for (var i = 0; i < n; i++) {
            if (!lit[i] && rnk[i] <= p) {
              lit[i] = 1;
              ign[i] = reduce ? -99 : te;
            }
          }
        }

        function failed() {
          return phase === "failed";
        }

        function settled() {
          if (reduce) return true;
          return te >= until && (!failed() || fk >= 1);
        }

        function frame(now) {
          // Clamped: a hidden window stops delivering frames, and the first one back
          // must not teleport the animation to its end.
          var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
          last = now;
          te += dt;
          if (failed()) fk = Math.min(1, fk + dt / FAIL_SECONDS);
          advance();
          draw();
          if (settled()) {
            running = false;
            last = 0;
          } else {
            requestAnimationFrame(frame);
          }
        }

        function kick() {
          if (reduce) {
            // still-but-progressive: every state is drawn once, already arrived
            te = 1e4;
            fk = failed() ? 1 : 0;
            advance();
            draw();
            return;
          }
          if (running) return;
          running = true;
          requestAnimationFrame(frame);
        }

        palette();
        layout();
        window.addEventListener("resize", function () {
          layout();
          draw();
        });
        // Text widths decide the clearings, and a late face moves them.
        try {
          if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(function () {
              layout();
              draw();
            });
          }
        } catch (err) {
          /* no font events: the first measurement stands */
        }
        te = reduce ? 0 : 0.2;
        lastT0 = -10;
        advance();
        kick();

        return {
          /** Boot is at `step` of `total`. */
          working: function (step, total) {
            if (phase !== "working") return;
            admit(P0 + (P_STEPS - P0) * c01(step / Math.max(1, total)), RAMP, STEP_GAP);
            kick();
          },
          /** Boot is done and the splash is holding a beat before ready. */
          finalizing: function () {
            if (phase === "working") {
              phase = "finalizing";
              admit(P_FINAL, RAMP * 0.8, END_GAP);
            }
            kick();
          },
          ready: function () {
            if (phase === "failed" || phase === "ready") return;
            phase = "ready";
            // Whatever has not played yet still does; the resolve waits for it.
            var r = admit(1, RAMP * 0.7, END_GAP);
            readyAt = r ? r.t1 : Math.max(te, lastT0 + 0.7);
            until = Math.max(until, readyAt + RESOLVE + TAIL);
            kick();
          },
          fail: function () {
            if (phase === "failed") return;
            frozenP = progressAt(te);
            ramps = [{ t0: te, t1: te, a: frozenP, b: frozenP }];
            phase = "failed";
            until = te + 1.2;
            kick();
          },
        };
      })();
    </script>

    <script>
      /*
       * A plain <script>, not `type="module"`: a module is deferred and
       * fetched as a separate resource even when it imports nothing, and
       * this needs neither. Nothing here is transformed by Vite.
       *
       * The Tauri API is reached through `window.__TAURI__`, which requires
       * `app.withGlobalTauri: true` in tauri.conf.json. That global is
       * injected by the Tauri runtime as an initialisation script, so it is
       * already present before this runs and costs no request, unlike
       * `import { invoke } from "@tauri-apps/api/core"`, which would drag
       * the bundler back in and put this window's startup behind a module
       * graph again.
       */
      (function () {
        "use strict";

        /*
         * Minimum time the splash stays up, no matter how fast boot
         * finishes. This holds back only the *handoff*: the Rust-side work
         * in boot.rs runs at full speed either way and is usually done well
         * before this timer is.
         *
         * 5s is deliberately longer than boot ever actually takes. A boot
         * this app can run (a manifest read and a checkout scan) finishes in
         * well under a second on any real machine, so without a floor the
         * splash would read as barely doing anything, which undersells an
         * app that, once handed off to, is not thin. This is the version of
         * that impression that a fast boot earns instead.
         *
         * Kept well clear of `WATCHDOG_TIMEOUT` in boot.rs (10s): that timer
         * force-closes the splash if nothing calls `finish_boot` in time, as
         * a fallback for a frontend that never got the chance to. This timer
         * is the frontend getting that chance. If the two ever converged,
         * the watchdog would start racing the normal path instead of only
         * ever backstopping it.
         */
        var MIN_VISIBLE_MS = 5000;

        /*
         * How long the splash sits at `FINALIZE_PROGRESS` under a "finalizing"
         * label before jumping to the real `Ready` state.
         *
         * `boot::BootStatus` has no phase for this: the moment boot.rs
         * reports `Ready`, it is genuinely done, there is no fourth step
         * running in the background during this hold. It exists for the
         * same reason `MIN_VISIBLE_MS` does: a screen that snaps straight from
         * "step 3 of 3" to "Ready" reads as though the last stretch of work
         * was skipped rather than finished, even though nothing was
         * actually skipped. This manufactures the beat that a real final
         * step would have taken.
         *
         * It runs *inside* `MIN_VISIBLE_MS`, not on top of it: `handleReady`
         * only calls `armReadyHandoff` after this hold, so the 5s floor is
         * simply measured from a slightly later point. The two never stack.
         */
        var FINALIZE_HOLD_MS = 450;
        var FINALIZE_PROGRESS = 0.95;

        var startedAt = performance.now();

        var errorBox = document.querySelector(".splash__error");
        var errorMessage = document.querySelector(".splash__error-message");
        var continueButton = document.querySelector(".splash__continue");
        var bar = document.querySelector(".splash__progress");
        var root = document.querySelector(".splash");
        var count = document.querySelector(".splash__count");
        var step = document.querySelector(".splash__step");
        var versionLine = document.querySelector(".splash__version");
        // The step in flight, kept so a failure can say where it stopped.
        var lastLabel = "starting";
        var lastStep = 0;
        var lastTotal = 5;

        var tauri = window.__TAURI__;

        /*
         * Absent when this file is opened directly in a browser, which is
         * how its layout gets checked without building the app. Bailing
         * here leaves the static markup above on screen as a preview of the
         * initial state, rather than throwing on the first property access.
         */
        if (!tauri) return;

        var invoke = tauri.core.invoke;
        var listen = tauri.event.listen;

        function pad(n) {
          return (n < 10 ? "0" : "") + n;
        }

        // The slot stays empty until the app answers, so a version is never guessed at.
        try {
          if (tauri.app && tauri.app.getVersion) {
            tauri.app.getVersion().then(
              function (version) {
                versionLine.textContent = "Version " + version;
              },
              function () {},
            );
          }
        } catch (err) {
          /* no version: the line stays empty */
        }

        /** Mirrors `boot::BootStatus`: see src/bindings.ts for the types. */
        function render(status) {
          var working = status.phase === "working";
          var failed = status.phase === "failed";
          var progress = working ? status.step / status.total : status.phase === "ready" ? 1 : 0;

          root.dataset.phase = status.phase;
          bar.setAttribute("aria-valuenow", String(progress));

          if (working) {
            lastStep = status.step;
            lastTotal = status.total;
          }
          // `step 0` is a state boot can report before it starts, and it is not a step.
          // Ready counts every step as done; failed keeps the count it stopped at.
          count.textContent = pad(status.phase === "ready" ? lastTotal : lastStep) + "/" + pad(lastTotal);

          // Lowercase and short is the point: the label is a quiet mono line, not a headline.
          if (working) lastLabel = status.step > 0 ? status.label : "starting";
          step.textContent = working
            ? lastLabel
            : failed
              ? lastLabel === "starting"
                ? "failed"
                : lastLabel + " · failed"
              : "ready";

          errorBox.hidden = !failed;
          if (failed) errorMessage.textContent = status.message;

          if (working) splashArt.working(status.step, status.total);
          else if (failed) splashArt.fail();
          else splashArt.ready();
        }

        function finish() {
          invoke("finish_boot").catch(function (err) {
            console.error(String(err));
          });
        }

        // Guards the handoff so it is only ever armed once, however status
        // first reaches `ready`: via the live listener, via the poll, or
        // both racing each other.
        var handoffArmed = false;

        function armReadyHandoff() {
          if (handoffArmed) return;
          handoffArmed = true;
          // Hold until MIN_VISIBLE_MS has elapsed, but not a moment longer:
          // if boot was already slow enough to clear it, this fires now.
          var remaining = Math.max(0, MIN_VISIBLE_MS - (performance.now() - startedAt));
          window.setTimeout(finish, remaining);
        }

        // Separate from `handoffArmed`: that one guards `finish` itself,
        // this guards *entering* the finalizing hold, and they cannot share
        // a flag. `armReadyHandoff` sets its guard only once the hold is
        // already over, so if both the live listener and the poll saw
        // `ready` and this reused that flag, the second caller would read
        // it as still unarmed and start a second hold on top of the first.
        var finalizeStarted = false;

        // The one state transition `render` cannot make on its own: boot.rs
        // never reports it, so it is driven from here rather than folded
        // into `render`'s `status.phase` branches.
        function handleReady() {
          if (finalizeStarted) return;
          finalizeStarted = true;

          bar.setAttribute("aria-valuenow", String(FINALIZE_PROGRESS));
          count.textContent = pad(lastTotal) + "/" + pad(lastTotal);
          step.textContent = "finalizing";
          splashArt.finalizing();

          window.setTimeout(function () {
            render({ phase: "ready" });
            armReadyHandoff();
          }, FINALIZE_HOLD_MS);
        }

        // `failed` is deliberately never auto-finished: the user should
        // get a chance to read why before being dropped into the main
        // window, so it waits on this button instead.
        continueButton.addEventListener("click", finish);

        /*
         * Tauri events are not replayed: if boot reports `Ready` before the
         * listener below is registered, that event is simply gone. Polling
         * `boot_status` closes that gap, but its response can also land
         * *after* a live event has already moved things forward, and
         * applying it then would overwrite newer data with older. This flag
         * is the guard. Status only ever moves forward (working, then
         * exactly one of ready/failed), so "has a live event arrived at
         * all" is enough to tell stale from current.
         */
        var liveEventReceived = false;

        // The poll is chained off `listen`'s promise rather than fired
        // alongside it, and that is the point: `listen` is itself an async
        // IPC call that resolves only once the listener is registered on
        // the Rust side. Polling before then would leave a window in which
        // an event could fire and be missed by both paths.
        listen("boot:status", function (event) {
          liveEventReceived = true;
          // `ready` goes through `handleReady`'s finalizing hold instead of
          // straight to `render`: see that function for why.
          if (event.payload.phase === "ready") return handleReady();
          render(event.payload);
        })
          .then(function () {
            return invoke("boot_status");
          })
          .then(function (polled) {
            if (liveEventReceived) return;
            // Boot may have finished before this window even loaded. Routing
            // through `handleReady` here too is what stops that case sitting
            // untouched until the watchdog in boot.rs forces the handoff ten
            // seconds later: it still gets its finalizing hold either way.
            if (polled.phase === "ready") return handleReady();
            render(polled);
          })
          .catch(function (err) {
            console.error(String(err));
          });
      })();
    </script>
  </body>
</html>
