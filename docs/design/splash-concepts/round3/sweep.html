    <title>OpenKaava</title>
    <!--
      This file is deliberately standalone: no imports, no build step, no
      shared modules, no coupling of any kind to the rest of the application.
      The product name and the wordmark below are written out here, and
      `scripts/check-branding.mjs` fails `pnpm lint` if either stops agreeing
      with branding.toml.

      Everything the window needs is inlined, so the markup below IS the
      finished screen and the first window can paint before anything else in
      the app has loaded:
        - the styles, with the token values copied literally out of
          src/tokens.css under the same names (this file cannot @import it;
          that would be a request, and a dependency)
        - the art, drawn on a canvas by the `splash-art` script below (Sweep;
          it needs no image, so there is no request for one)
        - the mark, as an inline svg
        - the typefaces, as base64 woff2 subsets (see @font-face)
        - the boot logic, as a plain non-module script at the bottom

      The cost is that the token values here are copies. If a token in
      src/tokens.css changes, change it here too: src/splash/splash.test.ts
      compares the two and fails `pnpm test` on any difference.
    -->
    <!--
      Theme and accent, read before first paint. The shell mirrors the two
      appearance settings into localStorage (src/shell/settings/
      splashAppearance.ts) and this window shares that origin, so a stored
      value is available synchronously with no IPC round-trip. Nothing stored
      (a first launch) leaves the neutral palette in the CSS below. The test
      in src/splash/splash.test.ts runs this script, so the key and the value
      shape are checked against the writer.
    -->
    <script id="splash-appearance">
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem("kaava.splash-appearance"));
          var root = document.documentElement;
          var theme = stored.theme;
          if (theme === "system") {
            theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          if (theme === "light") root.dataset.theme = "light";
          if (/^(amber|blue|green|violet|coral)$/.test(stored.accent)) {
            root.dataset.accent = stored.accent;
          }
        } catch (err) {
          /* unset or unreadable: the neutral defaults stand */
        }
      })();
    </script>
    <!-- CONCEPT ONLY: stripped when this ships. Paste verbatim into <head>, directly after
         <script id="splash-appearance">, before any other script. -->
    <script id="concept-demo">
      (function () {
        window.__conceptErrors = [];
        window.addEventListener("error", function (e) {
          window.__conceptErrors.push(String(e.message) + " @" + e.lineno);
        });
        if (window.__TAURI__) return;
        var q = new URLSearchParams(location.search);
        var demo = q.get("demo");
        if (!demo) return;
        var root = document.documentElement;
        if (q.get("theme") === "light") root.dataset.theme = "light";
        if (q.get("accent")) root.dataset.accent = q.get("accent");
        var total = +(q.get("total") || 5);
        var stop = +(q.get("step") || 2);
        var labels = [
          "Locating manifest",
          "Reading manifest",
          "Scanning checkouts",
          "Starting Home and Files",
          "Starting Files",
        ];
        var events = [];
        var t = 300;
        var last = demo === "working" || demo === "failed" ? stop : total;
        for (var s = 1; s <= last; s++) {
          events.push([t, { phase: "working", step: s, total: total, label: labels[(s - 1) % labels.length] }]);
          t += 700;
        }
        if (demo === "ready" || demo === "cycle") events.push([t, { phase: "ready" }]);
        if (demo === "failed") {
          events.push([
            t,
            {
              phase: "failed",
              message: "Could not read C:\\Users\\dev\\projects\\saas\\kaava.toml: expected `=` at line 12",
            },
          ]);
        }
        window.__TAURI__ = {
          app: {
            getVersion: function () {
              return Promise.resolve("0.6.1");
            },
          },
          core: {
            invoke: function (cmd) {
              return Promise.resolve(
                cmd === "boot_status" ? { phase: "working", step: 0, total: total, label: "Starting…" } : null,
              );
            },
          },
          event: {
            listen: function (name, fn) {
              events.forEach(function (e) {
                setTimeout(function () {
                  fn({ payload: e[1] });
                }, e[0]);
              });
              return Promise.resolve(function () {});
            },
          },
        };
      })();
    </script>
    <style>
      /*
       * Four faces, each subset so it can be inlined (a linked font resolves
       * after first paint, and the text would reflow into it). Regenerate with
       * `pyftsubset <fontsource woff2> --unicodes=<range> --flavor=woff2`:
       *
       *   Inter 600          U+0041-005A, U+0061-007A  the wordmark, plus U+2122
       *   Inter 500          U+0020-007E, U+00A9, U+00B7, U+2122, U+2026  Veistra, the version, the button

       *   IBM Plex Mono 500  U+0020-007E, U+00A9, U+00B7, U+2014, U+2122  the step label and error text

      /*
       * Tokens, copied from src/tokens.css under the same names. Only the ones
       * this file reads are here; src/splash/splash.test.ts fails if any of
       * them drifts from tokens.css, so a stale copy is caught by `pnpm test`
       * rather than noticed on a launch.
       */
      :root {
        color-scheme: dark;

        --bg-canvas: #0f0f10;
        --bg-surface-1: #141415;
        --bg-layer-1: #181a1b;
        --border-subtle: #222425;
        --border-subtle-1: #2c2e30;
        --border-strong: #36393a;
        --border-strong-1: #45484a;

        --txt-primary: #e4e6e6;
        --txt-secondary: #cacdce;
        --txt-tertiary: #afb3b6;
        --txt-danger: #f4a49c;
        --danger: #e5534b;

        --accent-amber: #d98a3f;
        --accent-blue: #3f76ff;
        --accent-green: #4cb863;
        --accent-violet: #a585f0;
        --accent-coral: #e5736b;

        --sans: Inter, "Inter Variable", system-ui, "Segoe UI", sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

        --radius-md: 6px;
        --radius-xl: 12px;
        --shadow-overlay: 0 12px 32px -6px rgba(0, 0, 0, 0.6), 0 2px 6px rgba(0, 0, 0, 0.3);
        --control-md: 28px;
        --focus-ring: 2px solid color-mix(in srgb, var(--accent) 45%, transparent);
        --focus-ring-offset: 2px;

        /* Not a token: what the accent means for the splash's own parts.
           Neutral until the head script has found a stored accent, so a first
           launch is never drawn in a colour the user did not pick. */
        --accent: var(--txt-primary);
      }

      :root[data-theme="light"] {
        color-scheme: light;

        --bg-canvas: #f2f2f3;
        --bg-surface-1: #ffffff;
        --bg-layer-1: #f9f9f9;
        --border-subtle: #eaebec;
        --border-subtle-1: #e1e2e3;
        --border-strong: #d5d7d9;
        --border-strong-1: #cacdcf;

        --txt-primary: #0f0f10;
        --txt-secondary: #313435;
        --txt-tertiary: #494d50;
        --txt-danger: #9c231b;
        --danger: #bf2c22;

        --accent-amber: #a85a14;
        --accent-blue: #2f62e0;
        --accent-green: #23803b;
        --accent-violet: #6c47c9;
        --accent-coral: #b8392f;
      }

      /* The accent. Neutral (the text colour) until the head script finds a
         stored one. The art and the progress segments both read it. */
      :root[data-accent="amber"] {
        --accent: var(--accent-amber);
      }
      :root[data-accent="blue"] {
        --accent: var(--accent-blue);
      }
      :root[data-accent="green"] {
        --accent: var(--accent-green);
      }
      :root[data-accent="violet"] {
        --accent: var(--accent-violet);
      }
      :root[data-accent="coral"] {
        --accent: var(--accent-coral);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      /* Transparent, not a colour: the window is transparent too, so the
         desktop shows through everywhere except the card below. Any fill
         here would be the square backing the rounded card is meant to
         remove. */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      /* The window is 72px larger than the card in each direction, and this
         padding is that gutter: room for the shadow to fall on transparent
         pixels instead of being clipped at the window edge. */
      body {
        padding: 36px;
      }

      /* The window is transparent and undecorated (see tauri.conf.json), so
         this card IS the visible window: the app window's radius, the
         hairline border and the overlay shadow are drawn here, anti-aliased
         by the compositor. The clip on `overflow` rounds the canvas.

         One measure runs through the whole composition: 33px. It is the
         field's inset on three sides, the lockup's left and top, and the
         footer's side padding, so every edge in the card lines up with a
         column or row of tiles. The art script holds the same numbers. */
      .splash {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg-surface-1);
        border: 1px solid var(--border-subtle-1);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-overlay);
        color: var(--txt-primary);
        font-family: var(--sans);
      }

      /* The mosaic. It is also the progress bar: its dithered front is how
         far boot has got. */
      .splash__field {
        position: absolute;
        inset: 0;
      }

      .splash__art {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* Sits in the clearing the art leaves in the field's top-left corner. */
      .splash__lockup {
        position: absolute;
        left: 33px;
        top: 33px;
        display: flex;
        align-items: center;
        gap: 14px;
      }

      /* The one large tile among the small ones: the reference's solid white
         thumb, carrying the mark as a cut-out. */
      .splash__logo {
        display: grid;
        place-items: center;
        flex: none;
        width: 44px;
        height: 44px;
        border-radius: 11px;
        background: var(--accent);
        color: var(--bg-surface-1);
      }

      .splash__logo svg {
        display: block;
        width: 31px;
        height: 31px;
      }

      .splash__names {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .splash__wordmark {
        margin: 0;
        font-family: var(--sans);
        font-size: 28px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.012em;
        color: var(--txt-primary);
      }

      .splash__rule {
        flex: none;
        width: 1px;
        height: 22px;
        background: var(--border-strong-1);
      }

      .splash__maker {
        margin: 0;
        font-family: var(--sans);
        font-size: 14px;
        font-weight: 500;
        line-height: 1;
        letter-spacing: 0.02em;
        color: var(--txt-tertiary);
      }

      /* Legal on the left, the step on the right, one hairline above both.
         The mosaic never reaches this band, so the small text always sits on
         a flat surface. */
      .splash__footer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 54px;
        padding: 0 33px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        border-top: 1px solid var(--border-subtle);
      }

      .splash__legal {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
      }

      .splash__legal p {
        margin: 0;
        font-size: 11px;
        line-height: 14px;
        white-space: nowrap;
      }

      /* The slot is reserved (min-height) so the version arriving does not
         move the line under it. */
      .splash__version {
        min-height: 14px;
        font-weight: 500;
        color: var(--txt-secondary);
        opacity: 0;
        transition: opacity 240ms;
      }

      .splash__version[data-ready] {
        opacity: 1;
      }

      .splash__copyright {
        font-weight: 400;
        color: var(--txt-tertiary);
      }

      .splash__step {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
        margin: 0;
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        line-height: 1;
        text-align: right;
        text-transform: lowercase;
        white-space: nowrap;
        color: var(--txt-tertiary);
      }

      /* One more tile, drawn in the accent, or in danger when boot has failed. */
      .splash__step::before {
        content: "";
        flex: none;
        width: 5px;
        height: 5px;
        border-radius: 1.5px;
        background: var(--accent);
      }

      .splash[data-phase="failed"] .splash__step {
        color: var(--danger);
      }

      .splash[data-phase="failed"] .splash__step::before {
        background: var(--danger);
      }

      /* Under the lockup, on the side of the stopped front that the art picks
         (data-side), so the front stays in view beside it. */
      .splash__error {
        position: absolute;
        left: 33px;
        top: 112px;
        width: 270px;
      }

      .splash__error[data-side="right"] {
        left: auto;
        right: 33px;
      }

      /* A panel rather than bare text: the message has to stay legible over
         the art. */
      .splash__error-panel {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 16px 18px 18px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-xl);
        background: color-mix(in srgb, var(--bg-surface-1) 94%, transparent);
      }

      .splash__error-title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        line-height: 1;
        color: var(--txt-primary);
      }

      .splash__error-title::before {
        content: "";
        flex: none;
        width: 5px;
        height: 5px;
        border-radius: 1.5px;
        background: var(--danger);
      }

      .splash__error-message {
        margin: 0;
        max-height: 88px;
        overflow-y: auto;
        overflow-wrap: anywhere;
        text-align: left;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.45;
        color: var(--txt-danger);
      }

      /* The design system's secondary button: layer fill, strong border. */
      .splash__continue {
        height: var(--control-md);
        padding: 0 12px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-md);
        background: var(--bg-layer-1);
        color: var(--txt-primary);
        font-family: var(--sans);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }

      .splash__continue:hover {
        border-color: var(--border-strong-1);
      }

      .splash__continue:focus-visible {
        outline: var(--focus-ring);
        outline-offset: var(--focus-ring-offset);
      }

      @media (prefers-reduced-motion: reduce) {
        .splash__version {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash" data-phase="working">
      <div
        class="splash__field"
        role="progressbar"
        aria-label="Startup"
        aria-valuemin="0"
        aria-valuemax="1"
        aria-valuenow="0"
      >
        <canvas class="splash__art" aria-hidden="true"></canvas>
      </div>

      <div class="splash__lockup">
        <i class="splash__logo" id="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path
              fill="currentColor"
              d="M12 2.4c3.3 0 7 4.2 7 10.1 0 4.8-3.1 9.1-7 9.1s-7-4.3-7-9.1C5 6.6 8.7 2.4 12 2.4zm0 8.4a2.9 2.9 0 1 0 0 5.8 2.9 2.9 0 0 0 0-5.8z"
            />
          </svg>
        </i>
        <div class="splash__names">
          <p class="splash__wordmark">OpenKaava</p>
          <span class="splash__rule" aria-hidden="true"></span>
          <p class="splash__maker">Veistra™</p>
        </div>
      </div>

      <div class="splash__error" hidden>
        <div class="splash__error-panel">
          <p class="splash__error-title">Startup failed</p>
          <p class="splash__error-message"></p>
          <button type="button" class="splash__continue">Continue anyway</button>
        </div>
      </div>

      <div class="splash__footer">
        <div class="splash__legal">
          <p class="splash__version"></p>
          <p class="splash__copyright">© 2026 Firelight Innovations. All rights reserved.</p>
        </div>
        <p class="splash__step">starting</p>
      </div>
    </div>

    <script id="splash-art">
      /*
       * Sweep. The card is a field of small rounded tiles on a 6px grid, and
       * boot progress is the front of that field: tiles are dithered in from
       * left to right, sparse and dim where it starts and dense and bright
       * where it ends. Behind the front the field is unlit, drawn as a faint
       * ghost, so the whole mosaic is legible from the first frame and boot
       * visibly fills it in. Tiles flash as the front crosses them, and a few
       * keep twinkling while it passes. Ready runs the front off the right
       * edge, where it condenses into one solid bar. Failure freezes the front
       * where it stopped and draws that column, and the tiles around it, in
       * danger.
       *
       * Nothing here talks to Tauri. The boot script calls the four methods on
       * `splashArt` and this file owns the clock: the front moves at a capped
       * speed toward whatever boot last reported, so statuses that arrive late
       * or all at once still play out as a sweep rather than a jump.
       */
      var splashArt = (function () {
        "use strict";

        var canvas = document.querySelector(".splash__art");
        var ctx = canvas && canvas.getContext ? canvas.getContext("2d") : null;
        var reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

        // Geometry, in CSS px. INSET, FOOT and the lockup's clearing mirror the CSS above.
        var PITCH = 6; // one grid cell
        var TILE = 3; // the tile drawn inside it
        var INSET = 33;
        var FOOT = 54;
        var FOOT_GAP = 28; // clear space between the last row and the footer rule
        var CLEAR_X = 350; // the lockup's clearing ends here (a rounded corner of CLEAR_R) and falls off over FALL
        var CLEAR_Y = 96;
        var CLEAR_R = 30;
        var FALL = 52;
        var FRONT_W = 72; // how far the dithered front is smeared
        var EDGE = 56; // how far behind the front tiles still twinkle
        var LV = 24; // brightness levels per palette

        // Timing, in seconds.
        var V_MAX = 0.4; // field widths per second, at most
        var FLASH_S = 2.4; // after this a tile is at rest
        var RES_S = 0.8; // the bar growing at ready
        var FAIL_S = 0.8;
        // A slow boot holds the front still. The shimmer keeps it alive for this long, which is
        // beyond boot.rs's 10s watchdog, so it can never outlive the window it decorates.
        var IDLE_MAX = 12;

        function c01(x) {
          return x < 0 ? 0 : x > 1 ? 1 : x;
        }
        function smooth(x) {
          x = c01(x);
          return x * x * (3 - 2 * x);
        }
        function out3(x) {
          return 1 - Math.pow(1 - c01(x), 3);
        }
        function fract(x) {
          return x - Math.floor(x);
        }
        function mulberry(a) {
          return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        /* ---- colour ---- */
        function parseColor(s, fallback) {
          s = (s || "").trim();
          var m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(s);
          if (m) {
            var h = m[1];
            if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
            return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
          }
          m = /^rgba?\(\s*(\d+)[\s,]+(\d+)[\s,]+(\d+)/.exec(s);
          return m ? [+m[1], +m[2], +m[3]] : fallback;
        }
        function mix(a, b, t) {
          return [
            Math.round(a[0] + (b[0] - a[0]) * t),
            Math.round(a[1] + (b[1] - a[1]) * t),
            Math.round(a[2] + (b[2] - a[2]) * t),
          ];
        }
        function rgba(c, a) {
          return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a.toFixed(3) + ")";
        }
        function palette() {
          var root = document.documentElement;
          var cs = window.getComputedStyle ? window.getComputedStyle(root) : null;
          function get(name, fallback) {
            return parseColor(cs ? cs.getPropertyValue(name) : "", fallback);
          }
          var ink = get("--txt-primary", [228, 230, 230]);
          return {
            light: root.getAttribute("data-theme") === "light",
            ink: ink,
            // Neutral until the head script has found a stored accent: --accent is then the text colour.
            accent: get("--accent", ink),
            danger: get("--danger", [229, 83, 75]),
          };
        }

        /* ---- tiles ---- */
        var d = 1; // device pixels per CSS px
        var cw = 0;
        var ch = 0;
        var tile = TILE;
        var cols = 0;
        var rows = 0;
        var fx0 = 0; // the field, CSS px
        var fy0 = 0;
        var fw = 0;
        var fh = 0;
        var P = null;
        var flat = []; // style strings, the fallback when no atlas can be made
        var atlas = null; // row 0 accent levels, row 1 danger levels, row 2 the ghost
        var ghost = null; // every tile at rest, drawn once

        // Per tile, sorted by the position at which the front lights it.
        var N = 0;
        var tx = null; // device px
        var ty = null;
        var tc = null; // column
        var tk = null; // resting level
        var ta = null; // arrival, CSS px
        var tf = null; // 1 sparkles when lit, 2 twinkles at the front
        var tp = null; // phase
        var ton = null; // the art clock at which it was lit

        function ign(c, r) {
          // Interleaved gradient noise: an even, blue-ish scatter, so dithering reads as texture
          // rather than clumps.
          return fract(52.9829189 * fract(0.06711056 * c + 0.00583715 * r));
        }

        /* The lockup's clearing: 0 inside it, 1 beyond its fall-off. */
        function clearing(cx, cy) {
          var dx = Math.max(0, cx - (CLEAR_X - CLEAR_R));
          var dy = Math.max(0, cy - (CLEAR_Y - CLEAR_R));
          return smooth((Math.sqrt(dx * dx + dy * dy) - CLEAR_R) / FALL);
        }

        function round(g, x, y, w, h, r) {
          g.beginPath();
          if (g.roundRect) g.roundRect(x, y, w, h, r);
          else g.rect(x, y, w, h);
          g.fill();
        }

        function makeAtlas() {
          P = palette();
          var i;
          flat = [[], [], []];
          var hotMax = P.light ? 0.4 : 0.62;
          for (i = 0; i < LV; i++) {
            var u = i / (LV - 1);
            // Alpha carries brightness; the top levels also shift toward the text colour, which is
            // what makes the dense end read as lit rather than merely opaque.
            var a = P.light ? 0.2 + 0.7 * Math.pow(u, 0.95) : 0.22 + 0.78 * Math.pow(u, 0.95);
            var hot = Math.pow(Math.max(0, (u - 0.5) / 0.5), 1.4) * hotMax;
            flat[0][i] = rgba(mix(P.accent, P.ink, hot), a);
            flat[1][i] = rgba(mix(P.danger, P.ink, hot * 0.5), a);
          }
          flat[2][0] = rgba(P.ink, P.light ? 0.1 : 0.125);
          atlas = null;
          try {
            var cv = document.createElement("canvas");
            cv.width = LV * tile;
            cv.height = 3 * tile;
            var g = cv.getContext("2d");
            if (g) {
              var rad = Math.max(0.8, tile * 0.3);
              for (var row = 0; row < 3; row++) {
                for (i = 0; i < (row === 2 ? 1 : LV); i++) {
                  g.fillStyle = flat[row][i];
                  round(g, i * tile, row * tile, tile, tile, rad);
                }
              }
              atlas = cv;
            }
          } catch (err) {
            atlas = null;
          }
        }

        function blit(g, row, k, x, y) {
          if (atlas) g.drawImage(atlas, k * tile, row * tile, tile, tile, x, y, tile, tile);
          else {
            g.fillStyle = flat[row][k];
            g.fillRect(x, y, tile, tile);
          }
        }

        // Where a column or row starts, in device px, with the tile centred in its cell.
        function colX(c) {
          return Math.round((fx0 + c * PITCH) * d + (PITCH * d - tile) / 2);
        }
        function rowY(r) {
          return Math.round((fy0 + r * PITCH) * d + (PITCH * d - tile) / 2);
        }

        function build() {
          var cssW = canvas.clientWidth;
          var cssH = canvas.clientHeight;
          d = Math.min(window.devicePixelRatio || 1, 2);
          cw = Math.max(0, Math.round(cssW * d));
          ch = Math.max(0, Math.round(cssH * d));
          canvas.width = cw;
          canvas.height = ch;
          tile = Math.max(1, Math.round(TILE * d));
          cols = Math.max(0, Math.floor((cssW - INSET * 2) / PITCH));
          rows = Math.max(0, Math.floor((cssH - INSET - FOOT - FOOT_GAP) / PITCH));
          fw = cols * PITCH;
          fh = rows * PITCH;
          fx0 = (cssW - fw) / 2;
          fy0 = INSET;
          makeAtlas();

          // A fixed seed: the arrangement is part of the identity, so it is the same on every launch.
          var rnd = mulberry(20260);
          var GX = 8;
          var GY = 5;
          var grid = [];
          var gi;
          for (gi = 0; gi < GX * GY; gi++) grid.push(rnd());
          // Value noise over the field, so density clumps a little instead of banding by column.
          function vnoise(u, v) {
            var x = u * (GX - 1);
            var y = v * (GY - 1);
            var x0 = Math.min(GX - 2, Math.floor(x));
            var y0 = Math.min(GY - 2, Math.floor(y));
            var sx = smooth(x - x0);
            var sy = smooth(y - y0);
            var a = grid[y0 * GX + x0] * (1 - sx) + grid[y0 * GX + x0 + 1] * sx;
            var b = grid[(y0 + 1) * GX + x0] * (1 - sx) + grid[(y0 + 1) * GX + x0 + 1] * sx;
            return a * (1 - sy) + b * sy;
          }

          var cells = [];
          for (var r = 0; r < rows; r++) {
            for (var c = 0; c < cols; c++) {
              // Drawn for every cell, present or not, so tuning the density never reshuffles the rest.
              var jit = rnd();
              var rb = rnd();
              var rs = rnd();
              var rw = rnd();
              var rp = rnd();
              var rt = rnd();
              var u = (c + 0.5) / cols;
              var cx = fx0 + (c + 0.5) * PITCH;
              var cy = fy0 + (r + 0.5) * PITCH;
              // Sparse and dim at the left, dense at the right; the noise fades out toward the dense end.
              var dens = 0.06 + 0.94 * Math.pow(u, 1.3);
              dens *= 1 + (vnoise(u, (r + 0.5) / rows) - 0.5) * 0.9 * (1 - u * u * u);
              dens = Math.min(0.97, dens) * clearing(cx, cy);
              if (fract(ign(c, r) + (jit - 0.5) * 0.4) >= dens) continue;
              var b = 0.08 + 0.66 * Math.pow(u, 0.9) + (rb - 0.5) * 0.46;
              var spark = rs < 0.05;
              if (spark) b = 0.84 + 0.16 * rb;
              cells.push({
                c: c,
                x: colX(c),
                y: rowY(r),
                k: Math.max(0, Math.min(LV - 1, Math.round(c01(b) * (LV - 1)))),
                // The front is smeared and wobbles with height, so it is never a ruler line.
                a: cx + (rw - 0.5) * FRONT_W + Math.sin(cy * 0.045) * 7,
                f: (spark ? 1 : 0) | (rt < 0.34 ? 2 : 0),
                p: rp * 6.283,
              });
            }
          }
          cells.sort(function (m, n) {
            return m.a - n.a;
          });
          N = cells.length;
          tx = new Int16Array(N);
          ty = new Int16Array(N);
          tc = new Int16Array(N);
          tk = new Uint8Array(N);
          ta = new Float32Array(N);
          tf = new Uint8Array(N);
          tp = new Float32Array(N);
          ton = new Float32Array(N);
          for (var i = 0; i < N; i++) {
            var q = cells[i];
            tx[i] = q.x;
            ty[i] = q.y;
            tc[i] = q.c;
            tk[i] = q.k;
            ta[i] = q.a;
            tf[i] = q.f;
            tp[i] = q.p;
          }

          ghost = null;
          try {
            var gv = document.createElement("canvas");
            gv.width = cw;
            gv.height = ch;
            var gx = gv.getContext("2d");
            if (gx) {
              for (i = 0; i < N; i++) blit(gx, 2, 0, tx[i], ty[i]);
              ghost = gv;
            }
          } catch (err2) {
            ghost = null;
          }
        }

        /* ---- state ---- */
        var te = 0; // art clock, seconds
        var phase = "working";
        var target = 0.06; // what boot has reported, as a fraction of the field
        var prog = 0; // where the front is
        var vel = 0;
        var lit = 0; // how many tiles, in arrival order, the front has passed
        var res = 0; // the bar at ready
        var fk = 0; // the failure ramp
        var lastEvent = 0;

        function frontPx() {
          return fx0 - FRONT_W / 2 - 8 + prog * (fw + FRONT_W + 16);
        }

        /* Light every tile the front has passed. `stamp` is when, for the flash. */
        function advance(stamp) {
          var f = frontPx();
          while (lit < N && ta[lit] <= f) {
            ton[lit] = stamp;
            lit++;
          }
        }

        /* ---- drawing ---- */
        function draw() {
          if (!ctx) return;
          var i;
          ctx.clearRect(0, 0, cw, ch);
          if (ghost) ctx.drawImage(ghost, 0, 0);
          else for (i = 0; i < N; i++) blit(ctx, 2, 0, tx[i], ty[i]);

          var top = LV - 1;
          var fpx = frontPx();
          var fcol = Math.floor((fpx - fx0) / PITCH);
          var tw = 1 - Math.max(res, fk); // the twinkle gives way as the field resolves
          var lift = 0.1 * res;
          var dim = 1 - 0.28 * fk;
          // The ready bar sits over the last column, so the tiles it covers are not drawn under it.
          var barW = Math.max(2, Math.round(5 * d));
          var barH = Math.round(fh * d * out3(res));
          var barX = Math.round((fx0 + fw - PITCH / 2) * d - barW / 2);
          var barY = Math.round((fy0 + fh / 2) * d - barH / 2);
          ctx.globalAlpha = dim;
          for (i = 0; i < lit; i++) {
            if (res > 0 && tc[i] === cols - 1 && ty[i] >= barY && ty[i] + tile <= barY + barH) continue;
            var age = te - ton[i];
            var kf = tk[i];
            if (age < FLASH_S) {
              kf += (top - kf) * Math.exp(-age / 0.32);
              if (tf[i] & 1) kf += (top - kf) * 0.75 * Math.max(0, Math.sin(age * 9 + tp[i])) * Math.exp(-age / 1.1);
            }
            if (tw > 0) {
              // The head: tiles just behind the front glow, and a third of them keep twinkling.
              var prox = 1 - (fpx - ta[i]) / EDGE;
              if (prox > 0) {
                kf += (top - kf) * 0.42 * prox * prox * tw;
                if (tf[i] & 2) kf += (top - kf) * 0.55 * prox * tw * (0.5 + 0.5 * Math.sin(te * 5.2 + tp[i] * 7));
              }
            }
            if (lift) kf += (top - kf) * lift;
            var k = Math.max(0, Math.min(top, Math.round(kf)));
            if (fk > 0 && tc[i] > fcol - 6) {
              ctx.globalAlpha = dim * (1 - fk);
              blit(ctx, 0, k, tx[i], ty[i]);
              ctx.globalAlpha = dim * fk;
              blit(ctx, 1, k, tx[i], ty[i]);
              ctx.globalAlpha = dim;
            } else {
              blit(ctx, 0, k, tx[i], ty[i]);
            }
          }
          ctx.globalAlpha = 1;

          // Failure: the column where the front stopped, in danger.
          if (fk > 0 && cols > 0) {
            var col = Math.max(0, Math.min(cols - 1, fcol));
            // Two rows past the field's last, so the mark still shows below a panel that covers
            // the column itself.
            for (var r = 0; r < rows + 2; r++) {
              if (r < rows && clearing(fx0 + (col + 0.5) * PITCH, fy0 + (r + 0.5) * PITCH) < 0.65) continue;
              ctx.globalAlpha = fk;
              blit(ctx, 1, top, colX(col), rowY(r));
              if (col > 0 && r < rows) {
                ctx.globalAlpha = fk * 0.5;
                blit(ctx, 1, 12, colX(col - 1), rowY(r));
              }
            }
            ctx.globalAlpha = 1;
          }

          // Ready: the front condenses into one solid bar in the last column.
          if (res > 0 && cols > 0 && rows > 0) {
            ctx.fillStyle = rgba(mix(P.accent, P.ink, P.light ? 0.35 : 0.55), 1);
            round(ctx, barX, barY, barW, barH, barW / 2);
          }
        }

        /* ---- the clock ---- */
        var running = false;
        var last = 0;
        var lastDraw = 0;

        function flashing() {
          return lit > 0 && te - ton[lit - 1] < FLASH_S;
        }

        function busy() {
          if (flashing()) return true;
          if (phase === "failed") return fk < 1 || vel > 0.001;
          if (prog < target - 0.0005) return true;
          return phase === "ready" && res < 1;
        }

        function shimmer() {
          return phase === "working" && te - lastEvent < IDLE_MAX;
        }

        function step(dt) {
          te += dt;
          if (phase === "failed") {
            vel += (0 - vel) * Math.min(1, dt * 10);
            prog = Math.min(1, prog + vel * dt);
            fk = Math.min(1, fk + dt / FAIL_S);
          } else {
            // A boot that has been ready for a while is running out of the splash's minimum time:
            // stop being leisurely about the last stretch.
            var vmax = phase === "ready" && te > 2.5 ? 1 : V_MAX;
            var want = Math.min(vmax, Math.max(0.12, (target - prog) * 2.6));
            if (prog >= target) want = 0;
            vel += (want - vel) * Math.min(1, dt * 6);
            prog = Math.min(target, prog + vel * dt);
            if (target - prog < 0.0008) {
              prog = target;
              vel = 0;
            }
            if (phase === "ready" && prog >= 0.92) res = Math.min(1, res + dt / RES_S);
          }
          advance(te);
        }

        function frame(now) {
          // Clamped: a hidden window stops delivering frames, and the first one back must not
          // teleport the animation to its end.
          var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
          last = now;
          step(dt);
          var b = busy();
          var s = !b && shimmer();
          // Resting on the shimmer alone is throttled to ~20 frames a second; anything moving, and
          // the last frame before stopping, draws every time.
          if (b || !s || now - lastDraw >= 48) {
            draw();
            lastDraw = now;
          }
          if (b || s) {
            requestAnimationFrame(frame);
          } else {
            running = false;
            last = 0;
          }
        }

        function kick() {
          if (!ctx) return;
          if (reduce) {
            // Still but progressive: every state is drawn once, already seated.
            if (phase !== "failed") prog = target;
            res = phase === "ready" ? 1 : 0;
            fk = phase === "failed" ? 1 : 0;
            advance(-1000);
            draw();
            return;
          }
          if (running) return;
          running = true;
          last = 0;
          requestAnimationFrame(frame);
        }

        function init() {
          if (!canvas) return;
          build();
          advance(-1000);
          window.addEventListener("resize", function () {
            build();
            lit = 0;
            advance(-1000);
            draw();
          });
          draw();
          kick();
        }
        init();

        function report(fraction) {
          if (phase !== "working") return;
          target = Math.max(target, fraction);
          lastEvent = te;
          kick();
        }

        return {
          /** Boot is at `step` of `total`. */
          working: function (step, total) {
            report(0.06 + 0.84 * c01(step / Math.max(1, total)));
          },
          /** Boot is done and the splash is holding a beat before ready. */
          finalizing: function () {
            report(0.95);
          },
          ready: function () {
            if (phase !== "working") return;
            phase = "ready";
            target = 1;
            kick();
          },
          fail: function () {
            if (phase === "failed") return;
            phase = "failed";
            // The message panel goes on whichever side leaves the stopped front in view: right of
            // it while the front is still near the left, left of it once the front is past.
            var panel = document.querySelector(".splash__error");
            if (panel) panel.setAttribute("data-side", frontPx() + vel * 0.1 * (fw + FRONT_W) < 250 ? "right" : "left");
            kick();
          },
        };
      })();
    </script>

    <script>
      /*
       * A plain script, not `type="module"`: a module is deferred and
       * fetched as a separate resource even when it imports nothing, and
       * this needs neither. Nothing here is transformed by Vite.
       *
       * The Tauri API is reached through `window.__TAURI__`, which requires
       * `app.withGlobalTauri: true` in tauri.conf.json. That global is
       * injected by the Tauri runtime as an initialisation script, so it is
       * already present before this runs and costs no request, unlike
       * `import { invoke } from "@tauri-apps/api/core"`, which would drag
       * the bundler back in and put this window's startup behind a module
       * graph again.
       */
      (function () {
        "use strict";

        /*
         * Minimum time the splash stays up, no matter how fast boot
         * finishes. This holds back only the *handoff*: the Rust-side work
         * in boot.rs runs at full speed either way and is usually done well
         * before this timer is.
         *
         * 5s is deliberately longer than boot ever actually takes. A boot
         * this app can run (a manifest read and a checkout scan) finishes in
         * well under a second on any real machine, so without a floor the
         * splash would read as barely doing anything, which undersells an
         * app that, once handed off to, is not thin. This is the version of
         * that impression that a fast boot earns instead.
         *
         * Kept well clear of `WATCHDOG_TIMEOUT` in boot.rs (10s): that timer
         * force-closes the splash if nothing calls `finish_boot` in time, as
         * a fallback for a frontend that never got the chance to. This timer
         * is the frontend getting that chance; if the two ever converged,
         * the watchdog would start racing the normal path instead of only
         * ever backstopping it.
         */
        var MIN_VISIBLE_MS = 5000;

        /*
         * How long the splash sits at `FINALIZE_PROGRESS` under a "finalizing"
         * label before jumping to the real `Ready` state.
         *
         * `boot::BootStatus` has no phase for this: the moment boot.rs
         * reports `Ready`, it is genuinely done, there is no fourth step
         * running in the background during this hold. It exists for the
         * same reason `MIN_VISIBLE_MS` does: a mosaic that snaps straight from
         * "step 3 of 3" to "ready" reads as though the last stretch of work
         * was skipped rather than finished, even though nothing was
         * actually skipped. This manufactures the beat that a real final
         * step would have taken.
         *
         * It runs *inside* `MIN_VISIBLE_MS`, not on top of it: `handleReady`
         * only calls `armReadyHandoff` after this hold, so the 5s floor is
         * simply measured from a slightly later point. The two never stack.
         */
        var FINALIZE_HOLD_MS = 450;
        var FINALIZE_PROGRESS = 0.95;

        var startedAt = performance.now();

        var errorBox = document.querySelector(".splash__error");
        var errorMessage = document.querySelector(".splash__error-message");
        var continueButton = document.querySelector(".splash__continue");
        var bar = document.querySelector(".splash__field");
        var root = document.querySelector(".splash");
        var step = document.querySelector(".splash__step");
        var versionLine = document.querySelector(".splash__version");
        // The step in flight, kept so a failure can say where it stopped.
        var lastLabel = "starting";

        var tauri = window.__TAURI__;

        /*
         * Absent when this file is opened directly in a browser, which is
         * how its layout gets checked without building the app. Bailing
         * here leaves the static markup above on screen as a preview of the
         * initial state, rather than throwing on the first property access.
         */
        if (!tauri) return;

        var invoke = tauri.core.invoke;
        var listen = tauri.event.listen;

        // The version is a Promise from the runtime; the slot stays empty until it resolves.
        if (tauri.app && typeof tauri.app.getVersion === "function") {
          tauri.app
            .getVersion()
            .then(function (version) {
              versionLine.textContent = "Version " + version;
              versionLine.setAttribute("data-ready", "");
            })
            .catch(function (err) {
              console.error(String(err));
            });
        }

        /** Mirrors `boot::BootStatus`; see src/bindings.ts for the types. */
        function render(status) {
          var working = status.phase === "working";
          var failed = status.phase === "failed";
          var progress = working ? status.step / status.total : status.phase === "ready" ? 1 : 0;

          root.dataset.phase = status.phase;
          bar.setAttribute("aria-valuenow", String(progress));

          // Lowercase and short is the point: the label is a quiet mono line, not a headline.
          // `step 0` is a state boot can report before it starts; it is not a step.
          if (working) lastLabel = status.step > 0 ? status.label : "starting";
          step.textContent = working
            ? lastLabel
            : failed
              ? lastLabel === "starting"
                ? "failed"
                : lastLabel + " · failed"
              : "ready";

          errorBox.hidden = !failed;
          if (failed) errorMessage.textContent = status.message;

          if (working) splashArt.working(status.step, status.total);
          else if (failed) splashArt.fail();
          else splashArt.ready();
        }

        function finish() {
          invoke("finish_boot").catch(function (err) {
            console.error(String(err));
          });
        }

        // Guards the handoff so it is only ever armed once, however status
        // first reaches `ready`: via the live listener, via the poll, or
        // both racing each other.
        var handoffArmed = false;

        function armReadyHandoff() {
          if (handoffArmed) return;
          handoffArmed = true;
          // Hold until MIN_VISIBLE_MS has elapsed, but not a moment longer:
          // if boot was already slow enough to clear it, this fires now.
          var remaining = Math.max(0, MIN_VISIBLE_MS - (performance.now() - startedAt));
          window.setTimeout(finish, remaining);
        }

        // Separate from `handoffArmed`: that one guards `finish` itself,
        // this guards *entering* the finalizing hold, and they cannot share
        // a flag. `armReadyHandoff` sets its guard only once the hold is
        // already over, so if both the live listener and the poll saw
        // `ready` and this reused that flag, the second caller would read
        // it as still unarmed and start a second hold on top of the first.
        var finalizeStarted = false;

        // The one state transition `render` cannot make on its own: boot.rs
        // never reports it, so it is driven from here rather than folded
        // into `render`'s `status.phase` branches.
        function handleReady() {
          if (finalizeStarted) return;
          finalizeStarted = true;

          bar.setAttribute("aria-valuenow", String(FINALIZE_PROGRESS));
          step.textContent = "finalizing";
          splashArt.finalizing();

          window.setTimeout(function () {
            render({ phase: "ready" });
            armReadyHandoff();
          }, FINALIZE_HOLD_MS);
        }

        // `failed` is deliberately never auto-finished: the user should
        // get a chance to read why before being dropped into the main
        // window, so it waits on this button instead.
        continueButton.addEventListener("click", finish);

        /*
         * Tauri events are not replayed: if boot reports `Ready` before the
         * listener below is registered, that event is simply gone. Polling
         * `boot_status` closes that gap, but its response can also land
         * *after* a live event has already moved things forward, and
         * applying it then would overwrite newer data with older. This flag
         * is the guard. Status only ever moves forward (working, then
         * exactly one of ready/failed), so "has a live event arrived at
         * all" is enough to tell stale from current.
         */
        var liveEventReceived = false;

        // The poll is chained off `listen`'s promise rather than fired
        // alongside it, and that is the point: `listen` is itself an async
        // IPC call that resolves only once the listener is registered on
        // the Rust side. Polling before then would leave a window in which
        // an event could fire and be missed by both paths.
        listen("boot:status", function (event) {
          liveEventReceived = true;
          // `ready` goes through `handleReady`'s finalizing hold instead of
          // straight to `render`; see that function for why.
          if (event.payload.phase === "ready") return handleReady();
          render(event.payload);
        })
          .then(function () {
            return invoke("boot_status");
          })
          .then(function (polled) {
            if (liveEventReceived) return;
            // Boot may have finished before this window even loaded. Routing
            // through `handleReady` here too is what stops that case sitting
            // untouched until the watchdog in boot.rs forces the handoff ten
            // seconds later; it still gets its finalizing hold either way.
            if (polled.phase === "ready") return handleReady();
            render(polled);
          })
          .catch(function (err) {
            console.error(String(err));
          });
      })();
    </script>
  </body>
</html>
