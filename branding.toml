# What this product is called, and what it is drawn as.
#
# The source in this repository is open. The names and the marks in this file
# are not: they are trademarks of Firelight Innovations. That position is only
# followable if a fork can strip them in one place instead of by grep, so this
# file — plus `node scripts/check-branding.mjs --list`, which prints every
# surface that has to agree with it — is that one place.
#
# Three things read it:
#
#   src-tauri/src/branding.rs      the product name, embedded at compile time
#   scripts/generate-branding.mjs  emits the frontend's branding module
#   scripts/check-branding.mjs     asserts the surfaces below still agree
#
# `docs/branding.md` is the design note: why the frontend is generated while
# `tauri.conf.json` and the HTML entry points are only checked, and what a fork
# actually has to replace.


# --- What is frozen ----------------------------------------------------------
# Everything below is presentation, and swapping it produces an unbranded build
# that still works. The following names are NOT presentation and must not be
# templated, renamed, or made configurable here, however much they look like
# branding:
#
#   the `kaava.toml` filename          the `kaava-tool://` URL scheme
#   the `.kaava` file extension        the `@openkaava/*` npm scope
#   the `.kaava/` project directory    the crate names
#   the `kaava/*` RPC namespace        `com.firelightinnovations.openkaava`
#     (kaava/painted, kaava/commands,  the OS config directory holding
#      kaava/open, kaava/publish)        projects.json
#                                      the `kaava-<id>` MCP server key
#
# Those are wire formats and on-disk contracts. Renaming one breaks every tool
# repository ever written against this shell and stops existing projects
# opening. A branding system that reaches them is a rename script with a config
# file, which is a different and much worse thing. See `docs/branding.md` §2.


# --- The grammar this file is allowed to use ---------------------------------
# Two of the three readers above are Node scripts, and Node has no TOML parser.
# Rather than take a dependency for a file this size — or hand-roll a parser
# that has to agree with Rust's for the whole of TOML — they read a deliberately
# small grammar: `[table]` headers, `key = "value"` string entries, `#`
# comments, blank lines, and nothing else. Anything further is refused by line
# number instead of guessed at. Keep new entries to plain quoted strings.


[product]

# The name as it is written in prose, window titles and menus. The product is
# OpenKaava, and nothing else. Several surfaces used to append a second word to
# it and disagree with each other about which one — this file exists so that
# question has one answer rather than five.
name = "OpenKaava"

# The same name as the wordmark's text node, in mixed case.
#
# Home's stylesheet uppercases it, so this is what a screen reader is handed:
# "OpenKaava" is a word, where "OPENKAAVA" is nine letters it may spell out. The
# splash sets it as written, in mixed case.
wordmark = "OpenKaava"

# The line under the lockup on Home's hero. Read by nothing else — a tagline
# repeated on a second surface stops being a tagline.
tagline = "The Veistra custom agentic development stack"


[assets]
# Paths are relative to this file. Every one of them is checked to exist, so a
# fork that replaces the art gets told about the entry it missed.

# The mark, as a monochrome silhouette: an avocado, drawn as one outline with
# the seed as a counter inside it. One path in a 24×24 box, and that is a
# requirement rather than a description — the generator lifts the path data out
# of this file into the frontend's branding module so the shell can draw it as
# inline SVG in `currentColor`, and it refuses a file it cannot reduce to one
# path.
#
# The counter only reads as a hole under the default nonzero fill rule because
# the outline is wound clockwise and the seed counter-clockwise. The generator
# lifts `d` and nothing else, so a `fill-rule` attribute on the source would be
# dropped silently and the seed would fill in. Do not rewind the arc flags.
mark = "assets/kaava-mark.svg"

# The same mark in its three tones — dark skin, light flesh, brown seed — with a
# hairline of the background separating each. Three drawables, so the generator
# cannot reduce it and nothing compiles it in; it is for the surfaces big enough
# to carry the colour, which read it as a file or inline it by hand.
#
# Its one reader today is Home's 52px lockup, `Mark` in
# `apps/home/ui/src/icons.tsx`, which inlines this geometry by hand so the two
# hairlines can be `var(--bg)` rather than a fixed hex. Everything smaller — the
# 15px title-bar glyph, the shared tool placeholder, the 34px mark inside the
# splash ring — stays on `mark` above and inherits its `currentColor`.
mark-colour = "assets/kaava-mark-colour.svg"

# What the installer and taskbar icons are drawn from. Its reader is a person
# running `pnpm tauri icon assets/app-icon-source.svg`, which rewrites the PNG
# set below; nothing at build time touches it.
icon-source = "assets/app-icon-source.svg"

# The directory holding that generated PNG set. `tauri.conf.json`'s
# `bundle.icon` list is checked against it — every entry has to resolve inside
# this directory and exist on disk, so an icon dropped from the set fails the
# lint rather than the installer.
bundle-icons = "src-tauri/icons"
