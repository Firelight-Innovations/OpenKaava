<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agents</title>
    <!--
      The palette, linked rather than only imported by `src/main.tsx`, and the
      one declaration that has to apply before any of this app's code runs.

      An iframe document's canvas is white until something says otherwise, and
      this document is mounted inside a dark shell. Left to the JavaScript, the
      background arrives only once the module graph has loaded and Vite has
      injected the stylesheet — so every freshly opened surface starts as a
      white rectangle in a dark window. A render-blocking `<link>` plus these
      two lines are applied before the first paint instead.

      No hex here: the colour is `--bg-surface-1` from the same `src/tokens.css`
      the shell draws from, so an app cannot drift from the window around it.
    -->
    <link rel="stylesheet" href="/src/tokens.css" />
    <style>
      html,
      body {
        background: var(--bg-surface-1);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
