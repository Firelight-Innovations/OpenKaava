# Build the installers and attach them to a GitHub Release.
#
# The gate in `verify.yml` answers "is this branch correct". This file answers
# "what does a person download", and the two are deliberately separate jobs
# rather than one workflow with a conditional: a release build is a different
# cargo profile, takes minutes rather than seconds, and must not run on every
# pull request that touches a stylesheet.
#
# Nothing here does *code* signing. The setup.exe carries no Authenticode
# signature, so Windows SmartScreen will warn about it, and the release notes
# have to say so. A certificate is a purchase rather than a configuration; when
# there is one it arrives as a repository secret and this file gains two `env:`
# lines — not a rewrite.
#
# The updater's minisign key below is a different thing entirely and is free. It
# signs `latest.json` so an installed Veistra can tell an update from this
# repository apart from one from anywhere else. It says nothing to SmartScreen.
#
# **The updater step is gated on that secret existing.** `createUpdaterArtifacts`
# makes `tauri build` fail outright when no key is in the environment, so
# turning it on in `tauri.conf.json` would break every build by everyone who is
# not this workflow. It lives in `src-tauri/tauri.updater.conf.json` instead,
# merged over the real config with `--config` only when the secret is there.
# Without it, this workflow still produces installers — they simply are not
# updates anybody's Veistra can find.
#
# Two triggers, doing genuinely different jobs:
#
#   push a v* tag     the real thing, and it publishes a *draft* release
#   workflow_dispatch a dry run: same build, artifacts only, nothing published
#
# The dry run exists because the alternative way to test this file is to push a
# tag, and a tag is the one thing here that cannot be taken back cleanly.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# `contents: write` is what creating a release needs, and it is the only
# elevated permission in this repository. `verify.yml` is read-only and should
# stay that way; this is the file where publishing lives.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - run: pnpm install --frozen-lockfile

      # Before anything expensive, and before anything is published. A tag that
      # disagrees with package.json produces installers whose filenames state a
      # version that is not the one compiled into them, and that is not
      # detectable afterwards by looking at the artifact. Fail here instead.
      #
      # Skipped on workflow_dispatch, which has no tag to compare against.
      - name: Check the tag against the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node scripts/check-version.mjs --tag "${{ github.ref_name }}"

      # No `Swatinem/rust-cache` here, unlike `verify.yml`, and that is a
      # decision rather than an omission. Release-profile artifacts are a
      # separate cache entry from the dev-profile ones that gate every pull
      # request, GitHub evicts at 10 GB per repository, and a release runs a
      # handful of times a month. Paying a cold build for something people
      # download beats making the gate everyone waits for miss its cache.
      #
      # Two invocations of one command, and the difference is a config overlay.
      #
      # `TAURI_SIGNING_PRIVATE_KEY` is the gate rather than a `secrets` lookup
      # in an `if:`, because a workflow cannot read `secrets` in a step
      # condition.
      #
      # The password secret is optional and the `env:` line below is what makes
      # it optional. An absent secret arrives as an *empty* variable, which is
      # exactly what a key with no password wants; an *absent* variable makes
      # the CLI print "expect a prompt for password" and wait forever on a
      # runner nobody can type into. Deleting that line would be the difference.
      #
      # A build without the key is not a failure. It is the state this
      # repository is in until somebody creates the secret, and a release with
      # installers and no `latest.json` is strictly better than no release.
      - name: Build the installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            pnpm app:build --config src-tauri/tauri.updater.conf.json
          else
            echo "::warning title=No updater artifacts::TAURI_SIGNING_PRIVATE_KEY is not set. This release ships installers only, no Veistra will offer it as an update, and docs/dev/releases.md says how to create the secret."
            pnpm app:build
          fi

      # `tauri build` names its own output, from `productName` and the version.
      # Rather than reconstruct those filenames here — a second place that has
      # to agree with `tauri.conf.json` — find what was actually produced.
      - name: Collect the artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          # Actions runs bash with `set -e`, so a `find` over a directory
          # that does not exist would kill the step with find's own error
          # rather than the diagnostic below. Check first, and say what
          # was actually there.
          if [ ! -d target/release/bundle ]; then
            echo "tauri build produced no bundle/ directory. target/release held:"
            ls -la target/release || true
            exit 1
          fi
          # The `.sig` files come along when the build was signed and simply do
          # not exist when it was not, which is what makes the manifest step
          # below able to tell the two apart without being told.
          find target/release/bundle -type f \
            \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.sig' \) \
            -exec cp {} artifacts/ \;
          if [ -z "$(ls -A artifacts)" ]; then
            echo "A bundle/ exists but held no installer. Its tree:"
            find target/release/bundle -type f | head -50
            exit 1
          fi
          # A second copy under a name that never changes. Release filenames
          # carry the version, so no link to one survives the next release,
          # and "Download for Windows" needs a URL that does:
          # /releases/latest/download/Veistra-setup.exe resolves forever.
          cp artifacts/*-setup.exe artifacts/Veistra-setup.exe
          ls -la artifacts

      # The document an installed Veistra actually reads. It is the one
      # artifact in a release nobody looks at, so a wrong `url` in it is a
      # silent no-op on every machine at once — which is why the shaping lives
      # in a unit-tested script rather than in a `jq` line here.
      #
      # Two conditions, and they fail differently. No tag means no asset URLs to
      # point at, so a dry run has nothing to write. No `.sig` means the build
      # ran unsigned, and a manifest naming an unverifiable installer is worse
      # than no manifest: every Veistra would offer an update it then refuses.
      - name: Build the update manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if ! ls artifacts/*.sig >/dev/null 2>&1; then
            echo "No signature in artifacts/, so this release publishes no update manifest."
            exit 0
          fi
          node scripts/update-manifest.mjs --dir artifacts --tag "${{ github.ref_name }}" \
            > artifacts/latest.json
          cat artifacts/latest.json

      # The dry run stops here. Artifacts hang off the workflow run for a
      # fortnight, which is long enough to download one and check it launches.
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: veistra-installers
          path: artifacts/
          retention-days: 14

      # Draft, always. A draft is invisible until a person opens it, edits the
      # notes and presses publish, which is the review step that a tag push on
      # its own does not have.
      - name: Publish a draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" artifacts/* --clobber
          else
            gh release create "${{ github.ref_name }}" artifacts/* \
              --draft \
              --title "Veistra ${{ github.ref_name }}" \
              --generate-notes \
              --notes-file .github/release-preamble.md
          fi
