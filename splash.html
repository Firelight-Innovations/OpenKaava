    <title>Veistra</title>
    <!--
      This file is deliberately standalone: no imports, no build step, no
      shared modules, no coupling of any kind to the rest of the application.

      That includes the branding module the rest of the frontend reads: the
      product name, the wordmark and the copyright line below are
      written out here, and `scripts/check-branding.mjs` fails `pnpm lint` if
      any of them stops agreeing with branding.toml. Checking rather than
      generating is what keeps this file something you can open and read.

      The splash used to be a Vite entry that mounted a React tree, which meant
      the first window of the app could not paint until ~340kB of the main
      application's JavaScript had been fetched, parsed and mounted, and every
      import was a live coupling: a dependency added anywhere in the shared
      module graph landed in the splash's critical path too. So everything it
      needs is inlined here instead:
        - the styles, with the token values copied literally out of
          src/tokens.css under the same names (this file cannot @import it:
          that would be a request, and a dependency)
        - the picture and the progress bar, drawn on canvases by the
          `splash-art` and `splash-bar` scripts, so there is no image to request
        - the typefaces, as base64 woff2 subsets (see @font-face)
        - the boot logic, as a plain non-module <script> at the bottom

      The cost is that the values here are copies. If a token in
      src/tokens.css changes, change it here too: src/splash/splash.test.ts
      compares the two and fails `pnpm test` on any difference.

      The layout is Unity's splash: a picture on top, a solid band below, and
      the progress bar on the seam between them. The picture is the mark
      standing on a plate of small tiles under one raking lamp, which the
      pointer carries; a click sends a ring of light across the plate, and a
      failure turns the bar, the plate and the mark's edge red. The only colour
      on the card is the bar, so the user's accent never touches the art; it
      is kept for the focus ring.
    -->
    <!--
      Theme and accent, read before first paint. The shell mirrors the two
      appearance settings into localStorage (src/shell/settings/
      splashAppearance.ts) and this window shares that origin, so a stored
      value is available synchronously with no IPC round-trip. Nothing stored
      (a first launch) leaves the neutral palette in the CSS below. The test
      in src/splash/splash.test.ts runs this script, so the key and the value
      shape are checked against the writer.
    -->
    <script id="splash-appearance">
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem("veistra.splash-appearance"));
          var root = document.documentElement;
          var theme = stored.theme;
          if (theme === "system") {
            theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          if (theme === "light") root.dataset.theme = "light";
          if (/^(amber|blue|green|violet|coral)$/.test(stored.accent)) {
            root.dataset.accent = stored.accent;
          }
        } catch (err) {
          /* unset or unreadable: the neutral defaults stand */
        }
      })();
    </script>
    <style>
      /*
       * Four faces, each subset so it can be inlined (a linked font resolves
       * after first paint, and the text would reflow into it). Regenerate with
       * `pyftsubset <fontsource woff2> --unicodes=<range> --flavor=woff2`:
       *
       *   Inter 600          U+0041-005A, U+0061-007A, U+2122  the wordmark and the TIP label, 4kB

       *   Inter 400          U+0020-007E, U+00A9, U+00B7, U+2026, U+2122  the tip, the legal line, the version, 11kB
       *   IBM Plex Mono 500  U+0020-007E, U+00A9, U+00B7, U+2014, U+2122  the error text, 9kB
       *
       * The status line, tip and error text are arbitrary strings (labels from
       * boot.rs, error messages with file paths), so the ranges cover printable
       * ASCII rather than only what today's labels use. 600 sets only the
       * wordmark and "TIP", so it needs no more than the two letter cases.
       * Anything outside falls through to the system stack named after each
       * face.

      /*
       * Tokens, copied from src/tokens.css under the same names. Only the ones
       * this file reads are here; src/splash/splash.test.ts fails if any of
       * them drifts from tokens.css, so a stale copy is caught by `pnpm test`
       * rather than noticed on a launch.
       */
      :root {
        --bg-canvas: #0f0f10;
        --bg-surface-1: #141415;
        --bg-layer-1: #181a1b;
        --border-subtle: #222425;
        --border-subtle-1: #2c2e30;
        --border-strong: #36393a;
        --border-strong-1: #45484a;

        --txt-primary: #e4e6e6;
        --txt-secondary: #cacdce;
        --txt-tertiary: #afb3b6;
        --txt-placeholder: #959a9d;
        --txt-danger: #f4a49c;
        --danger: #e5534b;

        --accent-amber: #d98a3f;
        --accent-blue: #3f76ff;
        --accent-green: #4cb863;
        --accent-violet: #a585f0;
        --accent-coral: #e5736b;

        --sans: Inter, "Inter Variable", system-ui, "Segoe UI", sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

        --radius-md: 6px;
        --radius-xl: 12px;
        --shadow-overlay: 0 12px 32px -6px rgba(0, 0, 0, 0.6), 0 2px 6px rgba(0, 0, 0, 0.3);
        --control-md: 28px;
        --focus-ring: 2px solid color-mix(in srgb, var(--accent) 45%, transparent);
        --focus-ring-offset: 2px;

        /* Not a token. Neutral until the head script finds a stored accent, and
           then used for the focus ring only: the art is the mark and the green
           bar, and nothing the user picks recolours it. */
        --accent: var(--txt-primary);
      }

      :root[data-theme="light"] {
        --bg-canvas: #f2f2f3;
        --bg-surface-1: #ffffff;
        --bg-layer-1: #f9f9f9;
        --border-subtle: #eaebec;
        --border-subtle-1: #e1e2e3;
        --border-strong: #d5d7d9;
        --border-strong-1: #cacdcf;

        --txt-primary: #0f0f10;
        --txt-secondary: #313435;
        --txt-tertiary: #494d50;
        --txt-placeholder: #5d6265;
        --txt-danger: #9c231b;
        --danger: #bf2c22;

        --accent-amber: #a85a14;
        --accent-blue: #2f62e0;
        --accent-green: #23803b;
        --accent-violet: #6c47c9;
        --accent-coral: #b8392f;
      }

      html {
        color-scheme: dark;
      }

      html[data-theme="light"] {
        color-scheme: light;
      }

      :root[data-accent="amber"] {
        --accent: var(--accent-amber);
      }
      :root[data-accent="blue"] {
        --accent: var(--accent-blue);
      }
      :root[data-accent="green"] {
        --accent: var(--accent-green);
      }
      :root[data-accent="violet"] {
        --accent: var(--accent-violet);
      }
      :root[data-accent="coral"] {
        --accent: var(--accent-coral);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      /* Transparent, not a colour: the window is transparent too, so the
         desktop shows through everywhere except the card below. */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      /* The window is 72px larger than the card in each direction, and this
         padding is that gutter: room for the shadow to fall on transparent
         pixels instead of being clipped at the window edge. */
      body {
        padding: 36px;
      }

      /* The window is transparent and undecorated, so this card IS the visible
         window: radius, hairline border and overlay shadow are drawn here. The
         card is 600x420, 598x418 inside its border. The picture takes the top
         300px, the bar the next 8, the band the remaining 110; the bar and art
         scripts hold the same numbers. */
      .splash {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg-canvas);
        border: 1px solid var(--border-subtle-1);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-overlay);
        color: var(--txt-primary);
        font-family: var(--sans);
      }

      .splash__image {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        height: 300px;
        background: var(--bg-surface-1);
      }

      .splash__art {
        position: absolute;
        left: 0;
        top: 0;
        width: 598px;
        height: 300px;
        display: block;
        transition: opacity 320ms;
      }

      /* Shown only when the canvas cannot be had, so the mark is never missing. */
      .splash__mark {
        position: absolute;
        left: 50%;
        top: 56px;
        width: 96px;
        height: 96px;
        margin-left: -48px;
        fill: var(--txt-primary);
      }

      /* Sits over the mosaic; the art thins the tiles behind it so the letters
         stay clean. Its box is what the art script clears (LOCKUP there). */
      .splash__lockup {
        position: absolute;
        left: 0;
        right: 0;
        top: 179px;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 320ms;
      }

      .splash__wordmark {
        margin: 0;
        font-family: var(--sans);
        font-size: 32px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.01em;
        white-space: nowrap;
        color: var(--txt-primary);
        text-shadow:
          0 0 2px var(--bg-surface-1),
          0 0 7px var(--bg-surface-1);
      }

      /* Inter's U+2122 is already a superscript form (ink 0.26em tall, 0.54em
         wide, top at cap height; measured from the subset), so it is trimmed to
         0.8em and lifted back to cap height rather than shrunk to a speck. */
      .splash__tm {
        position: relative;
        top: -0.18em;
        margin-left: 0.08em;
        font-size: 0.8em;
        letter-spacing: 0;
      }

      /* A track the bar script fills. role="progressbar" lives here so the
         semantics belong to the thing that moves. */
      .splash__bar {
        position: absolute;
        left: 0;
        right: 0;
        top: 300px;
        height: 8px;
        background: var(--border-strong);
      }

      .splash__bar canvas {
        position: absolute;
        left: 0;
        top: 0;
        width: 598px;
        height: 8px;
        display: block;
      }

      .splash__band {
        position: absolute;
        left: 0;
        right: 0;
        top: 308px;
        bottom: 0;
        padding: 15px 20px 13px;
        display: grid;
        /* The status column has a fixed width, so a longer step label cannot
           narrow the tip and rewrap it while boot runs. */
        grid-template-columns: minmax(0, 1fr) 210px;
        grid-template-rows: auto 1fr auto;
        column-gap: 28px;
        background: var(--bg-canvas);
      }

      .splash__tiprow {
        grid-column: 1;
        grid-row: 1;
        margin: 0;
        display: flex;
        align-items: flex-start;
        gap: 10px;
        min-width: 0;
      }

      .splash__tiplabel {
        flex: none;
        margin-top: 1px;
        padding: 2px 5px 2px 6px;
        border: 1px solid var(--border-strong);
        border-radius: 4px;
        font-size: 10px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.14em;
        color: var(--txt-placeholder);
      }

      .splash__tip {
        font-size: 12px;
        font-weight: 400;
        line-height: 17px;
        color: var(--txt-tertiary);
      }

      .splash__status {
        grid-column: 2;
        grid-row: 1;
        min-width: 0;
        text-align: right;
      }

      .splash__step {
        margin: 0;
        overflow: hidden;
        font-size: 12px;
        font-weight: 500;
        line-height: 17px;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--txt-secondary);
      }

      .splash[data-phase="failed"] .splash__step {
        color: var(--txt-danger);
      }

      .splash__legal {
        grid-column: 1;
        grid-row: 3;
        align-self: end;
        margin: 0;
        font-size: 11px;
        font-weight: 400;
        line-height: 14px;
        color: var(--txt-placeholder);
      }

      .splash__version {
        grid-column: 2;
        grid-row: 3;
        align-self: end;
        font-size: 11px;
        font-weight: 500;
        line-height: 14px;
        text-align: right;
        white-space: nowrap;
        color: var(--txt-tertiary);
      }

      /* On failure the message takes the tip's place and Continue sits under
         the status, so nothing covers the picture: it turns red instead. The
         wrapper is display: contents, which makes both children cells of the
         band's grid while keeping one element the boot script can hide. */
      .splash__error {
        display: contents;
      }

      .splash[data-phase="failed"] .splash__tiprow {
        display: none;
      }

      .splash__error-message {
        grid-column: 1;
        grid-row: 1 / 3;
        align-self: start;
        max-height: 64px;
        margin: 0;
        overflow-y: auto;
        font-family: var(--mono);
        font-size: 11.5px;
        font-weight: 500;
        line-height: 16px;
        overflow-wrap: anywhere;
        color: var(--txt-danger);
      }

      /* The design system's secondary button: layer fill, strong border. */
      .splash__continue {
        grid-column: 2;
        grid-row: 2;
        justify-self: end;
        align-self: center;
        height: var(--control-md);
        padding: 0 12px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-md);
        background: var(--bg-layer-1);
        color: var(--txt-primary);
        font-family: var(--sans);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }

      .splash__continue:hover {
        border-color: var(--border-strong-1);
      }

      .splash__continue:focus-visible {
        outline: var(--focus-ring);
        outline-offset: var(--focus-ring-offset);
      }

      @media (prefers-reduced-motion: reduce) {
        .splash__art,
        .splash__lockup {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash" data-phase="working">
      <div class="splash__image">
        <canvas class="splash__art" aria-hidden="true"></canvas>

        <svg class="splash__mark" viewBox="0 0 24 24" aria-hidden="true" hidden>
          <path
            d="M2 3.399H22V20.601H2ZM7.817 7.309V10.045H16.183V7.309ZM7.817 13.955V16.691H16.183V13.955Z"
          />

    <script id="splash-bar">
      /*
       * The bar: a 598x8 strip between the picture and the band. It is part of
       * the frame rather than the art, so every picture sits on the same one.
       *
       * A flat green fill, with a pulse of light running along it left to
       * right while boot works. The pulse runs on the main thread's clock with
       * each step clamped, so a page that has stopped responding freezes it:
       * that is the signal the bar exists to give. A sliver is lit from the
       * first frame, so the pulse shows before boot has reported anything. It
       * fills to the progress boot reports, stops pulsing and takes one light
       * sweep on ready, and on failure stops where it is in the danger
       * colour. Its loop ends once it has settled; prefers-reduced-motion
       * never starts it.
       */
      var splashBar = (function () {
        "use strict";

        var W = 598;
        var H = 8;
        // Lit before the first status, so liveness shows from the first frame.
        var SLIVER = 0.03;
        // The pulse: how wide it is in CSS px, and how long one pass along the
        // fill takes.
        var PULSE_W = 120;
        var PULSE_S = 1.4;
        var WHITE = [255, 255, 255];

        var root = document.documentElement;
        var light = root.dataset.theme === "light";
        var canvas = document.querySelector(".splash__bar canvas");
        var dpr = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
        var ctx = null;
        try {
          ctx = canvas && canvas.getContext ? canvas.getContext("2d") : null;
        } catch (err) {
          ctx = null;
        }

        function readColor(name, fallback) {
          var raw = "";
          try {
            raw = getComputedStyle(root).getPropertyValue(name).trim();
          } catch (err) {
            raw = "";
          }
          var m = /^#([0-9a-f]{6})$/i.exec(raw);
          if (!m) return fallback;
          var n = parseInt(m[1], 16);
          return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
        }
        var GREEN = readColor("--accent-green", light ? [35, 128, 59] : [76, 184, 99]);
        var DANGER = readColor("--danger", light ? [191, 44, 34] : [229, 83, 75]);

        function mix(a, b, t) {
          return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
        }
        function rgb(c, a) {
          var p = Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]);
          return a === undefined || a >= 1 ? "rgb(" + p + ")" : "rgba(" + p + "," + a.toFixed(3) + ")";
        }
        function clamp(v, lo, hi) {
          return v < lo ? lo : v > hi ? hi : v;
        }
        function approach(cur, target, dt, rate, eps) {
          var next = cur + (target - cur) * (1 - Math.exp(-rate * dt));
          return Math.abs(target - next) < eps ? target : next;
        }

        var phase = "working"; // working | finalizing | ready | failed
        var target = SLIVER;
        var shown = SLIVER;
        var amp = 1;
        var pulse = 0; // where the pulse is on its pass, 0..1
        var failMix = 0;
        var sweep = -1;
        var running = false;
        var last = 0;

        function reduced() {
          try {
            return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
          } catch (err) {
            return false;
          }
        }

        // The step in flight counts as half done; the last tenth is the handoff's.
        function fractionFor(step, total) {
          return step > 0 && total > 0 ? Math.min(0.9, (step - 0.5) / total) : 0;
        }

        function stepState(dt) {
          var failed = phase === "failed";
          if (!failed) shown = approach(shown, target, dt, phase === "ready" ? 4.5 : 3, 0.0015);
          var calm = failed || (phase === "ready" && shown >= 1);
          amp = approach(amp, calm ? 0 : 1, dt, failed ? 14 : 4.5, 0.02);
          pulse = (pulse + dt / PULSE_S) % 1;
          failMix = approach(failMix, failed ? 1 : 0, dt, 14, 0.002);
          if (phase === "ready" && shown >= 1 && sweep < 0) sweep = 0;
          if (sweep >= 0 && sweep < 1) sweep = Math.min(1, sweep + dt / 0.8);
        }

        function settled() {
          if (phase === "ready") return shown >= 1 && amp <= 0 && sweep >= 1;
          return phase === "failed" && failMix >= 1 && amp <= 0;
        }

        function draw() {
          var w = canvas.width;
          var h = canvas.height;
          ctx.clearRect(0, 0, w, h);
          var fw = Math.round(shown * w);
          if (fw <= 0) return;
          var base = mix(GREEN, DANGER, failMix);
          ctx.save();
          ctx.beginPath();
          ctx.rect(0, 0, fw, h);
          ctx.clip();
          ctx.fillStyle = rgb(base);
          ctx.fillRect(0, 0, fw, h);
          // The pulse: a soft band of light crossing the fill.
          if (amp > 0.02) {
            var pw = PULSE_W * dpr;
            band(-pw + (fw + pw) * pulse, pw, h, 0.34 * amp);
          }
          // On ready, one wider and fainter sweep.
          if (sweep > 0 && sweep < 1) {
            var sw = 160 * dpr;
            band(-sw + (fw + sw) * (sweep * sweep * (3 - 2 * sweep)), sw, h, 0.28 * Math.sin(Math.PI * sweep));
          }
          ctx.restore();
        }

        // A band of white whose strength rises and falls across its width as
        // sin², drawn as one gradient so it has no steps in it.
        function band(x, bw, h, peak) {
          var g = ctx.createLinearGradient(x, 0, x + bw, 0);
          if (!g) return;
          var STOPS = 8;
          for (var k = 0; k <= STOPS; k++) {
            var u = Math.sin((Math.PI * k) / STOPS);
            g.addColorStop(k / STOPS, rgb(WHITE, peak * u * u));
          }
          ctx.fillStyle = g;
          ctx.fillRect(x, 0, bw, h);
        }

        function frame(now) {
          var dt = last ? clamp((now - last) / 1000, 0, 0.05) : 0.016;
          last = now;
          try {
            stepState(dt);
            draw();
          } catch (err) {
            // Said once, so a bug is findable, and the loop stops rather than
            // throwing sixty times a second.
            running = false;
            ctx = null;
            console.error("splash bar: " + String(err));
            return;
          }
          if (settled()) {
            running = false;
            return;
          }
          requestAnimationFrame(frame);
        }

        function kick() {
          if (!ctx) return;
          if (reduced()) {
            // Each state is one still frame.
            if (phase !== "failed") shown = target;
            amp = 0;
            failMix = phase === "failed" ? 1 : 0;
            sweep = 1;
            try {
              draw();
            } catch (err) {
              /* nothing to show it on */
            }
            return;
          }
          if (running) return;
          running = true;
          last = 0;
          requestAnimationFrame(frame);
        }

        if (ctx) {
          try {
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            draw();
          } catch (err) {
            ctx = null;
          }
        }

        return {
          working: function (step, total) {
            if (phase === "ready" || phase === "failed") return;
            phase = "working";
            target = Math.max(target, fractionFor(step, total));
            kick();
          },
          // Everything is done but the handoff is held back for a beat.
          finalizing: function () {
            if (phase === "ready" || phase === "failed") return;
            phase = "finalizing";
            target = Math.max(target, 0.95);
            kick();
          },
          ready: function () {
            if (phase === "failed") return;
            phase = "ready";
            target = 1;
            kick();
          },
          fail: function () {
            if (phase === "ready") return;
            phase = "failed";
            kick();
          },
        };
      })();
    </script>

    <script id="splash-art">
      /*
       * The picture: everything drawn in the 598x300 region above the bar.
       * Nothing outside this script knows how it is drawn, and the frame talks
       * to it only through the four methods it returns.
       *
       * The script has two halves. The first (state, pointer, loop, phases)
       * would serve any picture. The second (build and draw, from
       * "The picture: raking light" down) is the picture itself.
       *
       * Rules the first half enforces, so the picture does not have to:
       *   - one requestAnimationFrame loop, each step clamped to 50ms, so a
       *     stalled page stalls the picture rather than letting it jump;
       *   - the loop pauses while the document is hidden, and after a failure
       *     it rests once nothing is moving, until the pointer wakes it;
       *   - prefers-reduced-motion draws one still per state and ignores the
       *     pointer;
       *   - a throw from draw() is logged once, stops the loop and leaves the
       *     last frame up,
       *     and a throw from build() falls back to the plain SVG mark.
       *
       * Rules the picture has to keep:
       *   - draw() paints the whole frame from `S` and its own build() data.
       *     It reads no layout and no computed style, and allocates nothing
       *     proportional to the tile count.
       *   - Tiles go through queue() and flush(), which batch them into one
       *     path and one fill per colour. Quantise colour to a few dozen
       *     values per frame, or the batching buys nothing.
       *   - It must survive a context whose every method returns undefined
       *     (src/splash/splash.test.ts), so it never dereferences a return
       *     value without a guard, and never uses Path2D or OffscreenCanvas.
       *   - Nothing in the lockup's box may be brighter than the field's dimmest
       *     step, moving or not.
       */
      var splashArt = (function () {
        "use strict";

        // ==== Fixed by the card =============================================

        // The canvas in CSS px: the card's inside width, and the picture's height.
        var W = 598;
        var H = 300;
        // The mark (see .splash__mark): centred, 4px a unit, so the block is
        // 68.8px tall with its top at 69.6px.
        var MARK_CX = 299;
        var MARK_TOP = 69.6;
        var MARK_H = 68.8;
        var MARK_S = MARK_H / 17.2; // px per unit of the 24-unit box; the block is 17.2 tall
        var MARK_CY = MARK_TOP + (12 - 3.4) * MARK_S; // the block's centre
        // The lockup's box (see .splash__lockup).
        var LOCKUP = { x0: 199, x1: 399, y0: 177, y1: 215 };

        // The mark in the 24x24 box of assets/veistra-mark.svg: the block
        // [x0 y0 x1 y1], and the two slots cut out of it.
        var BLOCK = [2, 3.4, 22, 20.6];
        var SLOTS = [
          [7.817, 7.309, 16.183, 10.045],
          [7.817, 13.955, 16.183, 16.691],
        ];

        var TAU = Math.PI * 2;
        var root = document.documentElement;
        var light = root.dataset.theme === "light";
        var canvas = document.querySelector(".splash__art");
        var image = document.querySelector(".splash__image");
        var dpr = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
        var ctx = null;
        try {
          ctx = canvas && canvas.getContext ? canvas.getContext("2d") : null;
        } catch (err) {
          ctx = null;
        }

        function readColor(name, fallback) {
          var raw = "";
          try {
            raw = getComputedStyle(root).getPropertyValue(name).trim();
          } catch (err) {
            raw = "";
          }
          var m = /^#([0-9a-f]{6})$/i.exec(raw);
          if (!m) return fallback;
          var n = parseInt(m[1], 16);
          return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
        }

        // Read once. Nothing the user picks recolours the picture: the accent
        // belongs to the shell, and this is the product's own mark.
        var INK = readColor("--txt-primary", light ? [15, 15, 16] : [228, 230, 230]);
        var BG = readColor("--bg-surface-1", light ? [255, 255, 255] : [20, 20, 21]);
        var DANGER = readColor("--danger", light ? [191, 44, 34] : [229, 83, 75]);

        // ==== Helpers =======================================================

        function mix(a, b, t) {
          return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

        function clamp(v, lo, hi) {

        function smooth(a, b, v) {
          var t = clamp((v - a) / (b - a), 0, 1);
          return t * t * (3 - 2 * t);
        }
        function sq(v) {

        }
        function approach(cur, target, dt, rate, eps) {
          var next = cur + (target - cur) * (1 - Math.exp(-rate * dt));

        }

        // Is a canvas point on the mark: inside the block, outside both slots.
        function onMark(x, y) {

          var v = (y - MARK_TOP) / MARK_S + 3.4;
          if (u < BLOCK[0] || u > BLOCK[2] || v < BLOCK[1] || v > BLOCK[3]) return false;
          for (var k = 0; k < SLOTS.length; k++) {
            var q = SLOTS[k];

          }
          return true;
        }
        // ==== Batched tiles =================================================
        // A colour is quantised to 64 steps a channel and 64 of alpha, and each
        // distinct one gets a batch kept across frames: one path and one fill
        // per colour, however many tiles share it.

        var batches = [];
        var batchByKey = {};
        var round = !!(ctx && ctx.roundRect);

        function keyFor(c, a) {
          var r = clamp(Math.round(c[0] / 4), 0, 63);
          var g = clamp(Math.round(c[1] / 4), 0, 63);
          var b = clamp(Math.round(c[2] / 4), 0, 63);
          var al = clamp(Math.round(a * 63), 0, 63);
          return ((r * 64 + g) * 64 + b) * 64 + al;
        }
        function batchFor(key) {
          var b = batchByKey[key];
          if (b) return b;
          var al = key % 64;
          var rest = (key - al) / 64;
          var bl = rest % 64;
          rest = (rest - bl) / 64;
          var g = rest % 64;
          var r = (rest - g) / 64;
          b = {
            style: "rgba(" + r * 4 + "," + g * 4 + "," + bl * 4 + "," + (al / 63).toFixed(3) + ")",
            pts: [],
            n: 0,
          };
          batchByKey[key] = b;
          batches.push(b);
          return b;
        }
        /**
         * One square tile, in DEVICE px (CSS px times `dpr`). `radius` is the
         * corner, also in device px; 0 or less draws a plain rect, which is
         * much cheaper and all a tile under ~4 device px can show anyway.
         */
        function queue(c, a, x, y, size, radius) {
          if (a <= 0.004 || size <= 0) return;
          var b = batchFor(keyFor(c, a));
          var p = b.pts;
          var k = b.n * 4;
          p[k] = x;
          p[k + 1] = y;
          p[k + 2] = size;
          p[k + 3] = radius || 0;
          b.n++;
        }
        function flush() {
          for (var i = 0; i < batches.length; i++) {
            var b = batches[i];
            if (!b.n) continue;
            ctx.fillStyle = b.style;
            ctx.beginPath();
            var p = b.pts;
            for (var k = 0, end = b.n * 4; k < end; k += 4) {

              // rects: the same pixels, for a fraction of roundRect's cost.
              var rr = p[k + 3];
              if (rr <= 0 || (p[k + 2] < 6 && rr <= 2.5)) ctx.rect(p[k], p[k + 1], p[k + 2], p[k + 2]);
              else if (rr <= 2.5) {
                ctx.rect(p[k] + 1, p[k + 1], p[k + 2] - 2, p[k + 2]);
                ctx.rect(p[k], p[k + 1] + 1, p[k + 2], p[k + 2] - 2);
              } else if (round) ctx.roundRect(p[k], p[k + 1], p[k + 2], p[k + 2], rr);
              else ctx.rect(p[k], p[k + 1], p[k + 2], p[k + 2]);
            }
            ctx.fill();
            b.n = 0;
          }
        }

        // ==== State the picture reads =======================================

        // Seconds a failure's colour takes to arrive, and how long afterwards
        // the picture keeps moving on its own before it rests. The backend's
        // watchdog hands off about 10s after a failure, so the rest only
        // matters for the last few seconds of that.
        var FAIL_S = 0.9;
        var FAIL_ACTIVE_S = 6;
        var READY_S = 0.8;
        var TAP_S = 1.6;

        var S = {
          t: 0, // seconds on the art's own clock
          phase: "working", // working | finalizing | ready | failed
          target: 0, // progress boot has reported, 0..1
          progress: 0, // eased toward target
          readyT: -1, // S.t when ready arrived; -1 before
          failT: -1, // S.t when the failure arrived; -1 before
          ready: 0, // 0..1 over READY_S after readyT, eased
          fail: 0, // 0..1 over FAIL_S after failT, eased; for a front, use failT
          rx: W / 2, // the pointer's latest position, canvas px
          ry: H / 2,
          px: W / 2, // the same, smoothed: read this one
          py: H / 2,
          vx: 0, // the smoothed position's velocity, px/s
          vy: 0,
          over: 0, // 0..1, eases in while the pointer is on the picture and out after it leaves
          taps: [], // presses {x, y, t}, dropped TAP_S after they happen
          still: false, // reduced motion: draw(0) once per state, no pointer
        };
        var pointerIn = false;
        var pointerSeen = false;

        function reduced() {
          try {
            return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
          } catch (err) {
            return false;
          }
        }
        S.still = reduced();

        // The step in flight counts as half done; the last tenth is the handoff's.
        function fractionFor(step, total) {
          return step > 0 && total > 0 ? Math.min(0.9, (step - 0.5) / total) : 0;
        }

        // ==== Pointer =======================================================

        var rect = null;
        function localPoint(e) {

          var sx = rect.width ? W / rect.width : 1;
          var sy = rect.height ? H / rect.height : 1;

          image.addEventListener("pointermove", function (e) {

            S.ry = p[1];
            // The first sighting starts the smoothed point where the pointer
            // is, instead of sliding it in from the middle.
            if (!pointerSeen) {

              S.py = S.ry;
              pointerSeen = true;

            kick();

          image.addEventListener("pointerleave", function () {
            pointerIn = false;
            kick();
          });
          image.addEventListener("pointerdown", function (e) {

          if (S.phase !== "failed") return true;

          S.t += dt;
          S.progress = approach(S.progress, S.target, dt, S.phase === "ready" ? 4.5 : 3, 0.0015);
          S.ready = S.readyT < 0 ? 0 : smooth(0, 1, (S.t - S.readyT) / READY_S);
          S.fail = S.failT < 0 ? 0 : smooth(0, 1, (S.t - S.failT) / FAIL_S);

          var nx = S.px + (S.rx - S.px) * k;
          var ny = S.py + (S.ry - S.py) * k;
          var kv = 1 - Math.exp(-10 * dt);
          if (dt > 0) {
            S.vx += ((nx - S.px) / dt - S.vx) * kv;
            S.vy += ((ny - S.py) / dt - S.vy) * kv;

          S.py = ny;
          S.over = approach(S.over, pointerIn ? 1 : 0, dt, pointerIn ? 7 : 2.5, 0.004);

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          draw(dt);

        function frame(now) {

          last = now;
          try {
            stepState(dt);
            paint(dt);
          } catch (err) {
            // Said once, so a bug is findable; the last good frame stays up.
            running = false;
            ctx = null;
            console.error("splash art: " + String(err));

          }
          if (!wantsFrame()) {
            running = false;
            return;
          }

          if (!ctx || running || !wantsFrame()) return;
          running = true;
          last = 0;
          requestAnimationFrame(frame);

        function still() {

            paint(0);

        });

        // ==== The picture: raking light =====================================
        // The mark stands on a plate of tiles under one lamp. Every tile's
        // tone comes from that lamp: a broad fall-off across the card, two
        // long swells in the plate that catch it, and the shadow the mark
        // throws. A tile is then drawn or not by comparing its tone with a
        // ranked noise value, at one of six fixed strengths, so all a tile can
        // do is be there or be brighter, and the picture stays a mosaic
        // however the light moves.
        //
        // At rest the lamp sits off the card's upper left and sways a little,
        // and the swells drift, so the plate is never quite still while boot
        // works. The pointer takes the lamp: it glides to the cursor, lights
        // the tiles around it, and the shadow swings away from it. A press
        // sends a ring of light out from the point. Progress raises the lamp;
        // ready brings it to full with one sweep across the plate. A failure
        // makes the lamp stutter, and red rises out of the bar through the
        // tiles and into the mark's edge.

        var PITCH = 6; // tile pitch in CSS px; a tile is half of it
        // Tile strengths, dim to bright. A tile is ink laid on the plate:
        // light on dark in the dark theme, so stronger is lit; dark on light
        // in the light theme, so stronger is shade.
        var LEVELS = light ? [0.06, 0.11, 0.18, 0.28, 0.42, 0.62] : [0.05, 0.1, 0.17, 0.27, 0.4, 0.6];
        // Inside the lockup's box no tile passes the dimmest step. The cap

            if (S.phase === "failed") return;
            if (S.phase !== "ready") S.readyT = S.t;
            S.phase = "ready";
            S.target = 1;
            changed();
          },
          fail: function () {
            if (S.phase === "ready") return;
            if (S.phase !== "failed") S.failT = S.t;
            S.phase = "failed";
            changed();
          },
        };
      })();
    </script>

    <script>
      /*
       * A plain <script>, not `type="module"`: a module is deferred and
       * fetched as a separate resource even when it imports nothing, and
       * this needs neither.
       *
       * The Tauri API is reached through `window.__TAURI__`, which requires
       * `app.withGlobalTauri: true` in tauri.conf.json. That global is
       * injected by the Tauri runtime as an initialisation script, so it is
       * already present before this runs and costs no request.
       */
      (function () {
        "use strict";

        /*
         * Minimum time the splash stays up, no matter how fast boot
         * finishes. This holds back only the *handoff*: the Rust-side work
         * in boot.rs runs at full speed either way. 5s is deliberately longer
         * than boot ever actually takes, so the splash does not read as barely
         * doing anything. Kept well clear of `WATCHDOG_TIMEOUT` in boot.rs
         * (10s), which force-closes the splash if nothing calls `finish_boot`.
         */
        var MIN_VISIBLE_MS = 5000;

        /*
         * How long the bar sits at `FINALIZE_PROGRESS` under a "Finalizing"
         * label before jumping to the real `Ready` state. boot.rs has no phase
         * for this: it exists so the bar does not snap from the last step to
         * "Ready". It runs *inside* `MIN_VISIBLE_MS`, not on top of it.
         */
        var FINALIZE_HOLD_MS = 450;
        var FINALIZE_PROGRESS = 0.95;

        // One per launch, chosen here so the art never needs to know about it.
        var TIPS = [
          "Press Ctrl+Shift+P to open the Command Palette and run any menu command by name.",
          "Press Ctrl+Shift+A to open an app in the focused pane.",
          "Press Ctrl+K to search for files in the current project.",
          "Narrow a Ctrl+K search with ext:rs or path:src/, and leave files out with !, as in !*.test.ts or !node_modules/.",
          "While Settings is open, the title-bar search box filters the settings list.",
          "Press Ctrl+Tab and Ctrl+Shift+Tab to cycle through your clusters.",
          "Press Ctrl+1 to Ctrl+9 to jump straight to the cluster in that position.",
          "Press Ctrl+Shift+N to start a new cluster.",
          "Press Ctrl+Alt+P or Shift+Alt+P to open the Switch Project dialog.",
          "Press Ctrl+` to show or hide the terminal, and Ctrl+Shift+` to open a new one.",
          "Alt+1 to Alt+5 open the rail pages: Git, Plane, Cloud agents, Hindsight and Cost.",
          "Press Ctrl+Shift+E to switch an open rail page between docked and expanded.",
          "Ctrl+Shift+V toggles a rendered preview of Markdown, Mermaid, SVG and HTML files.",
          "Press Ctrl+K, then V, to open a file's preview beside the editor.",
          "Single-click a file in File Explorer to peek at it; double-click to keep its tab.",
          "Drag a file from File Explorer onto a terminal to type its path there.",
          "Pasting an image into a terminal with Ctrl+V stores it and inserts a reference.",
          "Right-click a file and choose Send to agent to add it to a terminal's context.",
          "Run, Run Command… runs a one-line command in the cluster's terminal.",
          "Right-click a cluster badge to rename it, change its icon or close it.",
          "Middle-click a pane tab to close it.",
          "The default branch is read-only; open a worktree cluster to make changes.",
          "Click a diff's margin to add a review note, then Send to terminal to pass it on.",
          "Settings, Appearance sets a Dark, Light or System theme and an accent colour.",
          "Apps, Presets, Save Current Layout… saves your pane arrangement for reuse.",
          "Apps, App Library… installs an app from a repository or a folder.",
          "In Canvas, the Comments tab pins a note to shapes or a dragged box for an agent.",
        ];

        // The bar and the picture each hear every phase. Either one throwing
        // must not stop the handoff, so each call is fenced off.
        function tell(method, a, b) {
          [window.splashBar, window.splashArt].forEach(function (layer) {
            try {
              if (layer) layer[method](a, b);
            } catch (err) {
              console.error(String(err));
            }
          });
        }

        var startedAt = performance.now();

        var errorBox = document.querySelector(".splash__error");
        var errorMessage = document.querySelector(".splash__error-message");
        var continueButton = document.querySelector(".splash__continue");
        var bar = document.querySelector(".splash__bar");
        var root = document.querySelector(".splash");
        var step = document.querySelector(".splash__step");
        var tip = document.querySelector(".splash__tip");
        var version = document.querySelector(".splash__version");
        // The step in flight, kept so a failure can say where it stopped.
        var lastLabel = "Starting";
        var lastStep = 0;
        var lastProgress = 0;

        tip.textContent = TIPS[Math.floor(Math.random() * TIPS.length)];

        var tauri = window.__TAURI__;

        /*
         * Absent when this file is opened directly in a browser, which is
         * how its layout gets checked without building the app. Bailing
         * here leaves the static markup above on screen as a preview of the
         * initial state, rather than throwing on the first property access.
         */
        if (!tauri) return;

        // Empty until it resolves; a failure leaves it empty rather than wrong.
        if (tauri.app && tauri.app.getVersion) {
          tauri.app
            .getVersion()
            .then(function (v) {
              version.textContent = "Version " + v;
            })
            .catch(function () {});
        }

        var invoke = tauri.core.invoke;
        var listen = tauri.event.listen;

        // Mirrors the art's own fraction for a step: the step in flight counts as half done.
        function progressFor(status) {
          return status.step > 0 && status.total > 0 ? Math.min(0.9, (status.step - 0.5) / status.total) : 0;
        }

        /** Mirrors `boot::BootStatus` — see src/bindings.ts for the types. */
        function render(status) {
          var working = status.phase === "working";
          var failed = status.phase === "failed";

          root.dataset.phase = status.phase;
          if (working) lastProgress = progressFor(status);
          else if (status.phase === "ready") lastProgress = 1;
          bar.setAttribute("aria-valuenow", String(lastProgress));

          if (working) {
            lastStep = status.step;
            if (status.step > 0) lastLabel = status.label;
          }

          if (working) {
            step.textContent = status.step > 0 ? status.label : "Starting";
          } else if (failed) {
            step.textContent = lastStep > 0 ? lastLabel + " · failed" : "Failed to start";
          } else {
            step.textContent = "Ready";
          }

          errorBox.hidden = !failed;
          if (failed) {
            errorMessage.textContent = status.message;
            // Enter takes the one way out, without hunting for the button.
            continueButton.focus({ preventScroll: true });
          }

          if (working) tell("working", status.step, status.total);
          else if (failed) tell("fail");
          else tell("ready");
        }

        function finish() {
          invoke("finish_boot").catch(function (err) {
            console.error(String(err));
          });
        }

        // Guards the handoff so it is only ever armed once, however status
        // first reaches `ready`: the live listener, the poll, or both racing.
        var handoffArmed = false;

        function armReadyHandoff() {
          if (handoffArmed) return;
          handoffArmed = true;
          // Hold until MIN_VISIBLE_MS has elapsed, but not a moment longer.
          var remaining = Math.max(0, MIN_VISIBLE_MS - (performance.now() - startedAt));
          window.setTimeout(finish, remaining);
        }

        // Separate from `handoffArmed`: that one guards `finish` itself, this
        // guards *entering* the finalizing hold, and they cannot share a flag.
        var finalizeStarted = false;

        // The one state transition `render` cannot make on its own: boot.rs
        // never reports it, so it is driven from here.
        function handleReady() {
          if (finalizeStarted) return;
          finalizeStarted = true;

          lastProgress = FINALIZE_PROGRESS;
          bar.setAttribute("aria-valuenow", String(FINALIZE_PROGRESS));
          step.textContent = "Finalizing";
          tell("finalizing");

          window.setTimeout(function () {
            render({ phase: "ready" });
            armReadyHandoff();
          }, FINALIZE_HOLD_MS);
        }

        // The frontend never auto-finishes `failed`, so the user gets a chance
        // to read why; the backend's watchdog (boot.rs) still hands off about
        // 10s after a failure.
        continueButton.addEventListener("click", finish);

        /*
         * Tauri events are not replayed: if boot reports `Ready` before the
         * listener below is registered, that event is gone. Polling
         * `boot_status` closes that gap, but its response can land *after* a
         * live event has already moved things forward, so a flag records
         * whether any live event has arrived. Status only ever moves forward.
         */
        var liveEventReceived = false;

        // The poll is chained off `listen`'s promise rather than fired
        // alongside it: `listen` resolves only once the listener is registered
        // on the Rust side, and polling earlier would leave a window in which
        // an event could fire and be missed by both paths.
        listen("boot:status", function (event) {
          liveEventReceived = true;
          if (event.payload.phase === "ready") return handleReady();
          render(event.payload);
        })
          .then(function () {
            return invoke("boot_status");
          })
          .then(function (polled) {
            if (liveEventReceived) return;
            // Boot may have finished before this window even loaded; it still
            // gets its finalizing hold, instead of waiting for the watchdog.
            if (polled.phase === "ready") return handleReady();
            render(polled);
          })
          .catch(function (err) {
            console.error(String(err));
          });
      })();
    </script>
  </body>
</html>
