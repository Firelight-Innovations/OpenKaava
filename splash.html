    <title>OpenKaava</title>
    <!--
      This file is deliberately standalone: no imports, no build step, no
      shared modules, no coupling of any kind to the rest of the application.

      That includes the branding module the rest of the frontend reads: the
      product name and the wordmark below are written out here, and
      `scripts/check-branding.mjs` fails `pnpm lint` if either stops agreeing
      with branding.toml. Checking rather than generating is what keeps this
      file something you can open and read, which is the whole of its design.

      It used to be a Vite entry that mounted a React tree
      (src/splash/main.tsx -> Splash.tsx -> splash.css -> tokens.css ->
      @fontsource, plus framer-motion and src/ui/Icon.tsx). That worked, but
      it meant the first window of the app could not paint its real content
      until ~340kB of the main application's JavaScript had been fetched,
      parsed, and mounted — React, ReactDOM and framer-motion included, all
      to set three text nodes and one element's width. Worse, every one of
      those imports was a live coupling: a dependency added anywhere in the
      shared module graph landed in the splash's critical path too.

      So everything it needs is inlined here instead:
        - the styles, with the token values copied literally out of
          src/tokens.css under the same names (this file cannot @import it —
          that would be a request, and a dependency)
        - the art, drawn on a canvas by the `splash-art` script below (Assembly;
          it needs no image, so there is no request for one)
        - the typefaces, as base64 woff2 subsets (see @font-face)
        - the boot logic, as a plain non-module <script> at the bottom

      Nothing is fetched: the art is drawn, and the wordmark face is inlined.
      Regenerate the wordmark subset and nothing else in the app has to know.

      The payoff is that the markup below IS the finished screen rather than
      a stand-in for it. The old file carried a hand-maintained skeleton that
      duplicated the React tree so *something* was on screen before the
      bundle arrived, and the two had to be kept visually identical by hand
      or the handoff would visibly flicker. There is no handoff now, so
      there is nothing to keep in sync: the script only ever mutates text,
      one width, and two `hidden` attributes.

      The cost is that the values here are copies. If a token in
      src/tokens.css changes, change it here too: src/splash/splash.test.ts
      compares the two and fails `pnpm test` on any difference. That is the
      deliberate trade: this window's whole job is to be on screen instantly,
      and it cannot do that while it depends on the application it is
      covering for.
    -->
    <!--
      Theme and accent, read before first paint. The shell mirrors the two
      appearance settings into localStorage (src/shell/settings/
      splashAppearance.ts) and this window shares that origin, so a stored
      value is available synchronously with no IPC round-trip. Nothing stored
      (a first launch) leaves the neutral palette in the CSS below. The test
      in src/splash/splash.test.ts runs this script, so the key and the value
      shape are checked against the writer.
    -->
    <script id="splash-appearance">
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem("kaava.splash-appearance"));
          var root = document.documentElement;
          var theme = stored.theme;
          if (theme === "system") {
            theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          if (theme === "light") root.dataset.theme = "light";
          if (/^(amber|blue|green|violet|coral)$/.test(stored.accent)) {
            root.dataset.accent = stored.accent;
          }
        } catch (err) {
          /* unset or unreadable: the neutral defaults stand */
        }
      })();
    </script>

       * after first paint, and the text would reflow into it). Regenerate with
       * `pyftsubset <fontsource woff2> --unicodes=<range> --flavor=woff2`:

       *   Inter 600          U+0041-005A, U+0061-007A  the wordmark, 4kB

       * boot.rs, error messages with file paths), so the ranges cover printable

      /*
       * Tokens, copied from src/tokens.css under the same names. Only the ones
       * this file reads are here; src/splash/splash.test.ts fails if any of
       * them drifts from tokens.css, so a stale copy is caught by `pnpm test`
       * rather than noticed on a launch.
       */
      :root {
        color-scheme: dark;

        --bg-canvas: #0f0f10;
        --bg-surface-1: #141415;
        --bg-layer-1: #181a1b;
        --border-subtle: #222425;
        --border-subtle-1: #2c2e30;
        --border-strong: #36393a;
        --border-strong-1: #45484a;

        --txt-primary: #e4e6e6;
        --txt-secondary: #cacdce;
        --txt-tertiary: #afb3b6;
        --txt-danger: #f4a49c;
        --danger: #e5534b;

        --accent-amber: #d98a3f;
        --accent-blue: #3f76ff;
        --accent-green: #4cb863;
        --accent-violet: #a585f0;
        --accent-coral: #e5736b;

        --sans: Inter, "Inter Variable", system-ui, "Segoe UI", sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

        --radius-md: 6px;
        --radius-xl: 12px;
        --shadow-overlay: 0 12px 32px -6px rgba(0, 0, 0, 0.6), 0 2px 6px rgba(0, 0, 0, 0.3);
        --control-md: 28px;
        --focus-ring: 2px solid color-mix(in srgb, var(--accent) 45%, transparent);
        --focus-ring-offset: 2px;

        /* Not a token: what the accent means for the splash's own parts.
           Neutral until the head script has found a stored accent, so a first
           launch is never drawn in a colour the user did not pick. */
        --accent: var(--txt-primary);
      }

      :root[data-theme="light"] {
        color-scheme: light;

        --bg-canvas: #f2f2f3;
        --bg-surface-1: #ffffff;
        --bg-layer-1: #f9f9f9;
        --border-subtle: #eaebec;
        --border-subtle-1: #e1e2e3;
        --border-strong: #d5d7d9;
        --border-strong-1: #cacdcf;

        --txt-primary: #0f0f10;
        --txt-secondary: #313435;
        --txt-tertiary: #494d50;
        --txt-danger: #9c231b;
        --danger: #bf2c22;

        --accent-amber: #a85a14;
        --accent-blue: #2f62e0;
        --accent-green: #23803b;
        --accent-violet: #6c47c9;
        --accent-coral: #b8392f;
      }

      /* The accent. Neutral (the text colour) until the head script finds a
         stored one. The art and the progress segments both read it. */
      :root[data-accent="amber"] {
        --accent: var(--accent-amber);
      }
      :root[data-accent="blue"] {
        --accent: var(--accent-blue);
      }
      :root[data-accent="green"] {
        --accent: var(--accent-green);
      }
      :root[data-accent="violet"] {
        --accent: var(--accent-violet);
      }
      :root[data-accent="coral"] {
        --accent: var(--accent-coral);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      /* Transparent, not a colour: the window is transparent too, so the
         desktop shows through everywhere except the card below. Any fill
         here would be the square backing the rounded card is meant to
         remove. */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      /* The window is 72px larger than the card in each direction, and this
         padding is that gutter: room for the shadow to fall on transparent
         pixels instead of being clipped at the window edge. */
      body {
        padding: 36px;
      }

      /* The window is transparent and undecorated (see tauri.conf.json), so
         this card IS the visible window: the app window's radius, the
         hairline border and the overlay shadow are drawn here, anti-aliased
         by the compositor. The clip on `overflow` rounds the canvas. */
      .splash {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg-surface-1);
        border: 1px solid var(--border-subtle-1);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-overlay);
        color: var(--txt-primary);
        font-family: var(--sans);
      }

      /* The art fills the whole card; the footer and the error panel sit over
         it. The canvas leaves room for the footer itself, see `layout` in the
         art script. */
      .splash__content {
        position: absolute;
        inset: 0;
      }

      .splash__art {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* Wordmark left, step name right, the segments stretched between them.
         The 20px side inset is the composition's own padding, so the art and
         the footer share one edge. */
      .splash__footer {
        position: absolute;
        left: 20px;
        right: 20px;
        bottom: 16px;
        height: 26px;
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .splash__brand {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: none;
      }

      /* TODO(logo): a placeholder slot for the mark that is still to be
         drawn. Replace what is inside #logo (an inline SVG or a
         background image); it is a 22px square, about 1.6x the wordmark's cap
         height. */
      .splash__logo {
        display: block;
        flex: none;
        width: 22px;
        height: 22px;
        border: 1px solid var(--border-strong);
        border-radius: 6px;
      }

      .splash__wordmark {
        margin: 0;
        font-family: var(--sans);
        font-size: 19px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.02em;
        color: var(--txt-primary);
      }

      .splash__ticks {
        display: flex;
        flex: 1;
        gap: 4px;
        min-width: 0;
      }

      .splash__ticks i {
        display: block;
        flex: 1;
        height: 2px;
        border-radius: 1px;
        background: var(--border-strong);
        transition: background 400ms;
      }

      .splash__ticks i.on {
        background: var(--accent);
      }

      .splash__ticks i.cur {
        background: var(--txt-tertiary);
      }

      .splash[data-phase="failed"] .splash__ticks i.cur {
        background: var(--danger);
      }

      .splash__step {
        flex: none;
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        line-height: 1;
        text-align: right;
        text-transform: lowercase;
        white-space: nowrap;
        color: var(--txt-tertiary);
      }

      .splash[data-phase="failed"] .splash__step {
        color: var(--danger);
      }

      .splash__error {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 24px 64px;
      }

      /* A panel rather than bare text: the message has to stay legible over
         the art. */
      .splash__error-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        max-width: 400px;
        padding: 20px 24px;
        border: 1px solid var(--border-subtle-1);
        border-radius: var(--radius-xl);
        background: color-mix(in srgb, var(--bg-surface-1) 88%, transparent);
      }

      .splash__error-message {
        margin: 0;
        text-align: center;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.45;
        color: var(--txt-danger);
      }

      /* The design system's secondary button: layer fill, strong border. */
      .splash__continue {
        height: var(--control-md);
        padding: 0 12px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-md);
        background: var(--bg-layer-1);
        color: var(--txt-primary);
        font-family: var(--sans);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }

      .splash__continue:hover {
        border-color: var(--border-strong-1);
      }

      .splash__continue:focus-visible {
        outline: var(--focus-ring);
        outline-offset: var(--focus-ring-offset);
      }

      @media (prefers-reduced-motion: reduce) {
        .splash__ticks i {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash" data-phase="working">
      <div class="splash__content">
        <canvas class="splash__art" aria-hidden="true"></canvas>

        <div class="splash__error" hidden>
          <div class="splash__error-panel">
            <p class="splash__error-message"></p>
            <button type="button" class="splash__continue">Continue anyway</button>
          </div>
        </div>
      </div>

      <div
        class="splash__footer"
        role="progressbar"
        aria-label="Startup"
        aria-valuemin="0"
        aria-valuemax="1"
        aria-valuenow="0"
      >
        <span class="splash__brand">
          <i class="splash__logo" id="logo" aria-hidden="true"></i>
          <p class="splash__wordmark">OpenKaava</p>
        </span>
        <!-- One segment per boot step. The script rebuilds these if boot
             reports a different total; five is what a launch with Home and
             Files reports, so the common case never changes. -->
        <span class="splash__ticks"><i></i><i></i><i></i><i></i><i></i></span>
        <span class="splash__step">starting</span>
      </div>
    </div>

    <script id="splash-art">
      /*
       * Assembly. Fourteen Bauhaus primitives drift in from outside the card
       * and lock into one asymmetrical composition, in five groups. Boot
       * progress decides how many groups have been let in; until ready every
       * piece sits a hair off true, and ready settles them onto the grid and
       * draws the construction lines. Failure freezes the clock: pieces still
       * in flight tip and hang, and the ghost outlines of what never arrived
       * turn danger-coloured.
       *
       * Nothing here talks to Tauri. The boot script calls the five methods on
       * `splashArt` and this file owns the time, so a status that arrives late
       * or all at once still plays out as a sequence.
       */
      var splashArt = (function () {
        "use strict";

        var canvas = document.querySelector(".splash__art");
        var ctx = canvas.getContext("2d");
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        // The composition is drawn on a 20 x 11 grid; `grp` is the boot group that lets a piece in.
        var GX = 20;
        var GY = 11;
        var DEF = [
          { t: "disc", x: 13.2, y: 5.2, r: 4.0, c: "A", grp: 1, z: 2 },
          { t: "bar", x: 8.4, y: 5.5, w: 0.16, h: 11, c: "I", grp: 1, z: 6 },
          { t: "quarter", x: 20, y: 11, r: 7.2, c: "D", grp: 2, z: 0 },
          { t: "bar", x: 4.2, y: 7.6, w: 8.4, h: 0.16, c: "I", grp: 2, z: 6 },
          { t: "half", x: 3.9, y: 7.6, r: 2.4, c: "P", grp: 3, z: 3 },
          { t: "sq", x: 18.0, y: 1.9, r: 0.7, c: "P", grp: 3, z: 3 },
          { t: "dots", x: 3.9, y: 2.6, r: 0.26, n: 3, gap: 0.95, c: "I", grp: 3, z: 6 },
          { t: "hair", x: 13.2, y: 5.2, r: 5.3, c: "I", grp: 4, z: 8 },
          { t: "tri", x: 10.9, y: 9.5, r: 2.2, c: "I", grp: 4, z: 4 },
          { t: "bar", x: 17.0, y: 8.4, w: 4.2, h: 0.55, rot: -45, c: "A", grp: 4, z: 6 },
          { t: "disc", x: 13.2, y: 5.2, r: 0.5, c: "B", grp: 5, z: 7 },
          { t: "ring", x: 18.0, y: 1.9, r: 1.3, w: 0.08, c: "I", grp: 5, z: 8 },
          { t: "sq", x: 1.3, y: 9.7, r: 0.4, c: "A", grp: 5, z: 7 },
          { t: "hair", x: 3.9, y: 7.6, r: 3.3, c: "I", grp: 5, z: 8 },
        ];

        // Groups start at least this far apart, so a boot that reports four steps in one
        // millisecond still reads as four beats.
        var GROUP_GAP = 0.22;
        // A piece is seated this long after its group starts, at the latest.
        var SEATED = 1.9;
        var READY_SECONDS = 1.6;
        var FAIL_SECONDS = 1.0;

        var TAU = Math.PI * 2;
        function c01(x) {
          return x < 0 ? 0 : x > 1 ? 1 : x;
        }
        function smooth(x) {
          x = c01(x);
          return x * x * (3 - 2 * x);
        }
        function out3(x) {
          return 1 - Math.pow(1 - c01(x), 3);
        }
        function out5(x) {
          return 1 - Math.pow(1 - c01(x), 5);
        }

        function mulberry(a) {
          return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        /* ---- state ---- */
        var te = 0; // art clock, seconds; stops at failure
        var phase = "working";
        var ready = 0;
        var fk = 0; // failure ramp
        var groupStart = [null, null, null, null, null, null];
        var groups = 0;
        var pieces = [];
        var order = [];

        /* ---- colour: everything derives from --accent ---- */
        var P = null;
        function hexRgb(h) {
          h = h.replace("#", "");
          if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
          return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
        }
        function rgbHsl(r, g, b) {
          r /= 255;
          g /= 255;
          b /= 255;
          var mx = Math.max(r, g, b);
          var mn = Math.min(r, g, b);
          var l = (mx + mn) / 2;
          var h = 0;
          var s = 0;
          var d = mx - mn;
          if (d) {
            s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
            h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
            h *= 60;
          }
          return [h, s, l];
        }
        function palette() {
          var cs = getComputedStyle(document.documentElement);
          function get(n) {
            return cs.getPropertyValue(n).trim();
          }
          var accent = get("--accent");
          var hs = rgbHsl.apply(null, hexRgb(accent));
          var neutral = !document.documentElement.dataset.accent;
          var p = {
            light: document.documentElement.dataset.theme === "light",
            bg: get("--bg-surface-1"),
            accent: accent,
            h: hs[0],
            s: neutral ? 0.02 : hs[1],
            inkRgb: hexRgb(get("--txt-primary")),
            dangerRgb: hexRgb(get("--danger")),
          };
          // dh: hue offset, sm: saturation multiplier, l: lightness 0..1, a: alpha
          p.hsl = function (dh, sm, l, a) {
            var hue = (((p.h + dh) % 360) + 360) % 360;
            return "hsla(" + hue.toFixed(1) + "," + (Math.min(1, p.s * sm) * 100).toFixed(1) + "%," + (l * 100).toFixed(1) + "%," + a + ")";
          };
          p.rgba = function (c, a) {
            return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";
          };
          return p;
        }
        function colour(k, a) {
          var L = P.light;
          switch (k) {
            case "A":
              return P.hsl(0, 1, L ? 0.5 : 0.62, a);
            case "D":
              return P.hsl(-6, 0.9, 0.3, a);
            case "P":
              return P.hsl(8, L ? 0.9 : 0.55, L ? 0.84 : 0.82, a);
            case "B":
              return P.bg;
            default:
              return P.rgba(P.inkRgb, a);
          }
        }

        /* ---- layout ---- */
        var g = 0; // px per grid unit
        var fx = 0;
        var fy = 0;
        var fw = 0;
        var fh = 0;
        var pad = null;
        var W = 0;
        var H = 0;
        function layout() {
          var d = Math.min(window.devicePixelRatio || 1, 2);
          W = canvas.clientWidth;
          H = canvas.clientHeight;
          canvas.width = Math.round(W * d);
          canvas.height = Math.round(H * d);
          if (ctx) ctx.setTransform(d, 0, 0, d, 0, 0);
          // 20px of padding at the sides and top, and clear of the footer below (16 + 26 + 14).
          var p = 20;
          var aw = W - p * 2;
          var ah = H - 16 - 26 - 14 - p;
          g = Math.max(1, Math.min(aw / GX, ah / GY));
          fw = g * GX;
          fh = g * GY;
          fx = p + (aw - fw) / 2;
          fy = p + (ah - fh) / 2;
          pad = { y: p, h: ah };
        }

        /* ---- the seeded launch ---- */
        function seed() {
          var r = mulberry(1 + Math.floor(Math.random() * 99999));
          pieces = DEF.map(function (d, i) {
            var q = {};
            for (var k in d) q[k] = d[k];
            q.rot = q.rot || 0;
            // the "almost" before ready
            q.jx = (r() - 0.5) * 0.7;
            q.jy = (r() - 0.5) * 0.7;
            q.jr = (r() - 0.5) * 5;
            var ang = r() * TAU;
            var far = 9 + r() * 3;
            q.sx = Math.cos(ang) * far;
            q.sy = Math.sin(ang) * far * 0.8;
            q.sr = (r() < 0.5 ? -1 : 1) * (40 + r() * 140);
            q.delay = (i % 3) * 0.16 + r() * 0.08;
            q.dur = 1.15 + r() * 0.3;
            return q;
          });
          order = pieces.slice().sort(function (a, b) {
            return a.z - b.z;
          });
        }

        function ageOf(grp) {
          var s = groupStart[grp];
          return s !== null && te >= s ? te - s : -1;
        }

        /* Let groups in up to `n`, spaced so they never land as one lump. */
        function admit(n) {
          if (phase === "failed") return;
          var last = groups ? groupStart[groups] : te - GROUP_GAP;
          while (groups < n && groups < 5) {
            groups++;
            groupStart[groups] = reduce ? -1000 : Math.max(te, last + GROUP_GAP);
            last = groupStart[groups];
          }
        }

        /* ---- drawing ---- */
        function shape(c, p, hair) {
          var t = p.t;
          var i;
          if (t === "disc") {
            c.beginPath();
            c.arc(0, 0, p.r * g, 0, TAU);
            if (hair) c.stroke();
            else c.fill();
          } else if (t === "ring" || t === "hair") {
            c.beginPath();
            c.arc(0, 0, p.r * g, 0, TAU);
            c.lineWidth = (t === "hair" ? 0.035 : p.w) * g;
            c.stroke();
          } else if (t === "bar") {
            var w = p.w * g;
            var h = p.h * g;
            if (hair) c.strokeRect(-w / 2, -h / 2, w, h);
            else c.fillRect(-w / 2, -h / 2, w, h);
          } else if (t === "sq") {
            var q = p.r * g;
            if (hair) c.strokeRect(-q, -q, q * 2, q * 2);
            else c.fillRect(-q, -q, q * 2, q * 2);
          } else if (t === "half") {
            c.beginPath();
            c.arc(0, 0, p.r * g, Math.PI, 0);
            c.closePath();
            if (hair) c.stroke();
            else c.fill();
          } else if (t === "quarter") {
            c.beginPath();
            c.moveTo(0, 0);
            c.arc(0, 0, p.r * g, Math.PI, Math.PI * 1.5);
            c.closePath();
            if (hair) c.stroke();
            else c.fill();
          } else if (t === "tri") {
            var a = p.r * g;
            c.beginPath();
            c.moveTo(-a / 2, a / 2);
            c.lineTo(a / 2, a / 2);
            c.lineTo(-a / 2, -a / 2);
            c.closePath();
            if (hair) c.stroke();
            else c.fill();
          } else if (t === "dots") {
            for (i = 0; i < p.n; i++) {
              c.beginPath();
              c.arc((i - (p.n - 1) / 2) * p.gap * g, 0, p.r * g, 0, TAU);
              if (hair) c.stroke();
              else c.fill();
            }
          }
        }

        function draw() {
          if (!ctx) return;
          var c = ctx;
          var failed = phase === "failed";
          var settle = out5(c01(ready * 1.5));
          var dim = 1 - 0.22 * fk;
          var i;
          c.clearRect(0, 0, W, H);

          // the blueprint, a whisper behind everything: each unfinished piece's ghost outline
          c.save();
          c.translate(fx, fy);
          c.lineWidth = 1;
          c.setLineDash([2, 4]);
          for (i = 0; i < pieces.length; i++) {
            var p = pieces[i];
            var a = ageOf(p.grp) - p.delay;
            var done = a >= p.dur;
            if (done && !failed) continue;
            var missing = a < p.dur;
            c.strokeStyle = failed && missing ? P.rgba(P.dangerRgb, 0.6 * fk + 0.05) : P.rgba(P.inkRgb, 0.07);
            c.save();
            c.translate(p.x * g, p.y * g);
            c.rotate((p.rot * Math.PI) / 180);
            if (p.t !== "hair" && p.t !== "ring") shape(c, p, true);
            c.restore();
          }
          c.setLineDash([]);
          c.restore();

          // registration marks at the padded corners, one per group; they turn to the accent at ready
          c.save();
          c.translate(fx, fy);
          var marks = [
            [0, 0, 1, 1],
            [fw, 0, -1, 1],
            [fw, fh, -1, -1],
            [0, fh, 1, -1],
          ];
          for (var m = 0; m < 5; m++) {
            var am = ageOf(m + 1);
            if (am < 0) continue;
            var u = out3(am / 0.7);
            var len = 16 * u;
            var lit = ready > 0.3 && !failed;
            c.strokeStyle = lit ? P.accent : P.rgba(P.inkRgb, 0.55 * dim);
            c.lineWidth = lit ? 1.5 : 1;
            c.beginPath();
            if (m < 4) {
              var mk = marks[m];
              c.moveTo(mk[0], mk[1] + mk[3] * len);
              c.lineTo(mk[0], mk[1]);
              c.lineTo(mk[0] + mk[2] * len, mk[1]);
            } else {
              var cx = 13.2 * g;
              var cy = 5.2 * g;
              var l2 = 7 * u;
              c.moveTo(cx - l2, cy);
              c.lineTo(cx + l2, cy);
              c.moveTo(cx, cy - l2);
              c.lineTo(cx, cy + l2);
            }
            c.stroke();
          }
          c.restore();

          // pieces, clipped so nothing ever crosses the footer
          c.save();
          c.beginPath();
          c.rect(0, 0, W, pad.y + pad.h + 8);
          c.clip();
          c.translate(fx, fy);
          for (var k = 0; k < order.length; k++) {
            var q = order[k];
            var age = ageOf(q.grp) - q.delay;
            if (age < 0) continue;
            var u2 = c01(age / q.dur);
            var inv = 1 - out5(u2);
            var off = 1 - settle;
            var px = q.x + q.jx * off + q.sx * inv;
            var py = q.y + q.jy * off + q.sy * inv;
            var rr = q.rot + q.jr * off + q.sr * inv;
            var al = smooth(age / 0.4) * dim;
            // failed and still in flight: the piece tips and hangs
            if (failed && u2 < 1) {
              rr += fk * 6;
              al *= 0.9;
              c.save();
              c.translate(px * g, py * g);
              c.rotate((rr * Math.PI) / 180);
              c.strokeStyle = P.rgba(P.dangerRgb, 0.7 * fk);
              c.lineWidth = 1;
              c.setLineDash([3, 3]);
              shape(c, q, true);
              c.restore();
            }
            c.save();
            c.translate(px * g, py * g);
            c.rotate((rr * Math.PI) / 180);
            var colr = colour(q.c, al);
            c.fillStyle = colr;
            c.strokeStyle = colr;
            shape(c, q, false);
            c.restore();
            // the click: a hairline pulse as it seats
            var lk = age - q.dur;
            if (lk > 0 && lk < 0.5 && !failed) {
              c.save();
              c.translate(q.x * g, q.y * g);
              c.strokeStyle = P.rgba(P.inkRgb, 0.35 * (1 - lk / 0.5));
              c.lineWidth = 1;
              c.beginPath();
              c.arc(0, 0, (Math.max(q.r || 0.6, 0.6) + lk * 1.2) * g, 0, TAU);
              c.stroke();
              c.restore();
            }
          }
          c.restore();

          // ready: construction lines draw through the composition
          if (ready > 0) {
            var u3 = out3(c01(ready * 1.3));
            var c2 = 13.2 * g;
            var d2 = 5.2 * g;
            c.save();
            c.translate(fx, fy);
            c.strokeStyle = P.rgba(P.inkRgb, 0.28 * (1 - 0.5 * smooth((ready - 0.6) / 0.4)));
            c.lineWidth = 1;
            c.beginPath();
            c.moveTo(c2 - c2 * u3, d2);
            c.lineTo(c2 + (fw - c2) * u3, d2);
            c.moveTo(c2, d2 - d2 * u3);
            c.lineTo(c2, d2 + (fh - d2) * u3);
            c.moveTo(0, 7.6 * g);
            c.lineTo(fw * u3, 7.6 * g);
            c.stroke();
            c.strokeStyle = P.rgba(P.inkRgb, 0.22);
            c.strokeRect(0, 0, fw * u3, fh * u3);
            c.restore();
          }
        }

        /* ---- the clock ---- */
        var running = false;
        var last = 0;

        function settled() {
          if (reduce) return true;
          if (phase === "failed") return fk >= 1;
          if (phase === "ready") return ready >= 1 && te > groupStart[5] + SEATED + 0.6;
          return false;
        }

        function frame(now) {
          // Clamped: a hidden window stops delivering frames, and the first one back must not
          // teleport the animation to its end.
          var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
          last = now;
          if (phase !== "failed") te += dt;
          else fk = Math.min(1, fk + dt / FAIL_SECONDS);
          if (phase === "ready" && groupStart[5] !== null && te >= groupStart[5] + SEATED) {
            ready = Math.min(1, ready + dt / READY_SECONDS);
          }
          draw();
          if (settled()) {
            running = false;
            last = 0;
          } else {
            requestAnimationFrame(frame);
          }
        }

        function kick() {
          if (reduce) {
            // still-but-progressive: every state is drawn once, already seated
            ready = phase === "ready" ? 1 : 0;
            fk = phase === "failed" ? 1 : 0;
            draw();
            return;
          }
          if (running) return;
          running = true;
          requestAnimationFrame(frame);
        }

        P = palette();
        seed();
        layout();
        window.addEventListener("resize", function () {
          layout();
          draw();
        });
        admit(1);
        te = reduce ? 0 : 0.3;
        kick();

        return {
          /** Boot is at `step` of `total`. */
          working: function (step, total) {
            admit(1 + Math.floor((step / Math.max(1, total)) * 3.999));
            kick();
          },
          /** Boot is done and the splash is holding a beat before ready. */
          finalizing: function () {
            admit(5);
            kick();
          },
          ready: function () {
            admit(5);
            phase = "ready";
            kick();
          },
          fail: function () {
            phase = "failed";
            kick();
          },
        };
      })();
    </script>

    <script>
      /*
       * A plain <script>, not `type="module"`: a module is deferred and
       * fetched as a separate resource even when it imports nothing, and
       * this needs neither. Nothing here is transformed by Vite.
       *
       * The Tauri API is reached through `window.__TAURI__`, which requires
       * `app.withGlobalTauri: true` in tauri.conf.json. That global is
       * injected by the Tauri runtime as an initialisation script, so it is
       * already present before this runs and costs no request — unlike
       * `import { invoke } from "@tauri-apps/api/core"`, which would drag
       * the bundler back in and put this window's startup behind a module
       * graph again.
       */
      (function () {
        "use strict";

        /*
         * Minimum time the splash stays up, no matter how fast boot
         * finishes. This holds back only the *handoff* — the Rust-side work
         * in boot.rs runs at full speed either way and is usually done well
         * before this timer is.
         *
         * 5s is deliberately longer than boot ever actually takes. A boot
         * this app can run (a manifest read and a checkout scan) finishes in
         * well under a second on any real machine, so without a floor the
         * splash would read as barely doing anything — which undersells an
         * app that, once handed off to, is not thin. This is the version of
         * that impression that a fast boot earns instead.
         *
         * Kept well clear of `WATCHDOG_TIMEOUT` in boot.rs (10s): that timer
         * force-closes the splash if nothing calls `finish_boot` in time, as
         * a fallback for a frontend that never got the chance to. This timer
         * is the frontend getting that chance — if the two ever converged,
         * the watchdog would start racing the normal path instead of only
         * ever backstopping it.
         */
        var MIN_VISIBLE_MS = 5000;

        /*
         * How long the bar sits at `FINALIZE_PROGRESS` under a "Finalizing"
         * label before jumping to the real `Ready` state.
         *
         * `boot::BootStatus` has no phase for this — the moment boot.rs
         * reports `Ready`, it is genuinely done, there is no fourth step
         * running in the background during this hold. It exists for the
         * same reason `MIN_VISIBLE_MS` does: a bar that snaps straight from
         * "step 3 of 3" to "Ready" reads as though the last stretch of work
         * was skipped rather than finished, even though nothing was
         * actually skipped. This manufactures the beat that a real final
         * step would have taken.
         *
         * It runs *inside* `MIN_VISIBLE_MS`, not on top of it — `handleReady`
         * only calls `armReadyHandoff` after this hold, so the 5s floor is
         * simply measured from a slightly later point. The two never stack.
         * `Ready` itself is not a resting state either (see `render`'s
         * settle logic below): the spinner keeps turning for however long of
         * `MIN_VISIBLE_MS` is left after this hold, so that remainder reads
         * as more of the same loading sequence instead of a second, frozen
         * stop tacked on after it.
         */
        var FINALIZE_HOLD_MS = 450;
        var FINALIZE_PROGRESS = 0.95;

        var startedAt = performance.now();

        var errorBox = document.querySelector(".splash__error");
        var errorMessage = document.querySelector(".splash__error-message");
        var continueButton = document.querySelector(".splash__continue");
        var bar = document.querySelector(".splash__footer");
        var root = document.querySelector(".splash");
        var ticksBox = document.querySelector(".splash__ticks");
        var step = document.querySelector(".splash__step");
        var ticks = [].slice.call(ticksBox.children);
        // The step in flight, kept so a failure can say where it stopped.
        var lastLabel = "starting";
        var failedAt = 0;

        var tauri = window.__TAURI__;

        /*
         * Absent when this file is opened directly in a browser, which is
         * how its layout gets checked without building the app. Bailing
         * here leaves the static markup above on screen as a preview of the
         * initial state, rather than throwing on the first property access.
         */
        if (!tauri) return;

        var invoke = tauri.core.invoke;
        var listen = tauri.event.listen;

        /** Mirrors `boot::BootStatus` — see src/bindings.ts for the types. */
        function render(status) {
          var working = status.phase === "working";
          var failed = status.phase === "failed";
          var progress = working ? status.step / status.total : status.phase === "ready" ? 1 : 0;

          root.dataset.phase = status.phase;
          bar.setAttribute("aria-valuenow", String(progress));

          // One segment per step boot reports. Five is the markup's default; a build
          // with a different number of apps rebuilds them here, once.
          if (working && status.total !== ticks.length) {
            ticksBox.textContent = "";
            ticks = [];
            for (var n = 0; n < status.total; n++) {
              ticks.push(ticksBox.appendChild(document.createElement("i")));
            }
          }
          // `step 0` is a state boot can report before it starts; it is not a step, so
          // nothing is current yet. Ready fills every segment, failed keeps the one that
          // was current, and the CSS turns it to the danger colour.
          var current = working ? status.step - 1 : failed ? failedAt : -1;
          var done = working ? Math.max(0, status.step - 1) : failed ? failedAt : ticks.length;
          for (var i = 0; i < ticks.length; i++) {
            ticks[i].className = i < done ? "on" : i === current ? "cur" : "";
          }
          if (working) failedAt = Math.max(0, status.step - 1);

          // Lowercase and short is the point: the label is a quiet mono line, not a headline.
          if (working) lastLabel = status.step > 0 ? status.label : "starting";
          step.textContent = working
            ? lastLabel
            : failed
              ? lastLabel === "starting"
                ? "failed"
                : lastLabel + " · failed"
              : "ready";

          errorBox.hidden = !failed;
          if (failed) errorMessage.textContent = status.message;

          if (working) splashArt.working(status.step, status.total);
          else if (failed) splashArt.fail();
          else splashArt.ready();
        }

        function finish() {
          invoke("finish_boot").catch(function (err) {
            console.error(String(err));
          });
        }

        // Guards the handoff so it is only ever armed once, however status
        // first reaches `ready` — via the live listener, via the poll, or
        // both racing each other.
        var handoffArmed = false;

        function armReadyHandoff() {
          if (handoffArmed) return;
          handoffArmed = true;
          // Hold until MIN_VISIBLE_MS has elapsed, but not a moment longer:
          // if boot was already slow enough to clear it, this fires now.
          var remaining = Math.max(0, MIN_VISIBLE_MS - (performance.now() - startedAt));
          window.setTimeout(finish, remaining);
        }

        // Separate from `handoffArmed`: that one guards `finish` itself,
        // this guards *entering* the finalizing hold, and they cannot share
        // a flag. `armReadyHandoff` sets its guard only once the hold is
        // already over, so if both the live listener and the poll saw
        // `ready` and this reused that flag, the second caller would read
        // it as still unarmed and start a second hold on top of the first.
        var finalizeStarted = false;

        // The one state transition `render` cannot make on its own: boot.rs
        // never reports it, so it is driven from here rather than folded
        // into `render`'s `status.phase` branches.
        function handleReady() {
          if (finalizeStarted) return;
          finalizeStarted = true;

          bar.setAttribute("aria-valuenow", String(FINALIZE_PROGRESS));
          for (var i = 0; i < ticks.length; i++) ticks[i].className = "on";
          step.textContent = "finalizing";
          splashArt.finalizing();

          window.setTimeout(function () {
            render({ phase: "ready" });
            armReadyHandoff();
          }, FINALIZE_HOLD_MS);
        }

        // `failed` is deliberately never auto-finished — the user should
        // get a chance to read why before being dropped into the main
        // window, so it waits on this button instead.
        continueButton.addEventListener("click", finish);

        /*
         * Tauri events are not replayed: if boot reports `Ready` before the
         * listener below is registered, that event is simply gone. Polling
         * `boot_status` closes that gap — but its response can also land
         * *after* a live event has already moved things forward, and
         * applying it then would overwrite newer data with older. This flag
         * is the guard. Status only ever moves forward (working, then
         * exactly one of ready/failed), so "has a live event arrived at
         * all" is enough to tell stale from current.
         */
        var liveEventReceived = false;

        // The poll is chained off `listen`'s promise rather than fired
        // alongside it, and that is the point: `listen` is itself an async
        // IPC call that resolves only once the listener is registered on
        // the Rust side. Polling before then would leave a window in which
        // an event could fire and be missed by both paths.
        listen("boot:status", function (event) {
          liveEventReceived = true;
          // `ready` goes through `handleReady`'s finalizing hold instead of
          // straight to `render` — see that function for why.
          if (event.payload.phase === "ready") return handleReady();
          render(event.payload);
        })
          .then(function () {
            return invoke("boot_status");
          })
          .then(function (polled) {
            if (liveEventReceived) return;
            // Boot may have finished before this window even loaded. Routing
            // through `handleReady` here too is what stops that case sitting
            // untouched until the watchdog in boot.rs forces the handoff ten
            // seconds later — it still gets its finalizing hold either way.
            if (polled.phase === "ready") return handleReady();
            render(polled);
          })
          .catch(function (err) {
            console.error(String(err));
          });
      })();
    </script>
  </body>
</html>
