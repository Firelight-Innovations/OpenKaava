[package]
name = "openkaava-orchestrator"
version.workspace = true
description = "Entry point for the OpenKaava stack — loads and orchestrates the dev tools"
authors = ["Firelight Innovations"]
edition = "2021"

# Inherited, so the license is stated in exactly one place. The three fields
# above predate the workspace and are still spelled out here, which is only
# untidy; this one must not be, because a member carrying its own license is
# how a repository ends up with two answers to "what is this under".
license.workspace = true

# Lint levels come from [workspace.lints] in the root Cargo.toml.
[lints]
workspace = true

[lib]
# The binary and the library can't share a name on Windows, hence the `_lib`
# suffix. `main.rs` is a thin shim that calls into this library, which also lets
# integration tests and the mobile entry point reach the same code.
# See https://github.com/rust-lang/cargo/issues/8519
name = "openkaava_orchestrator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Schematify is disabled (ORC-SCO-001): off by default, so the switcher bar
# never offers it. `cargo build --features schematify` brings the app back, and
# `KAAVA_SCHEMATIFY=1` does the same for its Vite entry in `vite.config.ts`.
schematify = ["dep:schematify-core"]
# Design Mode is disabled: it points at web UIs, and OpenKaava no longer
# targets them. Off by default; `--features design-mode` restores the app, its
# comment store and the `kaava-design` MCP server, and `KAAVA_DESIGN_MODE=1`
# restores its Vite entry. See `docs/design-notes/design-mode.md`.
design-mode = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

# One OpenKaava process per machine, and the reason is Explorer's context menu.
# "Open with OpenKaava" on a folder launches this binary again, and a second
# process would hold its own ShellState and write its own layout.json and
# projects.json over the first one's. This plugin hands the argv of the second
# launch to the process already running and exits it, so the context menu
# routes into the live window instead of racing it. See `launch.rs`.
tauri-plugin-single-instance = "2"

# The in-app updater. Fetches the `latest.json` named in `plugins.updater`,
# verifies its minisign signature against the public key beside it, downloads
# the NSIS installer and runs it. Driven from Rust only — see `src/updater.rs`
# for why `@tauri-apps/plugin-updater` is not also in package.json.
#
# The minisign keypair this verifies against is unrelated to Authenticode code
# signing, which the installers still do not have. `docs/dev/releases.md` says
# which absence is which.
tauri-plugin-updater = "2"

# The native folder picker behind Home's New/Open Project.
#
# `rfd` directly rather than `tauri-plugin-dialog`, which is a thin wrapper over
# this same crate. Two reasons, and the second one is not a preference:
#
#  1. That plugin exists to expose dialogs to *frontend JavaScript*, gated by an
#     entry in `capabilities/`. We call the picker only from Rust (apps/home.rs),
#     and handing every tool iframe the ability to open native dialogs is not
#     something anything has asked for.
#  2. It hard-enables `rfd/common-controls-v6` — not behind a feature, so it
#     cannot be turned off. That pulls in `TaskDialogIndirect`, which lives only
#     in the side-by-side ComCtl32 v6 and so requires a Windows application
#     manifest. `tauri-build` embeds one in the app binary, but nothing embeds
#     one in a *test* binary, so every `cargo test` in this crate died at load
#     with STATUS_ENTRYPOINT_NOT_FOUND before it ran a line.
#
# We never show a message dialog, only `pick_folder`, which goes through
# IFileOpenDialog and needs none of that. Default features off: the rest are
# Linux portal and async-runtime plumbing this uses none of.
rfd = { version = "0.16", default-features = false }

# Reading `kaava-tool.toml` out of a tool's checkout — where its frontend's dev
# URL and built `dist` directory are declared. Shared with every tool repo, so
# the orchestrator and the tools cannot disagree about the manifest's shape.
kaava-tool-manifest = { path = "../crates/kaava-tool-manifest" }

# The wire types of transport A. The orchestrator is not spawning tool cores yet,
# but `RpcError` is already the error shape a frontend receives: an app's Rust
# half (`src/apps/`) fails with one, and it crosses to the iframe unchanged. Two
# error vocabularies for one `invoke` — one for apps, one for tools — is exactly
# the drift this crate exists to prevent.
kaava-rpc = { path = "../crates/kaava-rpc" }

# The Schematify design graph: schemas, atomic storage, the loader, and the
# lifecycle rules. `src-tauri/src/apps/schematify.rs` is the thin JSON-RPC
# layer over this; every schema, every write and every load rule lives there,
# not here.
#
# Optional, and off unless the `schematify` feature below turns it on.
schematify-core = { path = "../crates/schematify-core", optional = true }

# `files/read-bytes` has to hand bytes to the frontend through a JSON value,
# which has no byte variant — see the doc on that method for why the answer is
# base64 today and an asset protocol later.
base64 = "0.22"

# Serialization. `derive` is the feature that enables `#[derive(Serialize)]`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# Ergonomic error enums — see src/error.rs.
thiserror = "2"

# Parsing and comparing the pinned component versions.
semver = "1"
portable-pty = "0.9.0"
sysinfo = "0.39.6"
trash = "5.2.6"

# Content search (search.rs), built from the same crates ripgrep itself is
# built from rather than shelling out to an `rg` binary, which is not
# guaranteed to be on a user's machine. `ignore` is the directory walker that
# already knows how to honour `.gitignore` — the reason this replaces the old
# hardcoded skip list wholesale rather than keeping both. `grep-matcher` is the
# trait the other two share; `grep-regex` turns a query into a matcher, literal
# or pattern; `grep-searcher` drives that matcher over a file's bytes, line by
# line, with binary detection built in.
ignore = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
# For escaping a *literal* query into a regex `grep-regex` can compile — see
# `search::build_matcher`. Already pulled in transitively by `grep-regex`;
# named directly here because this crate calls its `escape` function itself.
regex-syntax = "0.8"

# The Model Context Protocol, for the servers OpenKaava hosts for whatever coding
# agent the user is running in a terminal. See `src/mcp/` and
# `docs/mcp-server-manager.md`.
#
# `default-features = false` drops the `macros` feature deliberately. The `#[tool]`
# proc-macro derives a schema from an argument struct, which is the right trade
# for a server whose tools are known at compile time — ours come from a registry
# that a settings toggle can change, so the schemas are `serde_json::Value`s we
# build ourselves and the macro would have nothing to derive from.
#
# `transport-streamable-http-server` pulls in `server-side-http`, and with it
# `tower` — so axum below is the only other thing needed to mount this, and no
# separate tower feature has to be named here.
rmcp = { version = "3.1", default-features = false, features = [
    "server",
    "transport-streamable-http-server",
] }

# The HTTP surface the MCP transport mounts on. One router, one route per
# enabled server. Tauri exposes no HTTP server of its own, so this is a genuine
# addition rather than something already in the tree.
axum = "0.8"

# Already in the tree under Tauri, named here because this crate spawns onto it
# directly — `tauri::async_runtime` is this same runtime, which is why the
# listener does not stand up a second one.
tokio = { version = "1", features = ["net", "rt"] }
tokio-util = "0.7"

# The listener's bearer token. Loopback and an unguessable port already put this
# out of casual reach, but a port is scannable by anything else on the machine
# and these tools reach into the live application.
rand = "0.9"

# Noticing that a plugin under development has been rebuilt, so its core can be
# restarted without anyone asking — see `src/plugins/watch.rs`.
#
# The alternative was `notify-debouncer-mini`, which exists because raw `notify`
# reports every write a build makes and almost nobody wants that. Rejected for
# one dependency's worth of one loop: `watch::debounce` drains the channel with
# `recv_timeout` until it goes quiet, which is the whole of what the debouncer
# crate does for this case.
notify = "8"

# Installing an app from GitHub — see `src/plugins/remote.rs`.
#
# `ureq` rather than `reqwest`, which is the reflex. Every call this makes is a
# blocking request from inside `spawn_blocking`: resolve a release, download an
# asset, and nothing else. `reqwest` would bring an async stack to be driven
# from a thread that immediately blocks on it, along with a second TLS
# configuration beside the one Tauri already links. `ureq` is the same job in a
# fraction of the tree.
#
# `native-tls` rather than the default `rustls`, for the trust store rather than
# for the crypto. ureq's rustls feature bundles Mozilla's CA list through
# `webpki-roots`, fixing the trust store at compile time; on Windows
# `native-tls` is schannel, which verifies against the *machine's* store. That
# is what makes an install work behind a corporate proxy terminating TLS with a
# private root — the exact network a new developer at a company is most likely
# to be on, and not a case a bundled CA list can ever be taught about.
#
# `native-tls`, not `native-tls-no-default`, and the difference is the whole
# feature working rather than not.
#
# The narrower flag brings the `native-tls` *crate* in and sets `_tls`, but
# ureq's own guard tests `cfg!(feature = "native-tls")` by name, and on a miss it
# **panics** rather than falling back: "uri scheme is https, provider is NativeTls
# but feature is not enabled". Every HTTPS request through an agent configured
# for this provider hit that, which is why `plugins::remote` — same builder,
# written first — could not install anything either. Nothing caught it because a
# panic inside `spawn_blocking` surfaces as a join error, and the only sign at
# the call site is the generic message its caller falls back to.
#
# The wider flag adds no crate. It turns on `native-tls-webpki-roots`, whose
# `webpki-root-certs` is already in the tree through `tauri-plugin-updater`'s
# reqwest — which is why CDLA-Permissive-2.0 is already in `deny.toml`. The note
# that used to be here worried about vendoring Mozilla's roots twice; that data
# arrives either way, and this only makes a second consumer of it.
#
# What it does not change is the trust store, which is the reason the provider
# was chosen: on Windows `native-tls` is schannel, verifying against the
# *machine's* store. That is what makes a request work behind a corporate proxy
# terminating TLS with a private root — the exact network a new developer at a
# company is most likely to be on, and not a case a bundled CA list can ever be
# taught about. `rustls` would fix the trust store at compile time instead.
ureq = { version = "3", default-features = false, features = [
    "native-tls",
    "json",
    "gzip",
] }

# A release asset is a zip. `default-features = false` drops bzip2, zstd and the
# rest of the codec list; a release built by the workflow in `docs/dev/
# releases.md` is deflate, and a format nobody produces is a decompressor
# nobody audits.
zip = { version = "2", default-features = false, features = ["deflate"] }

# Checksums. The distribution decision in `docs/tool-protocol.md` §6 is a
# release artifact verified before anything executes, and this is the verifying.
sha2 = "0.10"

# The token for a private repository, in the OS credential store rather than in
# `plugins.json`. Windows Credential Manager here; the crate abstracts the other
# two platforms for the day they are supported.
keyring = { version = "3", features = ["windows-native"] }

# Driving the shell's own interface from an MCP tool — screenshots, clicks and
# keystrokes. See `src/devtools.rs`.
#
# Neither is a new dependency in any real sense: wry already pulls both in, at
# these versions, because it is what builds the webview in the first place. What
# is named here is only that this crate calls them itself.
#
# The alternative was a debug port and a second process, which is what the
# earlier `scripts/kaava-ui.mjs` did. `CallDevToolsProtocolMethod` is the same
# protocol over the COM interface Tauri already holds, so there is no socket, no
# environment variable read at launch, and nothing an agent could point at a
# build somebody is using.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"

# One call — `SetErrorMode`, in `lib.rs`'s `quiet_hard_errors`, which stops
# Windows showing a modal box on this process's behalf when `CreateProcess` is
# handed an image it will not load. See issue #36.
#
# Not a new tree. `windows-sys` 0.61 is already here through the crates that
# reach Win32, and the only thing underneath it is `windows-link`, also already
# present. Named directly because this crate now calls it itself.
#
# `windows-sys` rather than the `windows` crate `webview2-com` brings in, and
# the difference is what a binding *is*: `windows-sys` is raw `extern`
# declarations, which is the whole of what a bitmask setter needs, where
# `windows` wraps every call in generated types this would not use.
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug"] }

[dev-dependencies]
# A throwaway git repository for `mcp::config`'s drift tests. Those read the
# *committed* `.mcp.json` rather than the working copy, and proving that they do
# needs a repository whose two halves can be made to disagree — not this one,
# which a test must never dirty. Already a workspace dependency, pinned once
# there and used the same way by `schematify-core`; nothing shipped links it.
tempfile.workspace = true
